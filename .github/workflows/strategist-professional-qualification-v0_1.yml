name: Strategist Professional Qualification v0.1

on:
  push:
    branches:
      - agent/strategist-professional-rebuild-2026-08-20
    paths:
      - 'architect/research/growth-strategy-experiment-portfolio/**'
      - 'architect/evaluation/growth_strategy_experiment_portfolio/**'
      - '.github/workflows/strategist-professional-qualification-v0_1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'architect/research/growth-strategy-experiment-portfolio/**'
      - 'architect/evaluation/growth_strategy_experiment_portfolio/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heldout-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing BYOK evaluation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai
      - name: Compile qualification runner
        run: python -m py_compile architect/evaluation/growth_strategy_experiment_portfolio/qualification_openai_v0_1.py
      - name: Execute fresh held-out qualification
        id: qualification
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRATEGIST_EVAL_MODEL: gpt-5-mini
        run: |
          set +e
          mkdir -p .tmp/strategist-qualification-v0.1
          python architect/evaluation/growth_strategy_experiment_portfolio/qualification_openai_v0_1.py > .tmp/strategist-qualification-v0.1/runtime.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist non-secret qualification summary and diagnostics on branch
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p docs/qualification-results
          if [ -f .tmp/strategist-qualification-v0.1/summary.json ]; then
            cp .tmp/strategist-qualification-v0.1/summary.json docs/qualification-results/strategist-v0.1-latest.json
          else
            printf '{"heldout_round_pass":false,"infrastructure_error":true,"note":"qualification terminated before producing summary"}\n' > docs/qualification-results/strategist-v0.1-latest.json
          fi
          if [ -f .tmp/strategist-qualification-v0.1/runtime.log ]; then
            tail -n 80 .tmp/strategist-qualification-v0.1/runtime.log > docs/qualification-results/strategist-v0.1-runtime.log
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/qualification-results/strategist-v0.1-latest.json docs/qualification-results/strategist-v0.1-runtime.log || true
          git commit -m 'eval: record strategist v0.1 BYOK qualification diagnostics' || exit 0
          git push origin HEAD:agent/strategist-professional-rebuild-2026-08-20
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategist-professional-qualification-v0_1-${{ github.sha }}
          path: .tmp/strategist-qualification-v0.1
      - name: Enforce qualification gate
        if: steps.qualification.outputs.exit_code != '0'
        run: exit 1
