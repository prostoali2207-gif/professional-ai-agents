name: Visual Design Art Direction R3 ciphertext binding static
on:
  pull_request:
    paths:
      - 'architect/evaluation/visual-design-art-direction/release-configuration-r3-binding-correction-2.json'
      - 'architect/evaluation/visual-design-art-direction/semantic/run_r3_semantic_qualification_v0_1_bindingfix2.py'
      - '.github/workflows/visual-design-art-direction-r3-semantic-qualification-v3.yml'
      - '.github/workflows/visual-design-art-direction-r3-semantic-ciphertext-binding-static.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify correction is evaluator-only and pre-scored-candidate
        run: |
          python -m py_compile architect/evaluation/visual-design-art-direction/semantic/run_r3_semantic_qualification_v0_1_bindingfix2.py
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.load(open('architect/evaluation/visual-design-art-direction/release-configuration-r3-binding-correction-2.json'))
          assert f['candidate_calls_before_correction']==0
          assert f['failed_preflight_run']==33293434618
          assert f['allowed_correction_only']['incorrect_value']=='04edc998022ae2ec524cec2e366c2644e46964c052030c5faddec320c7e94f1b'
          assert f['allowed_correction_only']['correct_value']=='cc9c98ba5315160a0071300be5397ec3f9cd2b0e6b085a0a693162ffdc1cf94a'
          assert f['immutable_source_evidence']['artifact_zip_digest']=='sha256:04edc998022ae2ec524cec2e366c2644e46964c052030c5faddec320c7e94f1b'
          assert f['same_failed_run_resume_allowed'] is False
          paid=Path('.github/workflows/visual-design-art-direction-r3-semantic-qualification-v3.yml').read_text()
          trigger=paid.split('permissions:',1)[0]
          assert 'pull_request:' not in trigger and 'push:' not in trigger
          assert '/run-visual-r3-semantic-v3' in paid
          assert 'EXACT_R3_INTERNAL_CIPHERTEXT_PASS' in paid
          assert 'cc9c98ba5315160a0071300be5397ec3f9cd2b0e6b085a0a693162ffdc1cf94a' in paid
          print('VISUAL_R3_CIPHERTEXT_BINDING_STATIC_PASS')
          PY
