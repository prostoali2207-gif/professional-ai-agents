name: Real Tool Security Sandbox v0.1

on:
  push:
    branches:
      - research/research-architecture-benchmark-2026-08
    paths:
      - 'architect/research/benchmark/real-tool-security-sandbox-v0.1.py'
      - '.github/workflows/real-tool-security-sandbox-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic real-tool security preflight
        run: python architect/research/benchmark/real-tool-security-sandbox-v0.1.py
      - name: Upload audit record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-tool-security-sandbox-v0.1-record
          path: architect/research/benchmark/runs/real-tool-security-sandbox-v0.1.json
          if-no-files-found: error
