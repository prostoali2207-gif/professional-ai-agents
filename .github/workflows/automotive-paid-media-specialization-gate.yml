name: Automotive Paid Media Specialization Gate

on:
  push:
    branches:
      - agent/automotive-paid-media-specialization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deterministic preflight
        run: |
          python -m py_compile architect/evaluation/automotive_paid_media/run_semantic_gate.py
          cd architect/evaluation/automotive_paid_media
          python -m unittest -v test_contract.py

      - name: Verify retained critical evidence binding
        run: |
          grep -F 'Run 31952941002 — critical PASS' architect/evaluation/automotive_paid_media/qualification-notes.md
          grep -F '15/15 case evaluations across 3 independent trials' architect/evaluation/automotive_paid_media/qualification-notes.md
          grep -F 'sha256:882477d8941c09538576096fbe93cd286584a77d040eecf1d8c266ffab3a9179' architect/specializations/automotive-paid-media/1.0.0/specialization.md

      - name: Require Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY"

      - name: Complete affected automotive release suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_MODEL: gemini-3.1-flash-lite
          GEMINI_THINKING_LEVEL: medium
          AUTO_TRIALS: '1'
          AUTO_BATCH_SIZE: '5'
        run: |
          rm -rf .tmp/automotive-paid-media
          python architect/evaluation/automotive_paid_media/run_semantic_gate.py

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automotive-paid-media-release-${{ github.sha }}
          path: .tmp/automotive-paid-media
          if-no-files-found: ignore
