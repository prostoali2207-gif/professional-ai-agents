name: Sales 0.4 r10 exact-pack resume static gate

on:
  pull_request:
    paths:
      - 'architect/evaluation/sales-lead-conversion/qualification-resume-v0_4-r10-runtime-import.json'
      - '.github/workflows/sales-0-4-gemini-r10-runtime-resume*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify exact-pack resume contract
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=json.loads(Path('architect/evaluation/sales-lead-conversion/qualification-resume-v0_4-r10-runtime-import.json').read_text())
          assert p['resume_id']=='sales-0.4-r10-runtime-import-resume-2026-08-30'
          assert p['cycle_id']=='sales-0.4-fresh-independent-2026-08-30-r10-gemini-groq'
          assert p['classification']=='PRE_SCORE_RUNTIME_IMPORT_REMEDIATION'
          s=p['source_run']; assert s['run_id']==33301954952 and s['job_id']==99231658265 and s['scored_candidate_calls']==0 and s['canary_status']=='PASS'
          c=p['frozen_candidate']; assert c['commit']=='d00bb8057ba0eaae24b918e13941fb61b0b8616d' and c['artifact_digest']=='sha256:ce111538b204c4c694404a4b4ff13010c3909cc6918a9241600c818462fb62f0'
          pack=p['exact_scoring_pack']; assert pack['artifact_id']==9729260542 and pack['artifact_name']=='sales-0.4-r10-gemini-encrypted-heldout-pack' and pack['pack_digest']=='sha256:f22b1837d6891191129c0ecedf1a630c4200c127eef24aa18db7cc14f7bb105b' and pack['fixture_count']==36
          fix=p['runtime_fix']; assert fix['semantic_change'] is False and fix['candidate_change'] is False and fix['grader_change'] is False and fix['pack_change'] is False and fix['threshold_change'] is False and fix['retry_policy_change'] is False
          assert subprocess.check_output(['git','hash-object',fix['missing_module_path']],text=True).strip()==fix['missing_module_blob']=='7c07caa9a633d5bf96db528c6a6d9dfeae2825f2'
          t=p['thresholds']; assert t['task_pass_score_min']==5 and t['release_tasks_passed_min']==34 and t['per_family_tasks_passed_min']==2 and t['critical_hard_fails_max']==0 and t['professional_failure_retry']==0
          r=p['runtime']; assert r['provider']=='gemini-interactions-api' and r['candidate_model']=='gemini-3.5-flash-lite' and r['grader_model']=='gemini-3.5-flash-lite' and r['minimum_seconds_between_requests']==6.0
          print('SALES_V04_R10_RESUME_CONTRACT_PASS')
          PY
      - name: Verify workflow is exact-pack only and manual opt-in
        run: |
          python - <<'PY'
          from pathlib import Path
          paid=Path('.github/workflows/sales-0-4-gemini-r10-runtime-resume.yml').read_text()
          optin=Path('.github/workflows/sales-0-4-gemini-r10-runtime-resume-optin.yml').read_text()
          assert 'workflow_dispatch:' in paid and 'workflow_call:' in paid and 'push:' not in paid and 'pull_request:' not in paid
          assert '33301954952' in paid and 'sales-0.4-r10-gemini-encrypted-heldout-pack' in paid
          assert 'sha256:f22b1837d6891191129c0ecedf1a630c4200c127eef24aa18db7cc14f7bb105b' in paid
          assert 'PYTHONPATH' in paid and 'gemini_rate_limiter' in paid
          assert 'author_sealed_pack' not in paid and 'reseal_provider_pack.py' not in paid and 'GROQ_API_KEY' not in paid
          assert "github.event.label.name == 'run-sales-0-4-r10-runtime-resume'" in optin and 'types: [labeled]' in optin
          print('SALES_V04_R10_RESUME_WORKFLOW_PASS')
          PY
