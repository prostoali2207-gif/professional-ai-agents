name: Sales 0.5 fresh held-out r5 split qualification

on:
  workflow_dispatch:
    inputs:
      confirm_provider_run:
        required: true
        default: 'NO'
        description: 'Type RUN to execute the preregistered Sales 0.5 r5 split FULL qualification'
  workflow_call:
    inputs:
      confirm_provider_run: {required: true, type: string}
    secrets:
      GEMINI_API_KEY: {required: true}
      GROQ_API_KEY: {required: true}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: {required: true}

permissions:
  contents: read
  actions: read

env:
  CYCLE_ID: sales-0.5-fresh-independent-2026-08-30-r5-gemini-groq
  CANDIDATE_COMMIT: 2b8a397d16f2b0e8d7ad93c341f0031ec7dce4df
  CANDIDATE_DIGEST: sha256:0e7b46f186269968df12d09f64d48c88e173196a8b59f69a4e1ba1a049f4f1d9
  SALES_MODEL: gemini-3.5-flash-lite
  SALES_GRADER_MODEL: gemini-3.5-flash-lite
  SALES_MODEL_TIMEOUT_SECONDS: '120'
  GEMINI_MIN_INTERVAL_SECONDS: '6.0'
  R5_DELTA: architect/evaluation/sales-lead-conversion/qualification-preregistration-v0_5-r5-gemini-groq.json
  EFFECTIVE_PREREGISTRATION: sales-v05-r5-effective-prereg.json
  SOURCE_MANIFEST: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.5-r5-author/qualification.json
  SCORING_PACK_DIR: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.5-r5-gemini
  QUALIFICATION_MANIFEST: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.5-r5-gemini/qualification.json
  QUALIFICATION_FIXTURE_COUNT: '36'
  QUALIFICATION_RELEASE_TASKS_PASSED_MIN: '34'
  QUALIFICATION_PER_FAMILY_TASKS_PASSED_MIN: '2'
  QUALIFICATION_TASK_PASS_SCORE_MIN: '5'
  QUALIFICATION_CRITICAL_HARD_FAILS_MAX: '0'
  PYTHONPATH: architect/evaluation/sales-lead-conversion

jobs:
  author:
    if: ${{ inputs.confirm_provider_run == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      scoring_artifact_id: ${{ steps.upload_scoring.outputs.artifact-id }}
      scoring_artifact_digest: ${{ steps.upload_scoring.outputs.artifact-digest }}
      pack_digest: ${{ steps.pack_binding.outputs.pack_digest }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deterministic qualification dependencies
        run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Assemble effective r5 preregistration before any model call
        run: python architect/evaluation/sales-lead-conversion/effective_prereg_v0_5_r5.py "$EFFECTIVE_PREREGISTRATION"
      - name: Deterministic Sales 0.5 r5 frozen and split checks
        shell: bash
        run: |
          python -m py_compile architect/evaluation/sales-lead-conversion/effective_prereg_v0_5_r5.py architect/evaluation/sales-lead-conversion/author_sealed_pack_v0_5_r5_gemini_groq.py architect/evaluation/sales-lead-conversion/sealed_runner_provider_wrapper_v0_5_gemini_r5.py architect/evaluation/sales-lead-conversion/executor_v0_5_gemini_contract_v1.py architect/evaluation/sales-lead-conversion/canary_v0_5_gemini.py
          python - <<'PY'
          import hashlib,json,os,subprocess
          d=json.load(open(os.environ['R5_DELTA'])); p=json.load(open(os.environ['EFFECTIVE_PREREGISTRATION']))
          assert p['cycle_id']==os.environ['CYCLE_ID'] and p['scope']['decision']=='FULL' and p['fixture_count']==36 and p['per_family']==3
          assert p['frozen_candidate']['commit']==os.environ['CANDIDATE_COMMIT'] and p['frozen_candidate']['artifact_digest']==os.environ['CANDIDATE_DIGEST']
          r4=d['prior_sanitized_evidence']['r4']; assert r4['run_id']==33315346775 and r4['full_scoring_started'] is True and r4['sanitized_report_written'] is False and r4['checkpoint_available'] is False and r4['pack_reuse_for_scoring_allowed'] is False
          split=d['execution_split_remediation']; assert split['fresh_r5_pack_required'] is True and split['r4_pack_reuse_allowed'] is False and split['partial_r4_resume_allowed'] is False and split['author_job_timeout_minutes']==180 and split['scoring_job_timeout_minutes']==180
          for key in ('candidate_change_allowed','grader_change_allowed','threshold_change_allowed','hard_fail_change_allowed','candidate_provider_change_allowed','candidate_model_change_allowed','professional_retry_change_allowed'): assert split[key] is False
          pr=d['provider_resilience_remediation']; assert pr['provider']=='groq-openai-compatible-api' and pr['model']=='openai/gpt-oss-120b' and pr['retry_count']==1 and pr['maximum_wait_seconds']==2700 and pr['judge_identity_change'] is False and pr['model_change'] is False
          t=p['thresholds']; assert t['release_tasks_passed_min']==34 and t['per_family_tasks_passed_min']==2 and t['task_pass_score_min']==5 and t['critical_hard_fails_max']==0 and t['professional_failure_retry']==0
          assert p['fixture_design']['expected_candidate_runs_if_full']==42 and len(p['fixture_design']['repeated_fixture_slots'])==6
          r=p['runtime_contract']; assert r['provider']=='gemini-interactions-api' and r['candidate_model']=='gemini-3.5-flash-lite' and r['grader_model']=='gemini-3.5-flash-lite' and r['minimum_seconds_between_requests']==6.0
          commit=os.environ['CANDIDATE_COMMIT']; m=json.loads(subprocess.check_output(['git','show',f"{commit}:{p['frozen_candidate']['manifest_path']}"],text=True)); canonical=''
          for path in m['artifact']['paths']: canonical += f"{path}:{subprocess.check_output(['git','rev-parse',f'{commit}:{path}'],text=True).strip()}\n"
          actual='sha256:'+hashlib.sha256(canonical.encode()).hexdigest(); assert actual==os.environ['CANDIDATE_DIGEST']==m['artifact']['content_digest']
          c=json.loads(subprocess.check_output(['python','architect/evaluation/sales-lead-conversion/executor_v0_5_gemini_contract_v1.py','--qualification-contract'],text=True)); assert c['candidate_commit']==commit and c['candidate_digest']==actual and c['provider']=='gemini-interactions-api' and c['core']=='sales-lead-conversion/0.5.0'
          print('SALES_V05_R5_STATIC_FREEZE_SPLIT_PASS')
          PY
      - name: Require authoring credentials
        run: |
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY"
          test -n "$GEMINI_API_KEY"
          test -n "$GROQ_API_KEY"
      - name: Author audit and immediately seal fresh Sales 0.5 r5 corpus
        shell: bash
        run: |
          set +e
          python architect/evaluation/sales-lead-conversion/author_sealed_pack_v0_5_r5_gemini_groq.py | tee sales-v05-r5-author-safe-freeze.json
          echo "author_exit_code=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0
      - name: Upload sanitized Sales 0.5 r5 authoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.5-r5-authoring-sanitized-evidence
          path: sales-v05-r5-author-safe-freeze.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve encrypted fresh source pack before transport
        if: env.author_exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.5-r5-source-encrypted-heldout-pack
          path: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.5-r5-author
          if-no-files-found: error
          retention-days: 14
      - name: Verify freshly authored sealed source corpus
        if: env.author_exit_code == '0'
        id: source_preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$SOURCE_MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/sales-v05-r5-source"
      - name: Resolve source pack digest for reseal
        if: env.author_exit_code == '0' && steps.source_preflight.outcome == 'success'
        run: echo "SOURCE_PACK_DIGEST=$(python -c 'import json,os; print(json.load(open(os.environ["SOURCE_MANIFEST"]))["sealed_pack"]["pack_digest"])')" >> "$GITHUB_ENV"
      - name: Re-seal unchanged fresh corpus with frozen Gemini runner
        if: env.author_exit_code == '0' && steps.source_preflight.outcome == 'success'
        id: reseal
        run: |
          test -n "$SOURCE_PACK_DIGEST"
          python architect/evaluation/sales-lead-conversion/reseal_provider_pack.py --source-dir "$RUNNER_TEMP/sales-v05-r5-source" --runner architect/evaluation/sales-lead-conversion/sealed_runner_provider_wrapper_v0_5_gemini_r5.py --out "$SCORING_PACK_DIR" --cycle-id "$CYCLE_ID"
          python - <<'PY'
          import json,os
          p=os.environ['QUALIFICATION_MANIFEST']; m=json.load(open(p)); path='architect/evaluation/sales-lead-conversion/executor_v0_5_gemini_contract_v1.py'
          m['candidate']['manifest_path']='architect/library/cores/sales-lead-conversion/0.5.0/manifest.json'
          m['runtime']['executor_path']=path; m['runtime']['executor_cmd']='python '+path; m['runtime']['contract_probe_argv']=['python',path,'--qualification-contract']; m['runtime']['canary_cmd']='python architect/evaluation/sales-lead-conversion/canary_v0_5_gemini.py'
          open(p,'w').write(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
      - name: Generic static preflight before artifact boundary
        if: env.author_exit_code == '0' && steps.reseal.outcome == 'success'
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase static --require-runtime-secret
      - name: Generic sealed no-API preflight before artifact boundary
        if: env.author_exit_code == '0' && steps.reseal.outcome == 'success'
        id: sealed_preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/sales-v05-r5-author-pack-check"
      - name: Bind internal scoring pack digest
        if: env.author_exit_code == '0' && steps.sealed_preflight.outcome == 'success'
        id: pack_binding
        run: echo "pack_digest=$(python -c 'import json,os; print(json.load(open(os.environ["QUALIFICATION_MANIFEST"]))["sealed_pack"]["pack_digest"])')" >> "$GITHUB_OUTPUT"
      - name: Preserve exact r5 scoring pack before any candidate call
        if: env.author_exit_code == '0' && steps.sealed_preflight.outcome == 'success'
        id: upload_scoring
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.5-r5-gemini-encrypted-heldout-pack
          path: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.5-r5-gemini
          if-no-files-found: error
          retention-days: 14
      - name: Enforce author job ready for independent scoring job
        if: always()
        run: |
          test "${author_exit_code:-missing}" = 0
          test "${{ steps.source_preflight.outcome }}" = success
          test "${{ steps.reseal.outcome }}" = success
          test "${{ steps.sealed_preflight.outcome }}" = success
          test -n "${{ steps.pack_binding.outputs.pack_digest }}"
          test -n "${{ steps.upload_scoring.outputs.artifact-id }}"
          test -n "${{ steps.upload_scoring.outputs.artifact-digest }}"

  scoring:
    needs: author
    if: ${{ inputs.confirm_provider_run == 'RUN' && needs.author.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      SALES_EXECUTOR_CMD: python architect/evaluation/sales-lead-conversion/executor_v0_5_gemini_contract_v1.py
      SANITIZED_REPORT_PATH: sales-v05-r5-gemini-report.json
      GEMINI_PACE_FILE: /tmp/sales-v05-r5-gemini-pace
      EXPECTED_ARTIFACT_ID: ${{ needs.author.outputs.scoring_artifact_id }}
      EXPECTED_ARTIFACT_DIGEST: ${{ needs.author.outputs.scoring_artifact_digest }}
      EXPECTED_PACK_DIGEST: ${{ needs.author.outputs.pack_digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deterministic qualification dependencies
        run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Assemble exact effective r5 preregistration
        run: python architect/evaluation/sales-lead-conversion/effective_prereg_v0_5_r5.py "$EFFECTIVE_PREREGISTRATION"
      - name: Require scoring credentials and author-job bindings
        run: |
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY"
          test -n "$GEMINI_API_KEY"
          test -n "$EXPECTED_ARTIFACT_ID"
          test -n "$EXPECTED_ARTIFACT_DIGEST"
          test -n "$EXPECTED_PACK_DIGEST"
      - name: Verify same-run scoring artifact metadata before download
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}" > sales-v05-r5-artifact-meta.json
          python - <<'PY'
          import json,os
          a=json.load(open('sales-v05-r5-artifact-meta.json'))
          assert str(a['id'])==os.environ['EXPECTED_ARTIFACT_ID']
          assert a['name']=='sales-0.5-r5-gemini-encrypted-heldout-pack'
          assert a['digest']==os.environ['EXPECTED_ARTIFACT_DIGEST']
          assert int(a['workflow_run']['id'])==int(os.environ['GITHUB_RUN_ID'])
          assert not a['expired']
          print('SALES_V05_R5_SAME_RUN_ARTIFACT_META_PASS')
          PY
      - name: Download exact r5 scoring pack produced by author job
        uses: actions/download-artifact@v4
        with:
          name: sales-0.5-r5-gemini-encrypted-heldout-pack
          path: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.5-r5-gemini
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Verify exact pack candidate and release binding before candidate calls
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          d=json.load(open(os.environ['R5_DELTA'])); p=json.load(open(os.environ['EFFECTIVE_PREREGISTRATION'])); m=json.load(open(os.environ['QUALIFICATION_MANIFEST']))
          assert p['cycle_id']==m['cycle_id']==os.environ['CYCLE_ID']
          assert d['execution_split_remediation']['fresh_r5_pack_required'] is True and d['execution_split_remediation']['r4_pack_reuse_allowed'] is False
          assert m['candidate']['commit']==os.environ['CANDIDATE_COMMIT'] and m['candidate']['digest']==os.environ['CANDIDATE_DIGEST']
          assert m['sealed_pack']['pack_digest']==os.environ['EXPECTED_PACK_DIGEST']
          assert p['fixture_count']==36 and p['per_family']==3 and p['fixture_design']['expected_candidate_runs_if_full']==42
          t=p['thresholds']; assert t['release_tasks_passed_min']==34 and t['per_family_tasks_passed_min']==2 and t['task_pass_score_min']==5 and t['critical_hard_fails_max']==0 and t['professional_failure_retry']==0
          commit=os.environ['CANDIDATE_COMMIT']; cm=json.loads(subprocess.check_output(['git','show',f"{commit}:{p['frozen_candidate']['manifest_path']}"],text=True)); canonical=''
          for path in cm['artifact']['paths']: canonical += f"{path}:{subprocess.check_output(['git','rev-parse',f'{commit}:{path}'],text=True).strip()}\n"
          actual='sha256:'+hashlib.sha256(canonical.encode()).hexdigest(); assert actual==os.environ['CANDIDATE_DIGEST']==cm['artifact']['content_digest']
          print('SALES_V05_R5_EXACT_PACK_BINDING_PASS',os.environ['EXPECTED_PACK_DIGEST'])
          PY
      - name: Generic static preflight on downloaded exact pack
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase static --require-runtime-secret
      - name: Generic sealed no-API preflight on downloaded exact pack
        id: sealed_preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/sales-v05-r5-scoring-pack"
      - name: Exact-runtime paced Gemini canary in scoring job
        if: steps.sealed_preflight.outcome == 'success'
        id: canary
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase canary --require-runtime-secret
      - name: Run preregistered FULL paced qualification exactly once
        if: steps.canary.outcome == 'success'
        shell: bash
        run: |
          set +e
          python "$RUNNER_TEMP/sales-v05-r5-scoring-pack/runner.py"
          echo "qualification_exit_code=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Validate sanitized r5 report
        if: always() && steps.sealed_preflight.outcome == 'success' && steps.canary.outcome == 'success'
        id: validate
        run: python architect/evaluation/qualification-platform/validate_sanitized_report.py --report "$SANITIZED_REPORT_PATH" --preregistration "$EFFECTIVE_PREREGISTRATION" --cycle-id "$CYCLE_ID" --candidate-commit "$CANDIDATE_COMMIT" --candidate-digest "$CANDIDATE_DIGEST" --pack-digest "$EXPECTED_PACK_DIGEST" --model "$SALES_MODEL" --runner-exit-code "${qualification_exit_code:-255}" --ledger-out sales-v05-r5-gemini-release-evidence.json
      - name: Upload sanitized r5 qualification evidence
        if: always() && steps.validate.outcome == 'success'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.5-r5-gemini-sanitized-qualification-evidence
          path: |
            sales-v05-r5-gemini-report.json
            sales-v05-r5-gemini-release-evidence.json
            sales-v05-r5-effective-prereg.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce frozen r5 verdict protocol
        if: always()
        run: |
          test "${{ steps.sealed_preflight.outcome }}" = success
          test "${{ steps.canary.outcome }}" = success
          test "${{ steps.validate.outcome }}" = success
          test "${{ steps.upload.outcome }}" = success
          case "${qualification_exit_code:-missing}" in
            0) python -c "import json; assert json.load(open('sales-v05-r5-gemini-report.json')).get('verdict') in {'PASS','REVISE'}" ;;
            10) python -c "import json; assert json.load(open('sales-v05-r5-gemini-report.json')).get('verdict') == 'REVISE'" ;;
            *) exit 1 ;;
          esac
