name: Visual Design Art Direction v0.2 R4 heldout author
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  author:
    if: github.event.issue.number == 158 && github.event.comment.body == '/author-visual-heldout-r4-v02' && github.actor == 'prostoali2207-gif'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      GROQ_MIN_INTERVAL_SECONDS: '60'
      GROQ_PACE_FILE: /tmp/visual-v02-heldout-r4-groq-pace
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Static preflight before credentials
        run: |
          python -m py_compile architect/evaluation/visual-design-art-direction/heldout/author_sealed_heldout_r4_v02.py
          python - <<'PY'
          import subprocess
          from pathlib import Path
          p=Path('architect/evaluation/visual-design-art-direction/heldout/author_sealed_heldout_r4_v02.py').read_text()
          assert "CANDIDATE_COMMIT = '0116d20f99fde919fa6e39c700726d16310d010b'" in p
          assert "MAX_ATTEMPTS_PER_FAMILY = 3" in p
          assert "'response_format':" in p and "'mime_type': 'application/json'" in p and "'schema': AUTHOR_SCHEMA" in p
          assert "candidate_calls': 0" in p and "historical_r3_reused': False" in p
          assert 'candidate_response' not in p and 'CANDIDATE_EXECUTOR' not in p
          assert subprocess.check_output(['git','rev-parse','HEAD:architect/evaluation/visual-design-art-direction/candidate/SKILL.md'],text=True).strip()=='b230a06aeca3cc67d0c275889a65b8b7403b59c0'
          assert subprocess.check_output(['git','rev-parse','HEAD:architect/evaluation/visual-design-art-direction/professional-model-candidate-v0.1.md'],text=True).strip()=='bbea595e299445cf79f798ed1e86eecd0b53cd50'
          assert subprocess.check_output(['git','rev-parse','HEAD:architect/evaluation/visual-design-art-direction/professional-model-p0-repair-v0.2.md'],text=True).strip()=='bad4e815a3898dd19c7dfc0a07dd4c1aeeab3d50'
          print('VISUAL_V02_R4_STATIC_PASS')
          PY
      - name: Require evaluator credentials
        run: |
          test -n "$GEMINI_API_KEY" || exit 22
          test -n "$GROQ_API_KEY" || exit 24
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || exit 23
      - name: Install sealing dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Author audit and seal fresh R4 corpus
        run: python architect/evaluation/visual-design-art-direction/heldout/author_sealed_heldout_r4_v02.py
      - name: Verify sealed manifest
        run: |
          python - <<'PY'
          import json
          p='architect/evaluation/visual-design-art-direction/heldout/sealed-r4-v02/heldout-r4.manifest.json'
          m=json.load(open(p))
          assert m['cycle_id']=='visual-design-art-direction-0.2.0-independent-2026-08-30-r4-semantic'
          assert m['candidate_commit']=='0116d20f99fde919fa6e39c700726d16310d010b'
          assert m['candidate_blobs']=={
            'skill':'b230a06aeca3cc67d0c275889a65b8b7403b59c0',
            'professional_model_base':'bbea595e299445cf79f798ed1e86eecd0b53cd50',
            'professional_model_repair':'bad4e815a3898dd19c7dfc0a07dd4c1aeeab3d50'}
          assert m['item_count']==20 and m['family_count']==10 and m['pair_count']==5
          assert m['authoring_policy']=={'mode':'family_first_pass_schema_enforced','max_attempts_per_family':3}
          assert m['candidate_calls']==0 and m['hidden_content_printed'] is False and m['historical_r3_reused'] is False
          assert all(1 <= int(v) <= 3 for v in m['attempts_used'].values()) and len(m['attempts_used'])==10
          print('VISUAL_V02_R4_SEAL_PASS',m['ciphertext_sha256'])
          PY
      - name: Upload encrypted R4 heldout pack
        uses: actions/upload-artifact@v4
        with:
          name: visual-design-art-direction-v0-2-encrypted-heldout-pack-r4
          path: architect/evaluation/visual-design-art-direction/heldout/sealed-r4-v02
          if-no-files-found: error
          retention-days: 14
