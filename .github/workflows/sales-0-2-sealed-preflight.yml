name: Sales 0.2 sealed preflight

on:
  push:
    branches:
      - eval/sales-0.2-sealed-pack-2026-08-22
      - infra/generic-qualification-platform-2026-08-22
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    uses: ./.github/workflows/qualification-preflight-reusable.yml
    with:
      manifest_path: architect/evaluation/sales-lead-conversion/sealed/fresh-cycle-0.2-2026-08-22.qualification.json
    secrets:
      sealed_pack_key: ${{ secrets.SALES_SEALED_PACK_KEY }}
