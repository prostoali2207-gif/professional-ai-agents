name: Sales 0.2 sealed preflight

on:
  push:
    branches:
      - eval/sales-0.2-sealed-pack-2026-08-22
      - infra/generic-qualification-platform-2026-08-22
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SALES_SEALED_PACK_KEY: ${{ secrets.SALES_SEALED_PACK_KEY }}
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install qualification dependencies
        run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Static qualification preflight without API
        run: |
          python3 architect/evaluation/qualification-platform/qualification_preflight.py \
            --manifest architect/evaluation/sales-lead-conversion/sealed/fresh-cycle-0.2-2026-08-22.qualification.json \
            --phase static
      - name: Sealed held-out integrity preflight
        run: |
          python3 architect/evaluation/qualification-platform/qualification_preflight.py \
            --manifest architect/evaluation/sales-lead-conversion/sealed/fresh-cycle-0.2-2026-08-22.qualification.json \
            --phase sealed \
            --out-dir "$RUNNER_TEMP/sales-0.2-sealed-pack"
