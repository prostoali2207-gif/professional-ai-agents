name: Brand Naming v0.1 independent qualification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 275 &&
      github.actor == 'prostoali2207-gif' &&
      github.event.comment.body == '/run-brand-naming-v01-independent'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      GROQ_MIN_INTERVAL_SECONDS: '60'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography
      - name: Verify exact independent contract before credentials
        run: |
          python -m py_compile architect/evaluation/brand-naming-practitioner/independent/run_qualification_v0_1.py
          python - <<'PY'
          import json, subprocess
          x=json.load(open('architect/evaluation/brand-naming-practitioner/independent/preregistration-v0.1.json'))
          assert x['cycle_id']=='brand-naming-practitioner-v0.1-independent-2026-09-04'
          assert x['freeze_state']=='FROZEN_PRE_CANDIDATE_OUTCOME' and x['candidate_calls_at_freeze']==0
          assert len(x['families'])==12 and len(x['p0_hard_fails'])==9
          assert x['calibration']['must_run_before_candidate_calls'] is True
          assert x['calibration']['expected_winner_rate_min']==1.0
          assert x['semantic_thresholds']=={'p0_tolerance':0,'required_case_passes':12,'case_count':12,'minimum_dimension_score':1,'maximum_dimension_score':2}
          assert x['creative_comparative_thresholds']['candidate_preference_min']==3
          assert x['resource_gate']['professional_failure_retry_count']==0
          base=x['base_commit']; c=x['candidate']
          paths={
            'freeze_blob':'architect/evaluation/brand-naming-practitioner/candidate-freeze-v0.1.json',
            'professional_model_blob':'architect/evaluation/brand-naming-practitioner/professional-model-candidate-v0.1.md',
            'skill_blob':'architect/evaluation/brand-naming-practitioner/candidate/SKILL.md',
          }
          for key,path in paths.items():
              assert subprocess.check_output(['git','rev-parse',f'{base}:{path}'],text=True).strip()==c[key]
          print('BRAND_NAMING_V01_FROZEN_CONTRACT_PASS candidate_calls=0')
          PY
      - name: Require qualification credentials
        run: |
          test -n "$GEMINI_API_KEY" || exit 22
          test -n "$GROQ_API_KEY" || exit 23
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || exit 24
      - name: Run frozen independent qualification
        id: qualification
        shell: bash
        run: |
          set +e
          python architect/evaluation/brand-naming-practitioner/independent/run_qualification_v0_1.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload encrypted held-out pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-naming-v01-encrypted-heldout
          path: |
            brand-naming-v01-heldout.enc
            brand-naming-v01-heldout-manifest.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload sanitized progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-naming-v01-progress
          path: brand-naming-v01-progress.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-naming-v01-sanitized-report
          path: brand-naming-v01-sanitized-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce preregistered release gate
        if: always()
        env:
          RUN_EXIT_CODE: ${{ steps.qualification.outputs.exit_code }}
        run: |
          test -f brand-naming-v01-progress.json || exit 31
          python - <<'PY'
          import json, os
          p=json.load(open('brand-naming-v01-progress.json'))
          assert p['hidden_content_printed'] is False
          status=p['status']
          code=os.environ.get('RUN_EXIT_CODE','')
          if status=='INFRASTRUCTURE_FAILURE':
              print('BRAND_NAMING_V01_NOT_EXECUTABLE_OR_REPAIR_GATE')
              raise SystemExit(30)
          if not os.path.exists('brand-naming-v01-sanitized-report.json'):
              raise SystemExit(31)
          r=json.load(open('brand-naming-v01-sanitized-report.json'))
          assert r['hidden_content_printed'] is False
          assert r.get('library_admission_performed') is False
          if r['status']=='QUALIFICATION_PASS':
              assert code=='0'
              assert r['calibration']['pass'] is True and r['calibration']['candidate_calls_at_calibration']==0
              assert r['semantic']['case_passes']==12 and r['semantic']['p0_count']==0
              assert r['creative_comparative']['candidate_preferred']>=3
              assert r['creative_comparative']['critical_issues']==0
              print('BRAND_NAMING_V01_QUALIFICATION_PASS')
              raise SystemExit(0)
          if r['status']=='CALIBRATION_FAIL': raise SystemExit(22)
          if r['status']=='QUALIFICATION_REVISE': raise SystemExit(20)
          if r['status']=='QUALIFICATION_FAIL_P0': raise SystemExit(21)
          raise SystemExit(32)
          PY
