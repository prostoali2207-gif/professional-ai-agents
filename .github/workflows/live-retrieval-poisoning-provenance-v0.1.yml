name: Live Retrieval Poisoning Provenance v0.1

on:
  push:
    branches:
      - research/research-architecture-benchmark-2026-08
    paths:
      - 'architect/research/benchmark/live-retrieval-poisoning-provenance-v0.1.py'
      - '.github/workflows/live-retrieval-poisoning-provenance-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-poisoning-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MCP client
        run: python -m pip install --disable-pip-version-check 'mcp>=2,<3'
      - name: Run live retrieval poisoning provenance gate
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python architect/research/benchmark/live-retrieval-poisoning-provenance-v0.1.py
      - name: Upload audit record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-retrieval-poisoning-provenance-v0.1-record
          path: architect/research/benchmark/runs/live-retrieval-poisoning-provenance-v0.1.json
          if-no-files-found: error
