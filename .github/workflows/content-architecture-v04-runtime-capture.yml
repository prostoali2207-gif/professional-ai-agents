name: Content Architecture runtime capture
on:
  push:
    branches: [eval/content-architecture-v04-practical-handoff-r2]
    paths: ['architect/evaluation/content-architecture-v04-practical-handoff-r2/RUN-RUNTIME-CAPTURE']
permissions:
  contents: read
jobs:
  capture:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Capture Codex runtime without failing
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $PSNativeCommandUseErrorActionPreference=$false
          $dir=Join-Path $env:RUNNER_TEMP 'ca-runtime-capture'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $resolved=$null
          $cmd=Get-Command codex -ErrorAction SilentlyContinue
          if($cmd){$resolved=$cmd.Source}
          if(-not $resolved){
            $candidates=@((Join-Path $env:APPDATA 'npm\codex.cmd'),(Join-Path $env:APPDATA 'npm\codex.exe'),(Join-Path $env:LOCALAPPDATA 'npm\codex.cmd'),(Join-Path $env:LOCALAPPDATA 'npm\codex.exe'),(Join-Path $env:USERPROFILE '.local\bin\codex.exe'),(Join-Path $env:USERPROFILE 'scoop\shims\codex.exe'),(Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\codex.exe'))
            foreach($candidate in $candidates){if(Test-Path $candidate){$resolved=$candidate;break}}
          }
          if(-not $resolved){
            $roots=@((Join-Path $env:LOCALAPPDATA 'OpenAI\Codex\bin'),(Join-Path $env:LOCALAPPDATA 'Programs'),(Join-Path $env:USERPROFILE '.vscode\extensions'),(Join-Path $env:USERPROFILE '.cursor\extensions'))
            foreach($root in $roots){if(-not(Test-Path $root)){continue};$found=Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue|Where-Object{$_.Name -in @('codex.exe','codex.cmd')}|Select-Object -First 1;if($found){$resolved=$found.FullName;break}}
          }
          if(-not $resolved){'path=NOT_FOUND'|Set-Content (Join-Path $dir 'identity.txt');exit 0}
          "path=$resolved" | Set-Content (Join-Path $dir 'identity.txt')
          $versionOutput = & $resolved --version 2>&1 | Out-String
          $versionCode=$LASTEXITCODE
          "version_exit=$versionCode" | Add-Content (Join-Path $dir 'identity.txt')
          "version_output=$($versionOutput.Trim())" | Add-Content (Join-Path $dir 'identity.txt')
          $authOutput = & $resolved login status 2>&1 | Out-String
          $authCode=$LASTEXITCODE
          "auth_exit=$authCode" | Add-Content (Join-Path $dir 'identity.txt')
          "auth_output=$($authOutput.Trim())" | Add-Content (Join-Path $dir 'identity.txt')
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: content-architecture-v04-runtime-capture
          path: ${{ runner.temp }}/ca-runtime-capture/
          retention-days: 7
