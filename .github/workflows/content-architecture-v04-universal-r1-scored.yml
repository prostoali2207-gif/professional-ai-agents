name: Content Architecture v0.4 universal r1 scored qualification

on:
  push:
    branches:
      - eval/content-architecture-v04-universal-release-r1
    paths:
      - 'architect/evaluation/content-architecture-v04-universal-r1/SCORE-UNIVERSAL-R1-v0.1'

permissions:
  contents: read

jobs:
  prepare-wheelhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned Windows evaluator dependency
        shell: bash
        run: |
          mkdir -p wheelhouse
          python -m pip download --disable-pip-version-check --no-input --only-binary=:all: --platform win_amd64 --python-version 312 --implementation cp --abi cp312 --dest wheelhouse cryptography==44.0.2
      - uses: actions/upload-artifact@v4
        with:
          name: content-architecture-v04-universal-r1-scored-wheelhouse
          path: wheelhouse/
          retention-days: 1

  score:
    needs: prepare-wheelhouse
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      FROZEN_ARTIFACT_CODEX_MODEL: gpt-5.6-sol
      FROZEN_ARTIFACT_CODEX_REASONING: medium
      FROZEN_ARTIFACT_CODEX_TIMEOUT: '300'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: content-architecture-v04-universal-r1-scored-wheelhouse
          path: ${{ runner.temp }}/ca-v04-universal-r1-scored-wheelhouse
      - name: Install evaluator dependency offline
        shell: powershell
        run: python -m pip install --disable-pip-version-check --no-input --no-index --find-links "$env:RUNNER_TEMP\ca-v04-universal-r1-scored-wheelhouse" cryptography==44.0.2
      - name: Resolve Codex CLI from interactive user installation
        shell: powershell
        run: |
          $resolved = $null
          $cmd = Get-Command codex -ErrorAction SilentlyContinue
          if ($cmd) { $resolved = $cmd.Source }
          if (-not $resolved) {
            $candidates = @(
              (Join-Path $env:APPDATA 'npm\codex.cmd'),
              (Join-Path $env:APPDATA 'npm\codex.exe'),
              (Join-Path $env:LOCALAPPDATA 'npm\codex.cmd'),
              (Join-Path $env:LOCALAPPDATA 'npm\codex.exe'),
              (Join-Path $env:USERPROFILE '.local\bin\codex.exe'),
              (Join-Path $env:USERPROFILE 'scoop\shims\codex.exe'),
              (Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\codex.exe')
            )
            foreach ($candidate in $candidates) { if (Test-Path $candidate) { $resolved = $candidate; break } }
          }
          if (-not $resolved) {
            $npm = Get-Command npm -ErrorAction SilentlyContinue
            if ($npm) {
              $prefix = (& npm config get prefix 2>$null | Out-String).Trim()
              if ($prefix) {
                foreach ($name in @('codex.cmd','codex.exe')) {
                  $candidate = Join-Path $prefix $name
                  if (Test-Path $candidate) { $resolved = $candidate; break }
                }
              }
            }
          }
          if (-not $resolved) {
            $roots = @(
              (Join-Path $env:LOCALAPPDATA 'OpenAI\Codex\bin'),
              (Join-Path $env:LOCALAPPDATA 'Programs'),
              (Join-Path $env:USERPROFILE '.vscode\extensions'),
              (Join-Path $env:USERPROFILE '.cursor\extensions')
            )
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              $found = Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -in @('codex.exe','codex.cmd') } |
                Select-Object -First 1
              if ($found) { $resolved = $found.FullName; break }
            }
          }
          if (-not $resolved) { Write-Error 'Codex CLI not found'; exit 40 }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $resolved)
          Write-Host 'codex_cli_resolved=true'
      - name: Verify frozen universal r1 identities and runtime
        shell: powershell
        run: |
          if (-not $env:QUALIFICATION_SEALED_PACK_MASTER_KEY) { exit 31 }
          git fetch origin agent/content-architecture-core-2026-08 main
          if ((git cat-file -t 5d440e1bf3e20fbd35c6ab276310a904e36cc06d) -ne 'blob') { exit 32 }
          $checks = @(
            @('architect/evaluation/content-architecture-v04-universal-r1/author_pack_r1.py','91920346987354e38e2022b5fcb9caf0b0fcb4f1'),
            @('architect/evaluation/content-architecture-v04-universal-r1/run_universal_r1.py','48c71f1d88bfcad848538496481a0445f78d8e66'),
            @('architect/evaluation/content-architecture-v04-universal-r1/test_universal_r1.py','fde1a0e14dd2e196b64d79ac27f523eed233391a'),
            @('architect/evaluation/content-architecture-v04-universal-r1/judge-senior-practitioner.md','99bf30695e502b154d76f1d27b80ebc01ea5b4fd'),
            @('architect/evaluation/content-architecture-v04-universal-r1/judge-assessor.md','e726fdf8534ced97ea8c4fd4060f5eeb058d6f75'),
            @('architect/evaluation/content-architecture-v04-universal-r1/preregistration-r1.json','d053c4d0af47290bd234b511d8b28ab7d6fbe9aa'),
            @('architect/evaluation/harness/adapters/codex_frozen_artifact_adapter.py','d1ef178b739a638a883c5a1d0efe5e431bd3b34d'),
            @('architect/evaluation/harness/adapters/codex_frozen_artifact_mcp.py','73e9349391d4aa83dd459ed23e4069a3cf9a2072')
          )
          foreach ($item in $checks) {
            $actual = (git hash-object $item[0]).Trim()
            if ($actual -ne $item[1]) { Write-Error "Frozen blob mismatch: $($item[0])"; exit 33 }
          }
          @'
          import json, pathlib, subprocess
          p=json.loads(pathlib.Path('architect/evaluation/content-architecture-v04-universal-r1/preregistration-r1.json').read_text())
          assert p['status']=='FROZEN_PRE_SCORE'
          assert p['candidate_blob_sha']=='5d440e1bf3e20fbd35c6ab276310a904e36cc06d'
          f=p['freeze_evidence']
          assert f['status']=='FROZEN'
          assert f['corpus_identity_sha256']=='70dfeee5435add3cb72c3b7b8a55e2846691c7b63fd575efec2cd4a05013d2f1'
          assert f['calibration_report_sha256']=='6efae841d7a861bdf2fa87a2caf0b65eec185053ce39eebc1c48e68036bb44cc'
          assert f['calibration_status']=='CALIBRATION_PASS'
          assert f['pre_score_candidate_calls']==0
          auth=subprocess.run(['codex','login','status'],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=15)
          if auth.returncode != 0 or 'Logged in using ChatGPT' not in ((auth.stdout or '')+(auth.stderr or '')): raise SystemExit(41)
          ver=subprocess.run(['codex','--version'],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=15)
          version=((ver.stdout or '')+(ver.stderr or '')).strip()
          print('codex_version='+version)
          if ver.returncode != 0 or version != 'codex-cli 0.151.0-alpha.7.2': raise SystemExit(42)
          print('frozen universal r1 identity/runtime binding: PASS')
          '@ | python -
      - name: Run deterministic evaluator tests
        shell: powershell
        run: |
          python -m py_compile architect/evaluation/content-architecture-v04-universal-r1/author_pack_r1.py architect/evaluation/content-architecture-v04-universal-r1/run_universal_r1.py architect/evaluation/content-architecture-v04-universal-r1/test_universal_r1.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python architect/evaluation/content-architecture-v04-universal-r1/test_universal_r1.py
      - name: Rebuild and verify exact frozen universal corpus
        shell: powershell
        run: |
          $pack = Join-Path $env:RUNNER_TEMP 'ca-v04-universal-r1-scored-pack'
          New-Item -ItemType Directory -Force -Path $pack | Out-Null
          python architect/evaluation/content-architecture-v04-universal-r1/author_pack_r1.py --out $pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:U1_PACK = $pack
          @'
          import json, os, pathlib
          p=pathlib.Path(os.environ['U1_PACK'])
          m=json.loads((p/'sealed-manifest.json').read_text())
          assert m['gate_id']=='content-architecture-v0.4-universal-release-2026-09-01-r1'
          assert m['candidate_sha']=='5d440e1bf3e20fbd35c6ab276310a904e36cc06d'
          assert m['work_sample_count']==6 and m['calibration_pair_count']==4
          assert m['plain_identity_sha256']=='70dfeee5435add3cb72c3b7b8a55e2846691c7b63fd575efec2cd4a05013d2f1'
          print('exact frozen universal r1 corpus: PASS')
          '@ | python -
      - name: Run scored universal r1 qualification
        id: scored
        shell: powershell
        continue-on-error: true
        run: |
          $pack = Join-Path $env:RUNNER_TEMP 'ca-v04-universal-r1-scored-pack\sealed-pack.bin'
          $out = Join-Path $env:RUNNER_TEMP 'ca-v04-universal-r1-scored-result'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          python architect/evaluation/content-architecture-v04-universal-r1/run_universal_r1.py --mode score --pack $pack --out $out --timeout 300
          $code = $LASTEXITCODE
          Set-Content -Path (Join-Path $out 'workflow-exit-code.txt') -Value $code
          Copy-Item (Join-Path $env:RUNNER_TEMP 'ca-v04-universal-r1-scored-pack\sealed-manifest.json') (Join-Path $out 'sealed-manifest.json')
          exit $code
      - name: Validate scored universal evidence
        if: always()
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'ca-v04-universal-r1-scored-result'
          $env:U1_OUT = $out
          @'
          import json, os, pathlib
          out=pathlib.Path(os.environ['U1_OUT'])
          code=int((out/'workflow-exit-code.txt').read_text().strip()) if (out/'workflow-exit-code.txt').exists() else 99
          evidence={'gate_id':'content-architecture-v0.4-universal-release-2026-09-01-r1','runner_exit_code':code,'provider_api_keys_used':False,'blind_retries':0}
          if code in (0,1):
              report=json.loads((out/'qualification-report.json').read_text())
              assert report['candidate_sha']=='5d440e1bf3e20fbd35c6ab276310a904e36cc06d'
              assert report['work_sample_count']==6 and report['candidate_calls']==6 and report['judge_calls']==12
              assert report['mechanical_contract_pass_rate']==1.0
              assert (code==0 and report['verdict']=='PASS') or (code==1 and report['verdict']=='REVISE')
              assert (out/'sealed-run-records.bin').exists() and (out/'run-records-manifest.json').exists()
              evidence.update({'verdict':report['verdict'],'candidate_calls':6,'judge_calls':12,'hard_failure_count':report['hard_failure_count'],'mechanical_contract_pass_rate':report['mechanical_contract_pass_rate'],'per_judge_aggregate_mean':report['per_judge_aggregate_mean']})
          elif code==3:
              err=json.loads((out/'runtime-error.json').read_text())
              evidence.update({'verdict':'NOT_EXECUTABLE','runtime_error_type':err.get('error_type')})
          else:
              raise SystemExit(57)
          (out/'execution-evidence.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(evidence,sort_keys=True))
          '@ | python -
      - name: Upload universal r1 scored evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-architecture-v04-universal-r1-scored-result
          path: |
            ${{ runner.temp }}/ca-v04-universal-r1-scored-result/qualification-report.json
            ${{ runner.temp }}/ca-v04-universal-r1-scored-result/sealed-run-records.bin
            ${{ runner.temp }}/ca-v04-universal-r1-scored-result/run-records-manifest.json
            ${{ runner.temp }}/ca-v04-universal-r1-scored-result/runtime-error.json
            ${{ runner.temp }}/ca-v04-universal-r1-scored-result/workflow-exit-code.txt
            ${{ runner.temp }}/ca-v04-universal-r1-scored-result/sealed-manifest.json
            ${{ runner.temp }}/ca-v04-universal-r1-scored-result/execution-evidence.json
          retention-days: 30
      - name: Apply frozen universal r1 outcome
        if: always()
        shell: powershell
        run: |
          $codePath = Join-Path $env:RUNNER_TEMP 'ca-v04-universal-r1-scored-result\workflow-exit-code.txt'
          if (-not (Test-Path $codePath)) { exit 58 }
          $code = [int](Get-Content $codePath | Select-Object -First 1)
          exit $code
