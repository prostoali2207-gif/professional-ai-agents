name: Sales 0.3 fresh held-out r5 Gemini

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CYCLE_ID: sales-0.3-fresh-independent-2026-08-23-r5-gemini
  CANDIDATE_COMMIT: 5adc0d315f6f63bc92df0a921040954a3541ef89
  CANDIDATE_DIGEST: sha256:a33bae7c2957e415669852d10135902349f20fdc9ae22090bf8d55278e0b15c2
  SALES_MODEL: gemini-3.5-flash-lite
  SALES_GRADER_MODEL: gemini-3.5-flash-lite
  SALES_MODEL_TIMEOUT_SECONDS: '120'
  SOURCE_RUN_ID: '32635893740'
  SOURCE_PACK_DIGEST: sha256:df9273a225431934ce6cf8cbd075c847204cc2d3a116eef2302e4eb102aa6e5d
  SOURCE_MANIFEST: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.3-r4-gemini/qualification.json
  QUALIFICATION_MANIFEST: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.3-r5-gemini/qualification.json

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      SALES_EXECUTOR_CMD: python architect/evaluation/sales-lead-conversion/executor_v0_3_gemini.py
      SANITIZED_REPORT_PATH: sales-r5-gemini-report.json
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Deterministic preregistration and repair checks
        run: |
          python -m py_compile architect/evaluation/sales-lead-conversion/sealed_runner_provider_wrapper_v0_3_gemini_r5.py
          python -m py_compile architect/evaluation/sales-lead-conversion/executor_v0_3_gemini.py
          python - <<'PY'
          import json,os
          p=json.load(open('architect/evaluation/sales-lead-conversion/qualification-preregistration-v0_3-r5-gemini.json'))
          assert p['cycle_id']==os.environ['CYCLE_ID']
          assert p['scope']['decision']=='FULL'
          assert p['fixture_count']==36 and p['per_family']==3 and len(p['families'])==12
          assert p['thresholds']['release_tasks_passed_min']==34
          assert p['thresholds']['per_family_tasks_passed_min']==2
          assert p['thresholds']['critical_hard_fails_max']==0
          assert p['resource_gate']['authoring_calls']==0
          print('R5_PREREG_PASS')
          PY

      - name: Require evaluator credentials before provider calls
        run: |
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || { echo 'CREDENTIAL_MISSING: QUALIFICATION_SEALED_PACK_MASTER_KEY' >&2; exit 21; }
          test -n "$GEMINI_API_KEY" || { echo 'CREDENTIAL_MISSING: GEMINI_API_KEY' >&2; exit 22; }

      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check cryptography jsonschema

      - name: Download exact r4 encrypted held-out pack
        uses: actions/download-artifact@v4
        with:
          name: sales-0.3-r4-gemini-encrypted-heldout-pack
          path: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.3-r4-gemini
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Verify and decrypt source without exposing hidden content
        run: |
          python - <<'PY'
          import json,os
          m=json.load(open(os.environ['SOURCE_MANIFEST']))
          assert m['cycle_id']=='sales-0.3-fresh-independent-2026-08-23-r4-gemini'
          assert m['candidate']['commit']==os.environ['CANDIDATE_COMMIT']
          assert m['candidate']['digest']==os.environ['CANDIDATE_DIGEST']
          assert m['sealed_pack']['pack_digest']==os.environ['SOURCE_PACK_DIGEST']
          print('SOURCE_R4_BINDING_PASS')
          PY
          python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$SOURCE_MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/sales-r4-source"

      - name: Re-seal byte-identical hidden corpus with r5 runner repair
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil,sys,tempfile,zipfile
          from pathlib import Path
          from cryptography.fernet import Fernet
          root=Path.cwd(); source=Path(os.environ['RUNNER_TEMP'])/'sales-r4-source'; cycle=os.environ['CYCLE_ID']; model=os.environ['SALES_MODEL']
          fixtures=(source/'fixtures.json').read_bytes(); grader=(source/'grader.json').read_bytes()
          sys.path.insert(0,str(root/'architect/evaluation/qualification-platform'))
          from sealed_pack_keys import derive_fernet_key,key_fingerprint_sha256
          out=root/'architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.3-r5-gemini'
          if out.exists(): shutil.rmtree(out)
          parts=out/'parts'; parts.mkdir(parents=True)
          h=lambda b: hashlib.sha256(b).hexdigest()
          with tempfile.TemporaryDirectory(prefix='sales-r5-gemini-') as td:
              p=Path(td); (p/'fixtures.json').write_bytes(fixtures); (p/'grader.json').write_bytes(grader)
              shutil.copyfile(root/'architect/evaluation/sales-lead-conversion/sealed_runner_provider_wrapper_v0_3_gemini_r5.py',p/'runner.py')
              hashes={n:h((p/n).read_bytes()) for n in ('fixtures.json','grader.json','runner.py')}
              pack_digest='sha256:'+h(''.join(f'{n}:{hashes[n]}\n' for n in sorted(hashes)).encode())
              fx=json.loads(fixtures); repeats=sorted(x['id'] for x in fx if x.get('repeat_required'))
              freeze={'cycle_id':cycle,'candidate_commit':os.environ['CANDIDATE_COMMIT'],'candidate_digest':os.environ['CANDIDATE_DIGEST'],'model':model,'fixture_count':36,'family_count':12,'per_family':3,'repeat_fixture_count':6,'repeat_fixture_ids':repeats,'expected_candidate_runs_if_full':42,'fixtures_sha256':'sha256:'+hashes['fixtures.json'],'grader_sha256':'sha256:'+hashes['grader.json'],'runner_sha256':'sha256:'+hashes['runner.py'],'pack_digest':pack_digest,'release_tasks_passed_min':34,'per_family_min':2,'critical_hard_fails_max':0,'professional_failure_retry':0,'source_hidden_pack_digest':os.environ['SOURCE_PACK_DIGEST'],'hidden_corpus_semantics_modified':False}
              (p/'freeze-record.json').write_text(json.dumps(freeze,indent=2,sort_keys=True)+'\n')
              zp=p/'pack.zip'
              with zipfile.ZipFile(zp,'w',compression=zipfile.ZIP_DEFLATED) as z:
                  for n in ('fixtures.json','grader.json','runner.py','freeze-record.json'): z.write(p/n,arcname=n)
              raw=zp.read_bytes(); key=derive_fernet_key(os.environ['QUALIFICATION_SEALED_PACK_MASTER_KEY'].encode().strip(),cycle); token=Fernet(key).encrypt(raw)
          text=token.decode('ascii'); chunks=[text[i:i+4000] for i in range(0,len(text),4000)]
          for i,c in enumerate(chunks): (parts/f'{i:02d}').write_text(c)
          manifest={'version':2,'cycle_id':cycle,'candidate':{'commit':os.environ['CANDIDATE_COMMIT'],'digest':os.environ['CANDIDATE_DIGEST'],'manifest_path':'architect/library/cores/sales-lead-conversion/0.3.0/manifest.json'},'runtime':{'executor_path':'architect/evaluation/sales-lead-conversion/executor_v0_3_gemini.py','executor_cmd':'python architect/evaluation/sales-lead-conversion/executor_v0_3_gemini.py','protocol':'sales-lead-conversion-candidate-v1','provider':'gemini-interactions-api','model':model,'credential_env':'GEMINI_API_KEY','candidate_timeout_seconds':180,'model_timeout_seconds':120,'workflow_timeout_seconds':5400,'contract_probe_argv':['python','architect/evaluation/sales-lead-conversion/executor_v0_3_gemini.py','--qualification-contract'],'tool_protocol':'sales-deterministic-tools-v1','state_protocol':'sales-state-checkpoint-v1','observable_protocol':'sales-observable-ledger-v1','canary_required':True,'canary_cmd':'python architect/evaluation/sales-lead-conversion/canary_v0_3_gemini.py'},'sealed_pack':{'parts_dir':str(parts.relative_to(root)),'part_count':len(chunks),'ciphertext_length':len(token),'ciphertext_sha256':h(token),'key_derivation':{'scheme':'hkdf-sha256-v1','master_env':'QUALIFICATION_SEALED_PACK_MASTER_KEY','context':cycle},'key_fingerprint_sha256':key_fingerprint_sha256(key),'decrypted_zip_sha256':h(raw),'pack_digest':pack_digest,'required_files':['fixtures.json','grader.json','runner.py','freeze-record.json']},'evaluation':{'fixture_count':36,'family_count':12,'per_family':3,'fixtures_file':'fixtures.json','grader_file':'grader.json','runner_file':'runner.py','freeze_record_file':'freeze-record.json'},'report':{'sanitized_required':True,'artifact_required':True,'validator_path':'architect/evaluation/qualification-platform/validate_sanitized_report.py','release_ledger_required':True},'verdict':{'runner_exit_zero_required':True,'missing_report_is_failure':True,'report_validation_required':True,'artifact_upload_required':True}}
          (out/'qualification.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':'SEALED','cycle_id':cycle,'pack_digest':pack_digest,'fixture_count':36,'hidden_content_printed':False}))
          PY

      - name: Generic r5 static preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase static --require-runtime-secret
      - name: Generic r5 sealed no-API preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/sales-r5-gemini-pack"
      - name: Preserve encrypted r5 pack before scoring
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.3-r5-gemini-encrypted-heldout-pack
          path: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.3-r5-gemini
          if-no-files-found: error
          retention-days: 14
      - name: Exact-runtime one-call Gemini canary
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase canary --require-runtime-secret

      - name: Run preregistered full scored qualification
        id: scored
        shell: bash
        run: |
          set +e
          python "$RUNNER_TEMP/sales-r5-gemini-pack/runner.py"
          code=$?
          echo "qualification_exit_code=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Resolve pack digest
        if: always()
        run: |
          if test -f "$QUALIFICATION_MANIFEST"; then echo "R5_PACK_DIGEST=$(python -c 'import json,os; print(json.load(open(os.environ["QUALIFICATION_MANIFEST"]))["sealed_pack"]["pack_digest"])')" >> "$GITHUB_ENV"; fi

      - name: Validate sanitized report and release ledger
        if: always()
        id: validate
        shell: bash
        run: |
          test -n "${R5_PACK_DIGEST:-}" || exit 2
          python architect/evaluation/qualification-platform/validate_sanitized_report.py --report "$SANITIZED_REPORT_PATH" --cycle-id "$CYCLE_ID" --candidate-commit "$CANDIDATE_COMMIT" --candidate-digest "$CANDIDATE_DIGEST" --pack-digest "$R5_PACK_DIGEST" --model "$SALES_MODEL" --runner-exit-code "${qualification_exit_code:-255}" --ledger-out sales-r5-gemini-release-evidence.json

      - name: Upload sanitized qualification evidence
        if: always() && steps.validate.outcome == 'success'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.3-r5-gemini-sanitized-qualification-evidence
          path: |
            sales-r5-gemini-report.json
            sales-r5-gemini-release-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce release verdict
        if: always()
        run: |
          test "${{ steps.validate.outcome }}" = "success"
          test "${{ steps.upload.outcome }}" = "success"
          test "${qualification_exit_code:-missing}" = "0"
