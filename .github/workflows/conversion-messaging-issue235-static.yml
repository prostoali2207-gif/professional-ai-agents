name: Conversion Messaging issue-235 direct-key transport static

on:
  pull_request:
    paths:
      - 'architect/evaluation/conversion_messaging_web_copy/issue225-sealed-prerequisite-prereg-v0.2.json'
      - 'architect/evaluation/conversion_messaging_web_copy/issue225_codex_author_review_seal_v0_3.py'
      - 'architect/evaluation/conversion_messaging_web_copy/issue235_static_preflight_v0_1.py'
      - '.github/workflows/conversion-messaging-issue235-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sealing dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=42,<47'
      - name: Verify no separately billed API credentials are bound
        shell: bash
        run: |
          for n in OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY GROQ_API_KEY XAI_API_KEY; do
            test -z "${!n:-}" || { echo "unexpected API credential: $n" >&2; exit 2; }
          done
      - name: Compile transport repair
        run: |
          python -m py_compile architect/evaluation/conversion_messaging_web_copy/issue225_codex_author_review_seal_v0_3.py
          python -m py_compile architect/evaluation/conversion_messaging_web_copy/issue235_static_preflight_v0_1.py
      - name: Run deterministic repair gate
        run: python architect/evaluation/conversion_messaging_web_copy/issue235_static_preflight_v0_1.py
      - name: Run r2 authoring zero-model preflight
        run: python architect/evaluation/conversion_messaging_web_copy/issue225_codex_author_review_seal_v0_3.py --preflight
      - name: Verify diff hygiene
        run: git diff --check origin/main...HEAD
