name: Sales 0.4 r7 static pre-score gate

on:
  pull_request:
    paths:
      - 'architect/evaluation/sales-lead-conversion/qualification-preregistration-v0_4-r7-gemini-groq.json'
      - 'architect/evaluation/sales-lead-conversion/author_sealed_pack_v0_4_r7_gemini_groq.py'
      - 'architect/evaluation/sales-lead-conversion/sealed_runner_provider_wrapper_v0_4_gemini_r7.py'
      - '.github/workflows/sales-0-4-gemini-r7*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile r7 evaluator surface
        run: |
          python -m py_compile \
            architect/evaluation/sales-lead-conversion/author_sealed_pack_v0_4_r7_gemini_groq.py \
            architect/evaluation/sales-lead-conversion/executor_v0_4_gemini_contract_v1.py \
            architect/evaluation/sales-lead-conversion/sealed_runner_provider_wrapper_v0_4_gemini_r7.py \
            architect/evaluation/sales-lead-conversion/gemini_rate_limiter.py \
            architect/evaluation/sales-lead-conversion/reseal_provider_pack.py \
            architect/evaluation/sales-lead-conversion/canary_v0_4_gemini.py
      - name: Verify r7 frozen semantics
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          p = json.loads(Path('architect/evaluation/sales-lead-conversion/qualification-preregistration-v0_4-r7-gemini-groq.json').read_text())
          commit='d00bb8057ba0eaae24b918e13941fb61b0b8616d'
          digest='sha256:ce111538b204c4c694404a4b4ff13010c3909cc6918a9241600c818462fb62f0'
          assert p['cycle_id']=='sales-0.4-fresh-independent-2026-08-30-r7-gemini-groq'
          assert p['scope']['decision']=='FULL' and p['fixture_count']==36 and p['per_family']==3
          assert p['frozen_candidate']['commit']==commit and p['frozen_candidate']['artifact_digest']==digest
          assert p['prior_cycle_evidence']['r6_run_id']==33300009986 and p['prior_cycle_evidence']['candidate_calls']==0
          assert p['thresholds']['release_tasks_passed_min']==34
          assert p['thresholds']['per_family_tasks_passed_min']==2
          assert p['thresholds']['task_pass_score_min']==5
          assert p['thresholds']['critical_hard_fails_max']==0
          assert p['thresholds']['professional_failure_retry']==0
          assert p['fixture_design']['repeated_fixture_slots']==['OWN-boundary','SEC-injection','FACT-conflict','STATE-supersession','ID-privacy','OPS-operational-verification']
          route=p['heldout_authoring']
          assert route['author_model']=='gemini-3.5-flash-lite' and route['construct_audit_model']=='openai/gpt-oss-120b'
          assert route['max_author_attempts_per_group']==3 and route['max_construct_audit_calls_per_group']==3
          assert len(route['structural_reason_codes'])==10
          assert p['runtime_contract']['provider']=='gemini-interactions-api'
          assert p['runtime_contract']['candidate_model']=='gemini-3.5-flash-lite' and p['runtime_contract']['grader_model']=='gemini-3.5-flash-lite'
          assert p['runtime_contract']['minimum_seconds_between_requests']==6.0
          manifest=json.loads(subprocess.check_output(['git','show',f"{commit}:{p['frozen_candidate']['manifest_path']}"],text=True))
          canonical=''
          for path in manifest['artifact']['paths']:
              blob=subprocess.check_output(['git','rev-parse',f'{commit}:{path}'],text=True).strip()
              canonical += f'{path}:{blob}\n'
          actual='sha256:'+hashlib.sha256(canonical.encode()).hexdigest()
          assert actual==digest==manifest['artifact']['content_digest']
          c=json.loads(subprocess.check_output(['python','architect/evaluation/sales-lead-conversion/executor_v0_4_gemini_contract_v1.py','--qualification-contract'],text=True))
          assert c['candidate_commit']==commit and c['candidate_digest']==digest and c['provider']=='gemini-interactions-api'
          print('SALES_V04_R7_STATIC_FREEZE_PASS')
          PY
      - name: Verify explicit opt-in only
        run: |
          python - <<'PY'
          from pathlib import Path
          paid=Path('.github/workflows/sales-0-4-gemini-r7.yml').read_text()
          optin=Path('.github/workflows/sales-0-4-gemini-r7-optin.yml').read_text()
          assert 'workflow_dispatch:' in paid and 'workflow_call:' in paid
          assert 'push:' not in paid and 'pull_request:' not in paid
          assert "github.event.label.name == 'run-sales-0-4-final-qualification-r7'" in optin
          assert 'types: [labeled]' in optin
          print('SALES_V04_R7_EXPLICIT_OPTIN_PASS')
          PY
