name: Qualification platform zero-call replay pilot

on:
  pull_request:
    paths:
      - 'architect/evaluation/qualification-platform/test_provider_replay.py'
      - '.github/workflows/qualification-platform-replay-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'architect/evaluation/qualification-platform/test_provider_replay.py'
      - '.github/workflows/qualification-platform-replay-pilot.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run replay tests with no provider credentials
        env:
          OPENAI_API_KEY: ''
          GEMINI_API_KEY: ''
        run: pytest -q architect/evaluation/qualification-platform/test_provider_replay.py
