name: Market Intelligence v0.3 Practical Release Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'architect/research/market-competitive-intelligence/**'
      - 'architect/evaluation/market_competitive_intelligence/v03_fresh_practical_case.json'
      - 'architect/evaluation/market_competitive_intelligence/run_v03_fresh_practical_gate.py'
      - '.github/workflows/market-intelligence-v03-practical-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practical-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight
        run: |
          python -m py_compile architect/evaluation/market_competitive_intelligence/run_v03_fresh_practical_gate.py
          test "$(git hash-object architect/research/market-competitive-intelligence/candidate-professional-model-v0.2.md)" = "7af5b93c1a4d499b5972a0dd20aec8e4253a9651"
          test "$(git hash-object architect/research/market-competitive-intelligence/epistemic-status-calibration-overlay-v0.1.md)" = "e0685f4a5a868cd2e2d119d9c01d8ad36bb59b21"
          python - <<'PY'
          import json
          x=json.load(open('architect/evaluation/market_competitive_intelligence/v03_fresh_practical_case.json'))
          assert x['id']=='MI-P02' and 'expected' in x
          print('fresh practical fixture OK')
          PY
      - name: Require Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY"
      - name: Run fresh practical qualification
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MI_MODEL: gemini-3.1-flash-lite
          GEMINI_THINKING_LEVEL: medium
          MI_PRACTICAL_TRIALS: '3'
        run: |
          rm -rf .tmp/market-competitive-intelligence-v03-practical
          python architect/evaluation/market_competitive_intelligence/run_v03_fresh_practical_gate.py
      - name: Upload sealed practical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-intelligence-v03-practical-${{ github.sha }}
          path: .tmp/market-competitive-intelligence-v03-practical
          if-no-files-found: ignore
