name: Market Intelligence Professional Core Gate

on:
  push:
    branches:
      - agent/market-intelligence-core-2026-08-20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deterministic preflight
        run: |
          python -m py_compile architect/evaluation/market_competitive_intelligence/run_semantic_gate.py
          test "$(git hash-object architect/research/market-competitive-intelligence/candidate-professional-model-v0.1.md)" = "b0f65c3720db08309ef9d9fa10df8f61021f9648"
          python - <<'PY'
          import json
          p='architect/evaluation/market_competitive_intelligence/semantic_cases.json'
          x=json.load(open(p))
          assert len(x)==16
          ids=[c['id'] for c in x]
          assert len(ids)==len(set(ids))
          for c in x:
              assert c['allowed_actions'] and c['required_flags']
          print('fixture contract OK')
          PY

      - name: Require existing Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo 'GEMINI_API_KEY is not configured; semantic calls were not attempted.' >&2; exit 2)

      - name: Run frozen adversarial qualification
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MI_MODEL: gemini-3.1-flash-lite
          GEMINI_THINKING_LEVEL: medium
          MI_TRIALS: '3'
          MI_BATCH_SIZE: '4'
        run: |
          rm -rf .tmp/market-competitive-intelligence
          python architect/evaluation/market_competitive_intelligence/run_semantic_gate.py

      - name: Upload sealed qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-intelligence-professional-core-${{ github.sha }}
          path: .tmp/market-competitive-intelligence
          if-no-files-found: ignore
