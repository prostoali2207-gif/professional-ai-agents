name: Content Architecture held-out universal qualification

on:
  push:
    branches:
      - eval/content-architecture-heldout-2026-08
  pull_request:
    branches:
      - infra/generic-frozen-artifact-eval-adapter-2026-08
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      FROZEN_ARTIFACT_MODEL: gpt-5.4-mini
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed credential preflight
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY missing'; exit 21; }
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || { echo 'QUALIFICATION_SEALED_PACK_MASTER_KEY missing'; exit 22; }
          echo 'qualification credentials available (values not disclosed)'
      - name: Pre-run resource gate
        run: |
          echo 'objective=complete preregistered universal held-out gate F1-F12'
          echo 'candidate_blob=67ac707be93cd46c0303c54eef3d73122c72c876'
          echo 'model=gpt-5.4-mini'
          echo 'stop_conditions=credential failure, pack-integrity failure, candidate-identity mismatch, harness/execution failure'
          echo 'retry_policy=no blind retries; diagnose root cause before any rerun'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check openai cryptography
      - name: Fetch exact candidate ref
        run: |
          git fetch origin agent/content-architecture-core-2026-08
          test "$(git cat-file -t 67ac707be93cd46c0303c54eef3d73122c72c876)" = "blob"
      - name: Restore and verify original sealed evaluator pack
        run: |
          python architect/evaluation/content-architecture-heldout/build_sealed_runtime.py \
            --parts-dir architect/evaluation/content-architecture-heldout/sealed.parts \
            --out "$RUNNER_TEMP/content-architecture-heldout"
      - name: Execute protocol-v2 universal gate
        id: run_eval
        shell: bash
        run: |
          set +e
          python architect/evaluation/harness/runner.py \
            --manifest "$RUNNER_TEMP/content-architecture-heldout/manifest.json" \
            --candidate-command "python architect/evaluation/harness/adapters/openai_frozen_artifact_adapter.py" \
            --out "$RUNNER_TEMP/content-architecture-heldout-results" \
            --timeout 240
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify returned candidate identity in every completed step
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("${{ runner.temp }}/content-architecture-heldout-results/summary.json")
          if not p.exists(): raise SystemExit("summary missing")
          rows=json.loads(p.read_text())
          expected="67ac707be93cd46c0303c54eef3d73122c72c876"
          if not rows: raise SystemExit("no runs")
          for row in rows:
              if row.get("error"): raise SystemExit("execution error: "+str(row["error"]))
              for step in row.get("steps",{}).values():
                  if step.get("candidate_identity",{}).get("sha")!=expected:
                      raise SystemExit("candidate identity mismatch")
          print(json.dumps({"status":"PASS","runs":len(rows),"candidate_sha":expected}))
          PY
      - name: Post-run accounting summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/content-architecture-heldout-results/summary.json" ]; then
            python - <<'PY'
          import json, pathlib
          p=pathlib.Path("${{ runner.temp }}/content-architecture-heldout-results/summary.json")
          rows=json.loads(p.read_text())
          print(json.dumps({
            "run_records": len(rows),
            "execution_errors": sum(1 for r in rows if r.get("error")),
            "duration_seconds_total": round(sum(float(r.get("duration_s",0)) for r in rows),3),
            "candidate_sha": "67ac707be93cd46c0303c54eef3d73122c72c876",
            "model": "gpt-5.4-mini"
          }))
          PY
          else
            echo '{"run_records":0,"reason":"summary unavailable before execution"}'
          fi
      - name: Upload evaluator-visible run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-architecture-heldout-universal-run
          path: |
            ${{ runner.temp }}/content-architecture-heldout-results/summary.json
            ${{ runner.temp }}/content-architecture-heldout-results/runs.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Enforce executable run
        if: always()
        run: test "${{ steps.run_eval.outputs.exit_code }}" = "0"
