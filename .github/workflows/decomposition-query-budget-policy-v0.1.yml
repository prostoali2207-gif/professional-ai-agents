name: Decomposition Query Budget Policy v0.1

on:
  push:
    branches:
      - research/research-architecture-benchmark-2026-08
    paths:
      - 'architect/research/benchmark/decomposition-query-budget-policy-v0.1.py'
      - '.github/workflows/decomposition-query-budget-policy-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decomposition-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run decomposition query budget gate
        run: python architect/research/benchmark/decomposition-query-budget-policy-v0.1.py
      - name: Upload audit record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decomposition-query-budget-policy-v0.1-record
          path: architect/research/benchmark/runs/decomposition-query-budget-policy-v0.1.json
          if-no-files-found: error
