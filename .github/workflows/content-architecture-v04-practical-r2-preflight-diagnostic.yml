name: Content Architecture practical r2 preflight diagnostic
on:
  push:
    branches: [eval/content-architecture-v04-practical-handoff-r2]
    paths: ['architect/evaluation/content-architecture-v04-practical-handoff-r2/RUN-DIAGNOSTIC']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch professional candidate branch
        shell: powershell
        run: git fetch origin agent/content-architecture-core-2026-08
      - name: Fetch frozen auto-sales practical branch
        shell: powershell
        run: git fetch https://github.com/prostoali2207-gif/auto-sales-growth-system.git eval/content-analyst-v04-practical-handoff
      - name: Verify frozen auto-sales commit exists
        shell: powershell
        run: if ((git cat-file -t f7705db595b55dc237a44538c8b5f03c0a6aa4fe) -ne 'commit') { exit 43 }
      - name: Fetch auto-sales main
        shell: powershell
        run: git fetch https://github.com/prostoali2207-gif/auto-sales-growth-system.git main
      - name: Verify Analyst core blob
        shell: powershell
        run: if ((git cat-file -t 5d440e1bf3e20fbd35c6ab276310a904e36cc06d) -ne 'blob') { exit 51 }
      - name: Verify Analyst UAE blob
        shell: powershell
        run: if ((git cat-file -t 7f41c2d1ba40c3b4c59e3eba2fb264c04162c320) -ne 'blob') { exit 52 }
      - name: Verify Analyst binding blob
        shell: powershell
        run: if ((git cat-file -t 82694481f857e9c318317adc0cf81b6e50d877e2) -ne 'blob') { exit 53 }
      - name: Verify Analyst schema blob
        shell: powershell
        run: if ((git cat-file -t 35bddc15f19ce4af666247cd2dd229c7a7eabe34) -ne 'blob') { exit 54 }
      - name: Verify Creator manifest blob
        shell: powershell
        run: if ((git cat-file -t 0fcc7bed521aa575a126ee1eea2b28a29a38ad77) -ne 'blob') { exit 55 }
      - name: Verify Creator model blob
        shell: powershell
        run: if ((git cat-file -t d8eee4c6f9141f362d91a340c37dcae6ad6bfa71) -ne 'blob') { exit 56 }
      - name: Verify Creator binding blob
        shell: powershell
        run: if ((git cat-file -t 8b2b5ef822387f4e1f006dc036a08f2e42113d1f) -ne 'blob') { exit 57 }
      - name: Verify Creator UAE blob
        shell: powershell
        run: if ((git cat-file -t 01fa57c40d01a79752af1a7f7f5290859521615b) -ne 'blob') { exit 58 }
      - name: Verify Creator bridge blob
        shell: powershell
        run: if ((git cat-file -t 845959e914b2db531f7507b2a1f14b6987767bfa) -ne 'blob') { exit 59 }
      - name: Verify Creator schema blob
        shell: powershell
        run: if ((git cat-file -t 7fea2f60b87198ec2f7ee15cd34c84260914ff2f) -ne 'blob') { exit 60 }
