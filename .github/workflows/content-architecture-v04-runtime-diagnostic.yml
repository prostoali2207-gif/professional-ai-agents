name: Content Architecture v0.4 runtime diagnostic

on:
  push:
    branches:
      - eval/content-architecture-v04-fresh-gate-2026-08
    paths:
      - 'architect/evaluation/content-architecture-v04-fresh/DIAG-RUNTIME-v0.1'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      FROZEN_ARTIFACT_GEMINI_MODEL: gemini-3.5-flash-lite
      FROZEN_ARTIFACT_GEMINI_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography
      - name: Verify credentials and candidate
        run: |
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || exit 31
          test -n "$GEMINI_API_KEY" || exit 32
          git fetch origin agent/content-architecture-core-2026-08 main
          test "$(git cat-file -t 5d440e1bf3e20fbd35c6ab276310a904e36cc06d)" = blob
      - name: Build exact frozen pack
        run: |
          mkdir -p "$RUNNER_TEMP/ca-v04-diag-pack"
          python architect/evaluation/content-architecture-v04-fresh/author_pack_v01.py --out "$RUNNER_TEMP/ca-v04-diag-pack"
      - name: Reproduce only failed runtime case
        run: |
          mkdir -p "$RUNNER_TEMP/ca-v04-diag-results"
          python architect/evaluation/content-architecture-v04-fresh/run_gate_v01.py \
            --pack "$RUNNER_TEMP/ca-v04-diag-pack/sealed-pack.bin" \
            --candidate-command "python architect/evaluation/harness/adapters/gemini_frozen_artifact_adapter.py" \
            --out "$RUNNER_TEMP/ca-v04-diag-results" \
            --only-fixture N1-2-4965 \
            --timeout 180
      - name: Upload sanitized runtime record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-architecture-v04-runtime-diagnostic
          path: ${{ runner.temp }}/ca-v04-diag-results/records.jsonl
          if-no-files-found: warn
          retention-days: 7
