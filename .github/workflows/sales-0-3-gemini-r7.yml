name: Sales 0.3 fresh held-out r7 Gemini
on:
  workflow_dispatch:
permissions: {contents: read, actions: read}
env:
  CYCLE_ID: sales-0.3-fresh-independent-2026-08-23-r7-gemini
  CANDIDATE_COMMIT: 5adc0d315f6f63bc92df0a921040954a3541ef89
  CANDIDATE_DIGEST: sha256:a33bae7c2957e415669852d10135902349f20fdc9ae22090bf8d55278e0b15c2
  SALES_MODEL: gemini-3.5-flash-lite
  SALES_GRADER_MODEL: gemini-3.5-flash-lite
  SALES_MODEL_TIMEOUT_SECONDS: '120'
  SOURCE_RUN_ID: '32636050789'
  SOURCE_PACK_DIGEST: sha256:6f8bef618d61890c8789f4dbe172c2f02eb38e28e4a2835e50b466ebd8158be7
  SOURCE_MANIFEST: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.3-r5-gemini/qualification.json
  QUALIFICATION_MANIFEST: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.3-r7-gemini/qualification.json
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      SALES_EXECUTOR_CMD: python architect/evaluation/sales-lead-conversion/executor_v0_3_gemini.py
      SANITIZED_REPORT_PATH: sales-r7-gemini-report.json
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Deterministic preregistration and runtime checks
        run: |
          python -m py_compile architect/evaluation/sales-lead-conversion/sealed_runner_provider_wrapper_v0_3_gemini_r7.py architect/evaluation/sales-lead-conversion/reseal_provider_pack.py architect/evaluation/sales-lead-conversion/executor_v0_3_gemini.py
          python - <<'PY'
          import json,os,subprocess
          p=json.load(open('architect/evaluation/sales-lead-conversion/qualification-preregistration-v0_3-r7-gemini.json'))
          assert p['cycle_id']==os.environ['CYCLE_ID'] and p['scope']['decision']=='FULL'
          assert p['fixture_count']==36 and p['thresholds']['release_tasks_passed_min']==34 and p['thresholds']['critical_hard_fails_max']==0
          c=json.loads(subprocess.check_output(['python','architect/evaluation/sales-lead-conversion/executor_v0_3_gemini.py','--qualification-contract'],text=True))
          assert c['candidate_commit']==os.environ['CANDIDATE_COMMIT'] and c['candidate_digest']==os.environ['CANDIDATE_DIGEST'] and c['provider']=='gemini-interactions-api'
          print('R7_STATIC_PASS')
          PY
      - name: Require evaluator credentials
        run: |
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || exit 21
          test -n "$GEMINI_API_KEY" || exit 22
      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Download exact unscored r5 pack
        uses: actions/download-artifact@v4
        with:
          name: sales-0.3-r5-gemini-encrypted-heldout-pack
          path: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.3-r5-gemini
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Verify and decrypt source pack
        run: |
          python - <<'PY'
          import json,os
          m=json.load(open(os.environ['SOURCE_MANIFEST']))
          assert m['cycle_id']=='sales-0.3-fresh-independent-2026-08-23-r5-gemini'
          assert m['candidate']['commit']==os.environ['CANDIDATE_COMMIT'] and m['candidate']['digest']==os.environ['CANDIDATE_DIGEST']
          assert m['sealed_pack']['pack_digest']==os.environ['SOURCE_PACK_DIGEST']
          print('SOURCE_R5_BINDING_PASS')
          PY
          python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$SOURCE_MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/sales-r5-source"
      - name: Re-seal unchanged corpus for r7
        run: python architect/evaluation/sales-lead-conversion/reseal_provider_pack.py --source-dir "$RUNNER_TEMP/sales-r5-source" --runner architect/evaluation/sales-lead-conversion/sealed_runner_provider_wrapper_v0_3_gemini_r7.py --out architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.3-r7-gemini --cycle-id "$CYCLE_ID"
      - name: Generic static preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase static --require-runtime-secret
      - name: Generic sealed no-API preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/sales-r7-pack"
      - name: Preserve encrypted pack before scoring
        uses: actions/upload-artifact@v4
        with: {name: sales-0.3-r7-gemini-encrypted-heldout-pack, path: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.3-r7-gemini, if-no-files-found: error, retention-days: 14}
      - name: Exact-runtime one-call canary
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase canary --require-runtime-secret
      - name: Run preregistered full qualification
        id: scored
        shell: bash
        run: |
          set +e
          python "$RUNNER_TEMP/sales-r7-pack/runner.py"
          echo "qualification_exit_code=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Resolve pack digest
        if: always()
        run: if test -f "$QUALIFICATION_MANIFEST"; then echo "PACK_DIGEST=$(python -c 'import json,os; print(json.load(open(os.environ["QUALIFICATION_MANIFEST"]))["sealed_pack"]["pack_digest"])')" >> "$GITHUB_ENV"; fi
      - name: Validate sanitized report
        if: always()
        id: validate
        run: python architect/evaluation/qualification-platform/validate_sanitized_report.py --report "$SANITIZED_REPORT_PATH" --cycle-id "$CYCLE_ID" --candidate-commit "$CANDIDATE_COMMIT" --candidate-digest "$CANDIDATE_DIGEST" --pack-digest "$PACK_DIGEST" --model "$SALES_MODEL" --runner-exit-code "${qualification_exit_code:-255}" --ledger-out sales-r7-gemini-release-evidence.json
      - name: Upload sanitized evidence
        if: always() && steps.validate.outcome == 'success'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.3-r7-gemini-sanitized-qualification-evidence
          path: |
            sales-r7-gemini-report.json
            sales-r7-gemini-release-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce verdict
        if: always()
        run: |
          test "${{ steps.validate.outcome }}" = success
          test "${{ steps.upload.outcome }}" = success
          test "${qualification_exit_code:-missing}" = 0
