name: Sales 0.4 r10 static pre-score gate

on:
  pull_request:
    paths:
      - 'architect/evaluation/sales-lead-conversion/qualification-preregistration-v0_4-r10-gemini-groq.json'
      - 'architect/evaluation/sales-lead-conversion/author_sealed_pack_v0_4_r10_gemini_groq.py'
      - 'architect/evaluation/sales-lead-conversion/sealed_runner_provider_wrapper_v0_4_gemini_r10.py'
      - '.github/workflows/sales-0-4-gemini-r10*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify r10 transport-only freeze
        run: |
          python -m py_compile architect/evaluation/sales-lead-conversion/author_sealed_pack_v0_4_r10_gemini_groq.py architect/evaluation/sales-lead-conversion/sealed_runner_provider_wrapper_v0_4_gemini_r10.py architect/evaluation/sales-lead-conversion/executor_v0_4_gemini_contract_v1.py
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          p=json.loads(Path('architect/evaluation/sales-lead-conversion/qualification-preregistration-v0_4-r10-gemini-groq.json').read_text())
          assert p['cycle_id']=='sales-0.4-fresh-independent-2026-08-30-r10-gemini-groq'
          assert p['frozen_candidate']['commit']=='d00bb8057ba0eaae24b918e13941fb61b0b8616d'
          assert p['frozen_candidate']['artifact_digest']=='sha256:ce111538b204c4c694404a4b4ff13010c3909cc6918a9241600c818462fb62f0'
          prior=p['prior_cycle_evidence']; assert prior['r9_run_id']==33301068662 and prior['candidate_calls']==0 and prior['r9_authoring_status']=='AUTHORED_AUDITED_SEALED'
          assert prior['r9_fixture_count']==36 and prior['r9_family_count']==12 and prior['r9_repeat_fixture_count']==6 and prior['r9_audit_rejections']==0 and prior['r9_structural_rejections']==0
          assert prior['r10_pre_model_run_id']==33301814559 and prior['r10_author_model_results']==0 and prior['r10_candidate_calls']==0
          inh=p['construct_inheritance']; assert inh['base_preregistration_blob']=='65d826075ded39ab9e465bfaf0a7bb3a254d15f9' and inh['authoring_implementation_blob']=='5e5193039528da68930d9356396e629874eca29b'
          assert subprocess.check_output(['git','hash-object',inh['base_preregistration_path']],text=True).strip()==inh['base_preregistration_blob']
          assert subprocess.check_output(['git','hash-object',inh['authoring_implementation_path']],text=True).strip()==inh['authoring_implementation_blob']
          assert p['scope']['decision']=='FULL' and p['fixture_count']==36 and p['per_family']==3 and len(p['families'])==12
          t=p['thresholds']; assert t['release_tasks_passed_min']==34 and t['per_family_tasks_passed_min']==2 and t['task_pass_score_min']==5 and t['critical_hard_fails_max']==0 and t['professional_failure_retry']==0
          a=p['heldout_authoring']; assert len(a['safe_structural_reason_codes'])==19 and a['safe_observability'].startswith('Only preregistered structural/audit reason codes')
          assert a['targeted_instruction_change'].startswith('Only for FUP/STATE/ID/OPS')
          assert p['transport_remediation']['semantic_mutation_allowed'] is False and p['transport_remediation']['candidate_calls_before_reseal_success']==0
          assert 'SOURCE_PACK_DIGEST' in p['transport_remediation']['source_digest_binding']
          r=p['runtime_contract']; assert r['provider']=='gemini-interactions-api' and r['candidate_model']=='gemini-3.5-flash-lite' and r['grader_model']=='gemini-3.5-flash-lite' and r['minimum_seconds_between_requests']==6.0
          commit=p['frozen_candidate']['commit']; manifest=json.loads(subprocess.check_output(['git','show',f"{commit}:{p['frozen_candidate']['manifest_path']}"],text=True)); canonical=''
          for path in manifest['artifact']['paths']: canonical += f"{path}:{subprocess.check_output(['git','rev-parse',f'{commit}:{path}'],text=True).strip()}\n"
          actual='sha256:'+hashlib.sha256(canonical.encode()).hexdigest(); assert actual==p['frozen_candidate']['artifact_digest']==manifest['artifact']['content_digest']
          c=json.loads(subprocess.check_output(['python','architect/evaluation/sales-lead-conversion/executor_v0_4_gemini_contract_v1.py','--qualification-contract'],text=True)); assert c['candidate_commit']==commit and c['candidate_digest']==actual and c['provider']=='gemini-interactions-api'
          print('SALES_V04_R10_STATIC_FREEZE_PASS')
          PY
      - name: Verify r10 workflow transport repair and explicit opt-in
        run: |
          python - <<'PY'
          from pathlib import Path
          paid=Path('.github/workflows/sales-0-4-gemini-r10.yml').read_text(); optin=Path('.github/workflows/sales-0-4-gemini-r10-optin.yml').read_text()
          assert 'workflow_dispatch:' in paid and 'workflow_call:' in paid and 'push:' not in paid and 'pull_request:' not in paid
          assert 'sales-0.4-r10-source-encrypted-heldout-pack' in paid
          assert 'SOURCE_PACK_DIGEST=' in paid and 'reseal_provider_pack.py' in paid
          assert paid.index('SOURCE_PACK_DIGEST=') < paid.index('reseal_provider_pack.py')
          assert "github.event.label.name == 'run-sales-0-4-final-qualification-r10'" in optin and 'types: [labeled]' in optin
          print('SALES_V04_R10_TRANSPORT_AND_OPTIN_PASS')
          PY
