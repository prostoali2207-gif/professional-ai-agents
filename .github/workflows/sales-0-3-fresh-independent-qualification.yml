name: Sales 0.3 fresh independent held-out qualification

# INOPERABLE - MANUAL DISPATCH ONLY.
#
# This workflow cannot succeed. Its first real step, "Reconstruct sealed pack",
# needs the repository secret SALES_0_3_FRESH_EVAL_KEY, which has never existed:
# every one of the 11 runs since the workflow was created has failed with
#   {"status": "FAIL", "failure_class": "CREDENTIAL_MISSING",
#    "message": "sealed pack key missing: SALES_0_3_FRESH_EVAL_KEY"}
# including run 6 and run 10 on main. No other workflow references that secret.
#
# It is legacy from the r1 cycle (sales-0.3-fresh-independent-2026-08-22-r1) and
# is kept only for its structure, which later cycles reuse. The automatic push
# and pull_request triggers were removed so it stops reporting a permanent red
# check on unrelated pull requests; nothing else about the workflow changed.
#
# To revive it: provision SALES_0_3_FRESH_EVAL_KEY (or migrate the cycle to the
# shared QUALIFICATION_SEALED_PACK_MASTER_KEY derivation that later cycles use),
# then restore whichever triggers are wanted.

on:
  workflow_dispatch:
    inputs:
      confirm_paid_run:
        description: 'Type RUN_PAID_QUALIFICATION to allow the runtime canary and scored API run'
        required: true
        default: 'NO'
        type: string

permissions:
  contents: read

env:
  MANIFEST: architect/evaluation/sales-lead-conversion/sealed/fresh-cycle-0.3-2026-08-22-r1.qualification.json
  SALES_MODEL: gpt-5.6-terra
  SALES_GRADER_MODEL: gpt-5.6-terra
  SALES_MODEL_TIMEOUT_SECONDS: '120'
  R1_PREREGISTRATION: architect/evaluation/sales-lead-conversion/sealed/fresh-cycle-0.3-2026-08-22-r1.preregistration.json
  CANDIDATE_COMMIT: 5adc0d315f6f63bc92df0a921040954a3541ef89
  CANDIDATE_DIGEST: sha256:a33bae7c2957e415669852d10135902349f20fdc9ae22090bf8d55278e0b15c2

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Static qualification preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$MANIFEST" --phase static

  sealed:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SALES_0_3_FRESH_EVAL_KEY: ${{ secrets.SALES_0_3_FRESH_EVAL_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Sealed no-API preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/sealed-pack"

  runtime:
    needs: sealed
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_paid_run == 'RUN_PAID_QUALIFICATION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Credential presence
        run: test -n "$OPENAI_API_KEY" || (echo '{"status":"FAIL","failure_class":"CREDENTIAL_MISSING"}' && exit 2)
      - name: One-call exact-runtime canary
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$MANIFEST" --phase canary --require-runtime-secret

  scored:
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SALES_0_3_FRESH_EVAL_KEY: ${{ secrets.SALES_0_3_FRESH_EVAL_KEY }}
      SALES_EXECUTOR_CMD: python architect/evaluation/sales-lead-conversion/executor_v0_3_responses.py
      SANITIZED_REPORT_PATH: sanitized-report.json
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Reconstruct sealed pack
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/sealed-pack"
      - name: Run preregistered scored qualification
        id: qualification
        shell: bash
        run: |
          set +e
          python "$RUNNER_TEMP/sealed-pack/runner.py"
          code=$?
          echo "runner_exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate sanitized report
        run: |
          python architect/evaluation/sales-lead-conversion/validate_sanitized_report_v0_3.py \
            --report sanitized-report.json \
            --preregistration "$R1_PREREGISTRATION" \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --candidate-digest "$CANDIDATE_DIGEST"
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.3-fresh-independent-sanitized-report
          path: sanitized-report.json
          if-no-files-found: error
      - name: Enforce verdict
        shell: bash
        run: |
          test "${{ steps.qualification.outputs.runner_exit }}" = "0" || exit 10
          python - <<'PY'
          import json
          r=json.load(open("sanitized-report.json"))
          raise SystemExit(0 if r["verdict"]=="PASS" else 10)
          PY
