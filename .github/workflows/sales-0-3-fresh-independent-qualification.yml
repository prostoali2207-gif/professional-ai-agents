name: Sales 0.3 fresh independent held-out qualification

on:
  push:
    branches: [eval/sales-0.3-fresh-qualification-2026-08-22]
    paths:
      - 'architect/evaluation/sales-lead-conversion/sealed/fresh-cycle-0.3-2026-08-22-r1.qualification.json'
      - 'architect/evaluation/sales-lead-conversion/sealed/fresh-cycle-0.3-2026-08-22-r1.preregistration.json'
      - 'architect/evaluation/sales-lead-conversion/sealed/fresh-cycle-0.3-2026-08-22-r1.parts/**'
      - 'architect/evaluation/sales-lead-conversion/executor_v0_3_responses.py'
      - 'architect/evaluation/sales-lead-conversion/canary_v0_3.py'
      - 'architect/evaluation/sales-lead-conversion/validate_sanitized_report_v0_3.py'
      - '.github/workflows/sales-0-3-fresh-independent-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MANIFEST: architect/evaluation/sales-lead-conversion/sealed/fresh-cycle-0.3-2026-08-22-r1.qualification.json
  SALES_MODEL: gpt-5.6-terra
  SALES_GRADER_MODEL: gpt-5.6-terra
  SALES_MODEL_TIMEOUT_SECONDS: '120'

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Static qualification preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$MANIFEST" --phase static

  sealed:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SALES_0_3_FRESH_EVAL_KEY: ${{ secrets.SALES_0_3_FRESH_EVAL_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Sealed no-API preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/sealed-pack"

  runtime:
    needs: sealed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Credential presence
        run: test -n "$OPENAI_API_KEY" || (echo '{"status":"FAIL","failure_class":"CREDENTIAL_MISSING"}' && exit 2)
      - name: One-call exact-runtime canary
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$MANIFEST" --phase canary --require-runtime-secret

  scored:
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SALES_0_3_FRESH_EVAL_KEY: ${{ secrets.SALES_0_3_FRESH_EVAL_KEY }}
      SALES_EXECUTOR_CMD: python architect/evaluation/sales-lead-conversion/executor_v0_3_responses.py
      SANITIZED_REPORT_PATH: sanitized-report.json
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Reconstruct sealed pack
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/sealed-pack"
      - name: Run preregistered scored qualification
        id: qualification
        shell: bash
        run: |
          set +e
          python "$RUNNER_TEMP/sealed-pack/runner.py"
          code=$?
          echo "runner_exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate sanitized report
        run: python architect/evaluation/sales-lead-conversion/validate_sanitized_report_v0_3.py sanitized-report.json
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.3-fresh-independent-sanitized-report
          path: sanitized-report.json
          if-no-files-found: error
      - name: Enforce verdict
        shell: bash
        run: |
          test "${{ steps.qualification.outputs.runner_exit }}" = "0" || exit 10
          python - <<'PY'
          import json
          r=json.load(open("sanitized-report.json"))
          raise SystemExit(0 if r["verdict"]=="PASS" else 10)
          PY
