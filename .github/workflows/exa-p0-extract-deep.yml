name: Exa P0 Deep Extraction

on:
  push:
    branches:
      - research/research-architecture-benchmark-2026-08
    paths:
      - '.github/workflows/exa-p0-extract-deep.yml'
      - 'architect/research/benchmark/exa-p0-extract-deep.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'mcp>=2,<3'
      - run: python architect/research/benchmark/exa-p0-extract-deep.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exa-p0-extract-deep-record
          path: architect/research/benchmark/runs/exa-p0-extract-deep.json
          if-no-files-found: warn
