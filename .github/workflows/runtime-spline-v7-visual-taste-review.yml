name: Runtime Spline V7 Visual Taste Review

on:
  push:
    branches:
      - runtime/spline-v7-visual-review-20260831

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPLINE_COMMIT: ef792c9f38dbdcab3888bf15caa71e31bb8027d8
      SPLINE_URL: https://auto-parts-landing-five.vercel.app/
    steps:
      - name: Checkout professional core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact Spline source
        uses: actions/checkout@v4
        with:
          repository: prostoali2207-gif/auto-parts-landing
          ref: ef792c9f38dbdcab3888bf15caa71e31bb8027d8
          path: spline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser runtime
        working-directory: spline
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Capture live render evidence
        run: node runtime/spline_visual_review/capture.js

      - name: Run fresh provider-backed visual specialist
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python runtime/spline_visual_review/review.py

      - name: Upload specialist evidence
        uses: actions/upload-artifact@v4
        with:
          name: spline-v7-visual-taste-runtime-review
          path: |
            mobile-full.png
            mobile-process.png
            desktop-full.png
            visual-taste-output.md
            visual-taste-metadata.json
          retention-days: 7
