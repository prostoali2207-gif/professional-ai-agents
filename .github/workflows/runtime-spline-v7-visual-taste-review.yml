name: Runtime Spline V7 Product-Specific Visual Taste Review

on:
  push:
    branches:
      - runtime/spline-v7-product-specific-visual-20260831

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPLINE_COMMIT: 572cd2e663e15acf438e02cd86f5dad7b43a0674
      SPLINE_URL: http://127.0.0.1:3000/
    steps:
      - name: Checkout professional core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact Spline source
        uses: actions/checkout@v4
        with:
          repository: prostoali2207-gif/auto-parts-landing
          ref: 572cd2e663e15acf438e02cd86f5dad7b43a0674
          path: spline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build exact Spline head
        working-directory: spline
        run: |
          npm install
          npm run build
          npx playwright install --with-deps chromium

      - name: Start exact Spline head locally
        working-directory: spline
        run: |
          npm run start -- -p 3000 > /tmp/spline-visual.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/spline-visual.log
          exit 1

      - name: Capture Spline and user-supplied competitor renders
        run: node runtime/spline_visual_review/capture.js

      - name: Run fresh provider-backed Visual Taste specialist
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python runtime/spline_visual_review/review.py

      - name: Upload specialist evidence
        uses: actions/upload-artifact@v4
        with:
          name: spline-v7-product-specific-visual-taste-review
          path: |
            spline-mobile-full.png
            spline-mobile-hero.png
            spline-mobile-form.png
            spline-desktop-full.png
            competitor-sh-mobile.png
            competitor-lll-mobile.png
            competitor-smm-mobile.png
            competitor-samirprobrand-mobile.png
            visual-taste-output.md
            visual-taste-metadata.json
          retention-days: 7
