name: Visual Design Art Direction R6 v0.3 semantic qualification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    if: >-
      github.event.issue.number == 158 &&
      github.actor == 'prostoali2207-gif' &&
      (github.event.comment.body == '/run-visual-r6-v03-semantic' ||
       startsWith(github.event.comment.body, '/resume-visual-r6-v03-semantic '))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      GROQ_MIN_INTERVAL_SECONDS: '60'
      GROQ_PACE_FILE: /tmp/visual-r6-v03-semantic-groq-pace
      GH_TOKEN: ${{ github.token }}
      R6_PACK_DIR: r6-source
      SOURCE_RUN_ID: '33500210303'
      SOURCE_HEAD_SHA: 7e506c6afb85489758bbf8c2ad08ede75264fd1d
      SOURCE_ARTIFACT_ID: '9797673448'
      SOURCE_ARTIFACT_NAME: visual-design-art-direction-v0-3-encrypted-heldout-pack-r6
      SOURCE_ARTIFACT_DIGEST: sha256:9e6286ec436031aa121e631f0613216236322598ed71d8ae8c22938050886142
      R6_CIPHERTEXT_SHA256: ffecad8a5087bda276a95825a1e0071ca18640392a12dbb26f0f8ec5ba78cdeb
      R6_CAL_RUN_ID: '33580704653'
      R6_CAL_RUN_HEAD: 43609a8e76d7f2d4284d659430b9e7c04a8eeda6
      R6_CAL_ARTIFACT_ID: '9829104778'
      R6_CAL_ARTIFACT_NAME: visual-design-art-direction-v0-3-r6-corpus-calibration-report
      R6_CAL_ARTIFACT_DIGEST: sha256:b3d1a066465ae5bcd95363424e8c62f64e383b6e134388b8475c774773eedfe1
      R6_CAL_REPORT_SHA256: 623697cb127501b3ef57f60716f980ae7d252037d5843aa1f90a0de030325239
      CHECKPOINT_ARTIFACT_NAME: visual-design-art-direction-v0-3-r6-semantic-checkpoint
      PROGRESS_ARTIFACT_NAME: visual-design-art-direction-v0-3-r6-semantic-progress
      REPORT_ARTIFACT_NAME: visual-design-art-direction-v0-3-r6-semantic-report
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check cryptography
      - name: Parse exact fresh/resume command
        id: command
        shell: bash
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "$BODY" == "/run-visual-r6-v03-semantic" ]]; then
            echo 'mode=fresh' >> "$GITHUB_OUTPUT"
            echo 'resume_run_id=' >> "$GITHUB_OUTPUT"
          elif [[ "$BODY" =~ ^/resume-visual-r6-v03-semantic\ ([0-9]+)$ ]]; then
            echo 'mode=resume' >> "$GITHUB_OUTPUT"
            echo "resume_run_id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            exit 40
          fi
      - name: Verify frozen release contract before credentials
        run: |
          python -m py_compile architect/evaluation/visual-design-art-direction/semantic/executor_r6_v0_3_gemini.py
          python -m py_compile architect/evaluation/visual-design-art-direction/semantic/run_r6_semantic_qualification_v0_3.py
          python - <<'PY'
          import json,subprocess
          x=json.load(open('architect/evaluation/visual-design-art-direction/release-configuration-r6-v0.3.json'))
          assert x['issue']==158 and x['freeze_state']=='FROZEN_PRE_CANDIDATE_OUTCOME' and x['candidate_calls_at_freeze']==0
          assert x['cycle_id']=='visual-design-art-direction-0.3.0-independent-2026-09-01-r6-semantic'
          c=x['candidate']
          assert c['commit']=='b4793a66172d4de7fe0ade1b0001bc2621829db2' and c['mutation_allowed'] is False
          assert c['freeze_integrity_commit']=='347491bbedeaee6fbda038db9639f16040a41301'
          assert c['candidate_freeze_blob']=='84db2da24f784591c7cc1feb5f1f9a9c22220e40'
          assert c['skill_blob']=='bee4ee67a8aff43016e158f37a6f421cd079581a'
          assert c['professional_model_base_blob']=='bbea595e299445cf79f798ed1e86eecd0b53cd50'
          assert c['professional_model_repair_v02_blob']=='bad4e815a3898dd19c7dfc0a07dd4c1aeeab3d50'
          assert c['professional_model_repair_v03_blob']=='dd42d50f07b804c1ddd3c93b96704e0c6256440c'
          h=x['heldout']
          assert h['artifact_id']==9797673448 and h['source_run']==33500210303
          assert h['artifact_digest']=='sha256:9e6286ec436031aa121e631f0613216236322598ed71d8ae8c22938050886142'
          assert h['sealed_ciphertext_sha256']=='ffecad8a5087bda276a95825a1e0071ca18640392a12dbb26f0f8ec5ba78cdeb'
          assert h['regeneration_or_substitution_allowed'] is False
          assert h['pair_contract_exposed_to_candidate'] is False and h['pair_contract_used_as_new_grading_signal'] is False
          cal=x['calibration']['exact_r6']
          assert cal['run']==33580704653 and cal['run_head']=='43609a8e76d7f2d4284d659430b9e7c04a8eeda6'
          assert cal['status']=='CALIBRATION_PASS' and cal['candidate_calls']==0 and cal['hidden_content_printed'] is False
          assert cal['sanitized_report_artifact_id']==9829104778
          assert cal['sanitized_report_payload_sha256']=='623697cb127501b3ef57f60716f980ae7d252037d5843aa1f90a0de030325239'
          assert cal['duplicate_run_eligible'] is False
          t=x['semantic_release_thresholds']
          assert t['per_judge_candidate_preference_rate_min']==0.8 and t['combined_candidate_preference_rate_min']==0.9
          assert t['max_pair_disagreement_rate']==0.25 and t['p0_tolerance']==0 and t['all_dimension_groups_must_pass'] is True
          assert len(x['families'])==10 and len(x['p0_hard_fails'])==7
          r=x['retry_resume_stop']
          assert r['professional_failure_retry_count']==0 and r['completed_calls_repeated'] is False and r['same_pack_professional_rerun_after_real_failure'] is False
          assert x['rendered_release_gate']['required_after_semantic_pass'] is True
          component_paths={
            'skill_blob':'architect/evaluation/visual-design-art-direction/candidate/SKILL.md',
            'professional_model_base_blob':'architect/evaluation/visual-design-art-direction/professional-model-candidate-v0.1.md',
            'professional_model_repair_v02_blob':'architect/evaluation/visual-design-art-direction/professional-model-p0-repair-v0.2.md',
            'professional_model_repair_v03_blob':'architect/evaluation/visual-design-art-direction/professional-model-p0-repair-v0.3.md',
          }
          for key,path in component_paths.items():
            assert subprocess.check_output(['git','rev-parse',f"{c['commit']}:{path}"],text=True).strip()==c[key]
          runtime=x['candidate_runtime']; runner=x['semantic_runner']
          assert subprocess.check_output(['git','rev-parse','HEAD:'+runtime['executor_path']],text=True).strip()==runtime['executor_blob']
          assert subprocess.check_output(['git','rev-parse','HEAD:'+runner['path']],text=True).strip()==runner['blob']
          print('VISUAL_R6_V03_FROZEN_RELEASE_CONTRACT_PASS candidate_calls=0')
          PY
      - name: Verify immutable R6 source artifact metadata
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" > source-meta.json
          python - <<'PY'
          import json,os
          x=json.load(open('source-meta.json'))
          assert str(x['id'])==os.environ['SOURCE_ARTIFACT_ID'] and x['name']==os.environ['SOURCE_ARTIFACT_NAME']
          assert x['digest']==os.environ['SOURCE_ARTIFACT_DIGEST'] and not x['expired']
          assert str(x['workflow_run']['id'])==os.environ['SOURCE_RUN_ID'] and x['workflow_run']['head_sha']==os.environ['SOURCE_HEAD_SHA']
          print('VISUAL_R6_V03_SOURCE_ARTIFACT_PASS')
          PY
      - name: Verify exact canonical R6 calibration evidence
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${R6_CAL_ARTIFACT_ID}" > cal-meta.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${R6_CAL_RUN_ID}" > cal-run.json
          mkdir -p r6-cal
          gh run download "$R6_CAL_RUN_ID" -n "$R6_CAL_ARTIFACT_NAME" --dir r6-cal
          python - <<'PY'
          import hashlib,json,os
          m=json.load(open('cal-meta.json'))
          run=json.load(open('cal-run.json'))
          assert str(m['id'])==os.environ['R6_CAL_ARTIFACT_ID'] and m['name']==os.environ['R6_CAL_ARTIFACT_NAME']
          assert m['digest']==os.environ['R6_CAL_ARTIFACT_DIGEST'] and not m['expired']
          assert str(m['workflow_run']['id'])==os.environ['R6_CAL_RUN_ID']
          assert str(run['id'])==os.environ['R6_CAL_RUN_ID'] and run['head_sha']==os.environ['R6_CAL_RUN_HEAD']
          assert run['status']=='completed' and run['conclusion']=='success'
          p='r6-cal/visual-r6-v03-corpus-calibration-sanitized-report.json'
          assert hashlib.sha256(open(p,'rb').read()).hexdigest()==os.environ['R6_CAL_REPORT_SHA256']
          x=json.load(open(p))
          assert x['status']=='CALIBRATION_PASS' and x['candidate_calls']==0 and x['hidden_content_printed'] is False
          assert x['per_judge_expected_winner_rate']=={'gemini':1.0,'groq':1.0}
          assert x['combined_expected_winner_rate']==1.0 and x['pair_disagreement_rate']==0.0
          assert x['source']['artifact_id']==os.environ['SOURCE_ARTIFACT_ID']
          assert x['source']['sealed_ciphertext_sha256']==os.environ['R6_CIPHERTEXT_SHA256']
          print('VISUAL_R6_V03_EXACT_CANONICAL_CALIBRATION_PASS candidate_calls=0')
          PY
      - name: Require evaluator credentials
        run: |
          test -n "$GEMINI_API_KEY" || exit 22
          test -n "$GROQ_API_KEY" || exit 24
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || exit 23
      - name: Verify candidate runtime contract without provider call
        run: |
          python architect/evaluation/visual-design-art-direction/semantic/executor_r6_v0_3_gemini.py --qualification-contract > candidate-contract.json
          python - <<'PY'
          import json
          x=json.load(open('candidate-contract.json'))
          assert x['candidate_commit']=='b4793a66172d4de7fe0ade1b0001bc2621829db2'
          assert x['skill_blob']=='bee4ee67a8aff43016e158f37a6f421cd079581a'
          assert x['professional_model_base_blob']=='bbea595e299445cf79f798ed1e86eecd0b53cd50'
          assert x['professional_model_repair_v02_blob']=='bad4e815a3898dd19c7dfc0a07dd4c1aeeab3d50'
          assert x['professional_model_repair_v03_blob']=='dd42d50f07b804c1ddd3c93b96704e0c6256440c'
          assert x['provider']=='gemini-interactions-api' and x['model']=='gemini-3.5-flash-lite'
          assert x['tool_protocol']=='none-v1' and x['state_protocol']=='stateless-v1' and x['observable_protocol']=='final-output-only-v1'
          print('VISUAL_R6_V03_CANDIDATE_CONTRACT_PASS provider_calls=0')
          PY
      - name: Download exact sealed R6 corpus
        run: |
          mkdir -p "$R6_PACK_DIR"
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT_NAME" --dir "$R6_PACK_DIR"
      - name: Restore exact checkpoint only for infrastructure resume
        if: steps.command.outputs.mode == 'resume'
        env:
          RESUME_RUN_ID: ${{ steps.command.outputs.resume_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}" > resume-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}/artifacts?per_page=100" > resume-artifacts.json
          python - <<'PY'
          import json,os
          run=json.load(open('resume-run.json'))
          assert str(run['id'])==os.environ['RESUME_RUN_ID']
          assert run['path']=='.github/workflows/visual-design-art-direction-r6-v03-semantic-qualification.yml'
          assert run['event']=='issue_comment' and run['status']=='completed'
          arts=json.load(open('resume-artifacts.json'))['artifacts']
          names={a['name']:a for a in arts}
          for name in (os.environ['CHECKPOINT_ARTIFACT_NAME'],os.environ['PROGRESS_ARTIFACT_NAME']):
            assert name in names and not names[name]['expired']
          print('VISUAL_R6_V03_RESUME_SOURCE_METADATA_PASS')
          PY
          mkdir -p checkpoint-source progress-source
          gh run download "$RESUME_RUN_ID" -n "$CHECKPOINT_ARTIFACT_NAME" --dir checkpoint-source
          gh run download "$RESUME_RUN_ID" -n "$PROGRESS_ARTIFACT_NAME" --dir progress-source
          cp checkpoint-source/visual-r6-v03-semantic-checkpoint.enc ./visual-r6-v03-semantic-checkpoint.enc
          cp progress-source/visual-r6-v03-semantic-progress.json ./resume-progress.json
      - name: Verify R6 ciphertext and fresh/resume state before provider calls
        env:
          MODE: ${{ steps.command.outputs.mode }}
        run: |
          python - <<'PY'
          import hashlib,importlib.util,json,os
          from pathlib import Path
          base=Path(os.environ['R6_PACK_DIR'])
          manifest=json.load(open(base/'heldout-r6.manifest.json'))
          token=''.join(p.read_text() for p in sorted((base/'heldout-r6.parts').iterdir())).encode()
          assert hashlib.sha256(token).hexdigest()==os.environ['R6_CIPHERTEXT_SHA256']==manifest['ciphertext_sha256']
          assert manifest['schema_version']=='0.6'
          assert manifest['cycle_id']=='visual-design-art-direction-0.3.0-independent-2026-09-01-r6-semantic'
          assert manifest['candidate_commit']=='b4793a66172d4de7fe0ade1b0001bc2621829db2'
          assert manifest['freeze_integrity_commit']=='347491bbedeaee6fbda038db9639f16040a41301'
          assert manifest['candidate_freeze_blob']=='84db2da24f784591c7cc1feb5f1f9a9c22220e40'
          assert manifest['candidate_blobs']=={
            'skill':'bee4ee67a8aff43016e158f37a6f421cd079581a',
            'professional_model_base':'bbea595e299445cf79f798ed1e86eecd0b53cd50',
            'professional_model_repair_v02':'bad4e815a3898dd19c7dfc0a07dd4c1aeeab3d50',
            'professional_model_repair_v03':'dd42d50f07b804c1ddd3c93b96704e0c6256440c',
          }
          assert manifest['item_count']==20 and manifest['family_count']==10 and manifest['pair_count']==5
          assert manifest['pair_contract_count']==5 and manifest['pair_contract_schema_version']=='0.1'
          assert manifest['candidate_calls']==0 and manifest['hidden_content_printed'] is False
          assert manifest['historical_r3_reused'] is False and manifest['historical_r4_reused'] is False and manifest['historical_r5_reused'] is False
          p=Path('architect/evaluation/visual-design-art-direction/semantic/run_r6_semantic_qualification_v0_3.py')
          spec=importlib.util.spec_from_file_location('r6score',p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          state=m.module.load_state()
          assert set(state)=={'candidate','judges'}
          c=len(state['candidate']); j=len(state['judges'])
          if os.environ['MODE']=='fresh':
            assert c==0 and j==0 and not Path('resume-progress.json').exists()
          else:
            progress=json.load(open('resume-progress.json'))
            assert progress['status']=='INFRASTRUCTURE_FAILURE' and progress['hidden_content_printed'] is False
            assert progress['candidate_calls']==c and progress['completed_judgments']==j
            assert 0<=c<=20 and 0<=j<=40
            for key in state['judges']:
              cid,provider=key.rsplit(':',1)
              assert cid in state['candidate'] and provider in {'gemini','groq'}
          print(f"VISUAL_R6_V03_PRE_SCORE_STATE_PASS mode={os.environ['MODE']} candidate_calls={c} completed_judgments={j} hidden_content_printed=false")
          PY
      - name: Run frozen scored FULL semantic qualification
        id: semantic
        shell: bash
        run: |
          set +e
          python architect/evaluation/visual-design-art-direction/semantic/run_r6_semantic_qualification_v0_3.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload encrypted checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-design-art-direction-v0-3-r6-semantic-checkpoint
          path: visual-r6-v03-semantic-checkpoint.enc
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-design-art-direction-v0-3-r6-semantic-progress
          path: visual-r6-v03-semantic-progress.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-design-art-direction-v0-3-r6-semantic-report
          path: visual-r6-v03-semantic-sanitized-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce frozen semantic release gate
        if: always()
        run: |
          test -f visual-r6-v03-semantic-progress.json || exit 31
          python - <<'PY'
          import json,os
          p=json.load(open('visual-r6-v03-semantic-progress.json'))
          code='${{ steps.semantic.outputs.exit_code }}'
          assert p['hidden_content_printed'] is False
          if p['status']=='INFRASTRUCTURE_FAILURE':
              print('VISUAL_R6_V03_INFRASTRUCTURE_FAILURE_RESUME_ONLY_MISSING_CALLS')
              raise SystemExit(30)
          if not os.path.exists('visual-r6-v03-semantic-sanitized-report.json'):
              raise SystemExit(31)
          r=json.load(open('visual-r6-v03-semantic-sanitized-report.json'))
          c=r['candidate']
          assert c['commit']=='b4793a66172d4de7fe0ade1b0001bc2621829db2'
          assert c['freeze_integrity_commit']=='347491bbedeaee6fbda038db9639f16040a41301'
          assert c['candidate_freeze_blob']=='84db2da24f784591c7cc1feb5f1f9a9c22220e40'
          assert c['skill_blob']=='bee4ee67a8aff43016e158f37a6f421cd079581a'
          assert c['professional_model_base_blob']=='bbea595e299445cf79f798ed1e86eecd0b53cd50'
          assert c['professional_model_repair_v02_blob']=='bad4e815a3898dd19c7dfc0a07dd4c1aeeab3d50'
          assert c['professional_model_repair_v03_blob']=='dd42d50f07b804c1ddd3c93b96704e0c6256440c'
          assert r['candidate_calls']==20 and r['case_count']==20 and r['hidden_content_printed'] is False
          assert r['pair_contract_exposed_to_candidate'] is False and r['pair_contract_used_as_new_grading_signal'] is False
          assert r['source_artifact']['artifact_id']==9797673448 and r['source_artifact']['sealed_ciphertext_sha256']=='ffecad8a5087bda276a95825a1e0071ca18640392a12dbb26f0f8ec5ba78cdeb'
          assert r['calibration']['exact_r6_run']==33580704653 and r['calibration']['exact_r6_report_sha256']=='623697cb127501b3ef57f60716f980ae7d252037d5843aa1f90a0de030325239'
          if r['status']=='SEMANTIC_PASS':
              assert code=='0' and r['rendered_gate_required_after_semantic_pass'] is True
              print('VISUAL_R6_V03_SEMANTIC_PASS_RENDERED_P1_P4_REQUIRED')
              raise SystemExit(0)
          if r['status']=='SEMANTIC_REVISE': raise SystemExit(20)
          if r['status']=='SEMANTIC_FAIL_P0': raise SystemExit(21)
          if r['status']=='SEMANTIC_ADJUDICATION_REQUIRED': raise SystemExit(22)
          raise SystemExit(32)
          PY
