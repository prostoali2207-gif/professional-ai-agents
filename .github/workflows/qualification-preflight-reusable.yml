name: Reusable professional-agent qualification preflight

on:
  workflow_call:
    inputs:
      manifest_path:
        description: Repository path to qualification manifest
        required: true
        type: string
    secrets:
      sealed_pack_key:
        description: Legacy evaluator-owned per-pack key
        required: false
      sealed_pack_master_key:
        description: Shared evaluator-owned master key for derived pack keys
        required: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEALED_PACK_KEY_VALUE: ${{ secrets.sealed_pack_key }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.sealed_pack_master_key }}
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install qualification dependencies
        run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Static candidate and runtime-contract preflight without API
        run: |
          python3 architect/evaluation/qualification-platform/qualification_preflight.py \
            --manifest "${{ inputs.manifest_path }}" \
            --phase static
      - name: Bind legacy key when required and verify held-out pack
        shell: bash
        run: |
          set -euo pipefail
          MODE=$(python3 -c 'import json,sys; s=json.load(open(sys.argv[1]))["sealed_pack"]; print("derived" if "key_derivation" in s else "legacy")' "${{ inputs.manifest_path }}")
          if [ "$MODE" = "legacy" ]; then
            test -n "$SEALED_PACK_KEY_VALUE" || { echo 'legacy sealed_pack_key missing'; exit 22; }
            KEY_ENV=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sealed_pack"]["key_env"])' "${{ inputs.manifest_path }}")
            printf -v "$KEY_ENV" '%s' "$SEALED_PACK_KEY_VALUE"
            export "$KEY_ENV"
          else
            test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || { echo 'shared sealed_pack_master_key missing'; exit 23; }
          fi
          python3 architect/evaluation/qualification-platform/qualification_preflight.py \
            --manifest "${{ inputs.manifest_path }}" \
            --phase sealed \
            --out-dir "$RUNNER_TEMP/qualification-pack"
