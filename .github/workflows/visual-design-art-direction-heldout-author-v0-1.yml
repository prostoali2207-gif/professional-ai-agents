name: Visual Design Art Direction heldout author v0.1
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  author:
    if: github.event.issue.number == 158 && github.event.comment.body == '/author-visual-heldout' && github.actor == 'prostoali2207-gif'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      GROQ_MIN_INTERVAL_SECONDS: '60'
      GROQ_PACE_FILE: /tmp/visual-heldout-groq-pace
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Static candidate-free heldout author preflight
        run: |
          python -m py_compile architect/evaluation/visual-design-art-direction/heldout/author_sealed_heldout_v0_1.py architect/evaluation/visual-design-art-direction/heldout/author_sealed_heldout_v0_1_normalized.py
          python - <<'PY'
          from pathlib import Path
          p=Path('architect/evaluation/visual-design-art-direction/heldout/author_sealed_heldout_v0_1.py').read_text()
          n=Path('architect/evaluation/visual-design-art-direction/heldout/author_sealed_heldout_v0_1_normalized.py').read_text()
          assert "CANDIDATE_COMMIT='e8be839b02f181193afe076839c6ae94fb477a9b'" in p
          assert "candidate_calls':0" in p
          assert 'candidate_response' not in p+n and 'CANDIDATE_EXECUTOR' not in p+n
          assert "GROQ_MODEL='openai/gpt-oss-120b'" in p and "GEMINI_MODEL='gemini-3.5-flash-lite'" in p
          assert "case['id']=f'{family}-{seen[family]:02d}'" in n and "case['pair_id']=mod.PAIR_IDS.get(family)" in n
          print('HELDOUT_AUTHOR_STATIC_PASS')
          PY
      - name: Require evaluator credentials
        run: |
          test -n "$GEMINI_API_KEY" || exit 22
          test -n "$GROQ_API_KEY" || exit 24
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || exit 23
      - name: Install sealing dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Author audit and seal fresh heldout corpus
        run: python architect/evaluation/visual-design-art-direction/heldout/author_sealed_heldout_v0_1_normalized.py
      - name: Verify sealed manifest is candidate-free
        run: |
          python - <<'PY'
          import json
          p='architect/evaluation/visual-design-art-direction/heldout/sealed/heldout-v0.1.manifest.json'
          m=json.load(open(p))
          assert m['candidate_commit']=='e8be839b02f181193afe076839c6ae94fb477a9b'
          assert m['item_count']==20 and m['family_count']==10 and m['pair_count']==5
          assert m['candidate_calls']==0 and m['hidden_content_printed'] is False
          print('HELDOUT_SEAL_PASS',m['ciphertext_sha256'])
          PY
      - name: Upload encrypted heldout pack
        uses: actions/upload-artifact@v4
        with:
          name: visual-design-art-direction-v0-1-encrypted-heldout-pack
          path: architect/evaluation/visual-design-art-direction/heldout/sealed
          if-no-files-found: error
          retention-days: 14
