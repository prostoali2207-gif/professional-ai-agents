name: Content Architecture v0.4 UAE composition r1 freeze

on:
  push:
    branches:
      - eval/content-architecture-v04-uae-composition-r1
    paths:
      - 'architect/evaluation/content-architecture-v04-uae-composition-r1/FREEZE-UAE-R1-v0.1'

permissions:
  contents: read

jobs:
  prepare-wheelhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned Windows evaluator dependency
        shell: bash
        run: |
          mkdir -p wheelhouse
          python -m pip download --disable-pip-version-check --no-input --only-binary=:all: --platform win_amd64 --python-version 312 --implementation cp --abi cp312 --dest wheelhouse cryptography==44.0.2
      - uses: actions/upload-artifact@v4
        with:
          name: content-architecture-v04-uae-composition-r1-freeze-wheelhouse
          path: wheelhouse/
          retention-days: 1

  freeze:
    needs: prepare-wheelhouse
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      FROZEN_ARTIFACT_CODEX_MODEL: gpt-5.6-sol
      FROZEN_ARTIFACT_CODEX_REASONING: medium
      FROZEN_ARTIFACT_CODEX_TIMEOUT: '300'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: content-architecture-v04-uae-composition-r1-freeze-wheelhouse
          path: ${{ runner.temp }}/ca-v04-uae-r1-wheelhouse
      - name: Install evaluator dependency offline
        shell: powershell
        run: python -m pip install --disable-pip-version-check --no-input --no-index --find-links "$env:RUNNER_TEMP\ca-v04-uae-r1-wheelhouse" cryptography==44.0.2
      - name: Resolve Codex CLI from interactive user installation
        shell: powershell
        run: |
          $resolved = $null
          $cmd = Get-Command codex -ErrorAction SilentlyContinue
          if ($cmd) { $resolved = $cmd.Source }
          if (-not $resolved) {
            $candidates = @(
              (Join-Path $env:APPDATA 'npm\codex.cmd'),
              (Join-Path $env:APPDATA 'npm\codex.exe'),
              (Join-Path $env:LOCALAPPDATA 'npm\codex.cmd'),
              (Join-Path $env:LOCALAPPDATA 'npm\codex.exe'),
              (Join-Path $env:USERPROFILE '.local\bin\codex.exe'),
              (Join-Path $env:USERPROFILE 'scoop\shims\codex.exe'),
              (Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\codex.exe')
            )
            foreach ($candidate in $candidates) { if (Test-Path $candidate) { $resolved = $candidate; break } }
          }
          if (-not $resolved) {
            $npm = Get-Command npm -ErrorAction SilentlyContinue
            if ($npm) {
              $prefix = (& npm config get prefix 2>$null | Out-String).Trim()
              if ($prefix) {
                foreach ($name in @('codex.cmd','codex.exe')) {
                  $candidate = Join-Path $prefix $name
                  if (Test-Path $candidate) { $resolved = $candidate; break }
                }
              }
            }
          }
          if (-not $resolved) {
            $roots = @(
              (Join-Path $env:LOCALAPPDATA 'OpenAI\Codex\bin'),
              (Join-Path $env:LOCALAPPDATA 'Programs'),
              (Join-Path $env:USERPROFILE '.vscode\extensions'),
              (Join-Path $env:USERPROFILE '.cursor\extensions')
            )
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              $found = Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -in @('codex.exe','codex.cmd') } |
                Select-Object -First 1
              if ($found) { $resolved = $found.FullName; break }
            }
          }
          if (-not $resolved) { Write-Error 'Codex CLI not found'; exit 40 }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $resolved)
          Write-Host 'codex_cli_resolved=true'
          & $resolved --version
          & $resolved login status
      - name: Verify preregistered identities, applied specialization and runtime
        shell: powershell
        run: |
          if (-not $env:QUALIFICATION_SEALED_PACK_MASTER_KEY) { exit 31 }
          git fetch origin agent/content-architecture-core-2026-08 main
          git fetch https://github.com/prostoali2207-gif/auto-sales-growth-system.git agent/content-analyst-rebuild-2026-08
          if ((git cat-file -t 5d440e1bf3e20fbd35c6ab276310a904e36cc06d) -ne 'blob') { exit 32 }
          if ((git cat-file -t 7f41c2d1ba40c3b4c59e3eba2fb264c04162c320) -ne 'blob') { exit 33 }
          $checks = @(
            @('architect/evaluation/content-architecture-v04-uae-composition-r1/author_pack_r1.py','bbeb247434074c9e081cec4e16cbaf7a0f7445c8'),
            @('architect/evaluation/content-architecture-v04-uae-composition-r1/author_pack_r1_v2.py','ab3f34232dd08efbf416ea5c8455dc67861be4be'),
            @('architect/evaluation/content-architecture-v04-uae-composition-r1/run_uae_r1.py','00c9a71b3dd02b57ff8d408a630d734ea585396d'),
            @('architect/evaluation/content-architecture-v04-uae-composition-r1/test_uae_r1.py','361e678c4619452f708d47ca71fa36571d01ba23'),
            @('architect/evaluation/content-architecture-v04-uae-composition-r1/judge-uae-composition.md','669cdfcd0195d0507637d377b48f2650b4a870dd'),
            @('architect/evaluation/content-architecture-v04-uae-composition-r1/preregistration-r1.json','5318f5b4cf5886a424752e85cb6f43f8232655d3'),
            @('architect/evaluation/harness/adapters/codex_frozen_artifact_adapter.py','d1ef178b739a638a883c5a1d0efe5e431bd3b34d'),
            @('architect/evaluation/harness/adapters/codex_frozen_artifact_mcp.py','73e9349391d4aa83dd459ed23e4069a3cf9a2072')
          )
          foreach ($item in $checks) {
            $actual = (git hash-object $item[0]).Trim()
            if ($actual -ne $item[1]) { Write-Error "Preregistered blob mismatch: $($item[0])"; exit 34 }
          }
          @'
          import json, pathlib, subprocess
          p=json.loads(pathlib.Path('architect/evaluation/content-architecture-v04-uae-composition-r1/preregistration-r1.json').read_text())
          assert p['status']=='PREREGISTERED_PRE_FREEZE'
          assert p['components']['uae_specialization']['blob_sha']=='7f41c2d1ba40c3b4c59e3eba2fb264c04162c320'
          auth=subprocess.run(['codex','login','status'],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=15)
          if auth.returncode != 0 or 'Logged in using ChatGPT' not in ((auth.stdout or '')+(auth.stderr or '')): raise SystemExit(41)
          ver=subprocess.run(['codex','--version'],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=15)
          version=((ver.stdout or '')+(ver.stderr or '')).strip()
          print('codex_version='+version)
          if ver.returncode != 0 or version != 'codex-cli 0.151.0-alpha.7.2': raise SystemExit(42)
          print('uae composition r1 identity/runtime binding: PASS')
          '@ | python -
      - name: Run deterministic evaluator tests
        shell: powershell
        run: |
          python -m py_compile architect/evaluation/content-architecture-v04-uae-composition-r1/author_pack_r1.py architect/evaluation/content-architecture-v04-uae-composition-r1/author_pack_r1_v2.py architect/evaluation/content-architecture-v04-uae-composition-r1/run_uae_r1.py architect/evaluation/content-architecture-v04-uae-composition-r1/test_uae_r1.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python architect/evaluation/content-architecture-v04-uae-composition-r1/test_uae_r1.py
      - name: Author fresh UAE composition corpus
        shell: powershell
        run: |
          $pack = Join-Path $env:RUNNER_TEMP 'ca-v04-uae-r1-pack'
          New-Item -ItemType Directory -Force -Path $pack | Out-Null
          python architect/evaluation/content-architecture-v04-uae-composition-r1/author_pack_r1_v2.py --out $pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Calibrate blind UAE assessor before candidate execution
        shell: powershell
        run: |
          $pack = Join-Path $env:RUNNER_TEMP 'ca-v04-uae-r1-pack\sealed-pack.bin'
          $out = Join-Path $env:RUNNER_TEMP 'ca-v04-uae-r1-calibration'
          python architect/evaluation/content-architecture-v04-uae-composition-r1/run_uae_r1.py --mode calibrate --pack $pack --out $out --timeout 300
          exit $LASTEXITCODE
      - name: Build freeze evidence
        shell: powershell
        run: |
          $env:PACK_DIR = Join-Path $env:RUNNER_TEMP 'ca-v04-uae-r1-pack'
          $env:CAL_DIR = Join-Path $env:RUNNER_TEMP 'ca-v04-uae-r1-calibration'
          $env:FREEZE_DIR = Join-Path $env:RUNNER_TEMP 'ca-v04-uae-r1-freeze'
          New-Item -ItemType Directory -Force -Path $env:FREEZE_DIR | Out-Null
          @'
          import hashlib, importlib.util, json, os, pathlib, shutil, subprocess
          pack=pathlib.Path(os.environ['PACK_DIR']); cal=pathlib.Path(os.environ['CAL_DIR']); out=pathlib.Path(os.environ['FREEZE_DIR'])
          manifest=json.loads((pack/'sealed-manifest.json').read_text())
          creport=json.loads((cal/'calibration-report.json').read_text())
          assert manifest['gate_id']=='content-architecture-v0.4-uae-composition-2026-09-01-r1'
          assert manifest['specialization_sha']=='7f41c2d1ba40c3b4c59e3eba2fb264c04162c320'
          assert manifest['case_count']==8 and manifest['calibration_pair_count']==3
          assert creport['status']=='CALIBRATION_PASS' and creport['candidate_calls']==0
          spec=importlib.util.spec_from_file_location('r','architect/evaluation/content-architecture-v04-uae-composition-r1/run_uae_r1.py'); r=importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          composed_sha, composed_identity=r.assemble_composed_blob()
          ver=subprocess.run(['codex','--version'],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=15)
          freeze={
            'gate_id':manifest['gate_id'],'core_sha':manifest['core_sha'],'specialization_sha':manifest['specialization_sha'],
            'plain_identity_sha256':manifest['plain_identity_sha256'],'case_count':manifest['case_count'],'calibration_pair_count':manifest['calibration_pair_count'],
            'calibration_report_sha256':hashlib.sha256((cal/'calibration-report.json').read_bytes()).hexdigest(),
            'calibration_status':creport['status'],'calibration_expected_winner_rate':creport['expected_winner_rate'],
            'assembly_version':'content-architecture-uae-composition-v1','composed_blob_sha':composed_sha,'composed_identity_sha256':composed_identity,
            'provider':'codex-cli-chatgpt-subscription','model':'gpt-5.6-sol','reasoning_effort':'medium','codex_cli_version':((ver.stdout or '')+(ver.stderr or '')).strip(),
            'provider_api_keys_used':False,'scored_candidate_calls':0,'universal_release_run_id':33501449175,'universal_release_verdict':'PASS'
          }
          (out/'freeze-evidence.json').write_text(json.dumps(freeze,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          shutil.copy2(pack/'sealed-manifest.json',out/'sealed-manifest.json'); shutil.copy2(cal/'calibration-report.json',out/'calibration-report.json')
          print(json.dumps(freeze,sort_keys=True))
          '@ | python -
      - name: Upload UAE composition r1 freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: content-architecture-v04-uae-composition-r1-freeze-evidence
          path: ${{ runner.temp }}/ca-v04-uae-r1-freeze/
          retention-days: 30
