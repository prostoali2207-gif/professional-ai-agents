name: Content Architecture v0.4 practical handoff r2

on:
  push:
    branches:
      - eval/content-architecture-v04-practical-handoff-r2
    paths:
      - 'architect/evaluation/content-architecture-v04-practical-handoff-r2/RUN-PRACTICAL-HANDOFF-v0.1'

permissions:
  contents: read
  actions: read

jobs:
  practical:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      FROZEN_ARTIFACT_CODEX_MODEL: gpt-5.6-sol
      FROZEN_ARTIFACT_CODEX_REASONING: medium
      FROZEN_ARTIFACT_CODEX_TIMEOUT: '300'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve frozen Codex runtime
        shell: powershell
        run: |
          $resolved = $null
          $cmd = Get-Command codex -ErrorAction SilentlyContinue
          if ($cmd) { $resolved = $cmd.Source }
          if (-not $resolved) {
            $candidates = @((Join-Path $env:APPDATA 'npm\codex.cmd'),(Join-Path $env:APPDATA 'npm\codex.exe'),(Join-Path $env:LOCALAPPDATA 'npm\codex.cmd'),(Join-Path $env:LOCALAPPDATA 'npm\codex.exe'),(Join-Path $env:USERPROFILE '.local\bin\codex.exe'),(Join-Path $env:USERPROFILE 'scoop\shims\codex.exe'),(Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\codex.exe'))
            foreach ($candidate in $candidates) { if (Test-Path $candidate) { $resolved=$candidate; break } }
          }
          if (-not $resolved) {
            $roots = @((Join-Path $env:LOCALAPPDATA 'OpenAI\Codex\bin'),(Join-Path $env:LOCALAPPDATA 'Programs'),(Join-Path $env:USERPROFILE '.vscode\extensions'),(Join-Path $env:USERPROFILE '.cursor\extensions'))
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              $found = Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -in @('codex.exe','codex.cmd') } | Select-Object -First 1
              if ($found) { $resolved = $found.FullName; break }
            }
          }
          if (-not $resolved) { Write-Error 'Codex CLI not found'; exit 40 }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $resolved)
          & $resolved --version
          $version = (& $resolved --version 2>&1 | Out-String).Trim()
          if ($version -ne 'codex-cli 0.151.0-alpha.7.2') { Write-Error "runtime drift: $version"; exit 42 }
          $auth = (& $resolved login status 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $auth -notmatch 'Logged in using ChatGPT') { Write-Error 'Codex ChatGPT login unavailable'; exit 41 }
      - name: Fetch immutable cross-repo inputs
        shell: powershell
        run: |
          git fetch origin agent/content-architecture-core-2026-08
          git fetch https://github.com/prostoali2207-gif/auto-sales-growth-system.git eval/content-analyst-v04-practical-handoff
          if ((git cat-file -t f7705db595b55dc237a44538c8b5f03c0a6aa4fe) -ne 'commit') { Write-Error 'Frozen auto-sales practical commit unavailable'; exit 43 }
          git fetch https://github.com/prostoali2207-gif/auto-sales-growth-system.git main
          $required=@('5d440e1bf3e20fbd35c6ab276310a904e36cc06d','7f41c2d1ba40c3b4c59e3eba2fb264c04162c320','82694481f857e9c318317adc0cf81b6e50d877e2','35bddc15f19ce4af666247cd2dd229c7a7eabe34','0fcc7bed521aa575a126ee1eea2b28a29a38ad77','d8eee4c6f9141f362d91a340c37dcae6ad6bfa71','8b2b5ef822387f4e1f006dc036a08f2e42113d1f','01fa57c40d01a79752af1a7f7f5290859521615b','845959e914b2db531f7507b2a1f14b6987767bfa','7fea2f60b87198ec2f7ee15cd34c84260914ff2f')
          foreach ($sha in $required) { if ((git cat-file -t $sha) -ne 'blob') { Write-Error "Missing frozen blob: $sha"; exit 44 } }
      - name: Verify r2 freeze and zero-call state
        shell: powershell
        run: |
          @'
          import json, pathlib, subprocess
          root=pathlib.Path('.')
          rec=json.loads((root/'architect/evaluation/content-architecture-v04-practical-handoff-r2/freeze-record-v0.1.json').read_text(encoding='utf-8'))
          assert rec['status']=='FROZEN_PRE_SCORE'
          assert rec['gate_id']=='content-architecture-v0.4-practical-handoff-2026-09-02-r2'
          assert rec['candidate_calls_before_freeze']==0
          for path,expected in rec['repository_blob_hashes'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==expected,(path,actual,expected)
          pre=json.loads((root/'architect/evaluation/content-architecture-v04-practical-handoff-r2/preregistration-v0.1.json').read_text(encoding='utf-8'))
          assert pre['status']=='DISPATCHABLE_FROZEN'
          assert pre['protocol']['scored_retries_allowed']==0
          print('r2 frozen identities: PASS')
          '@ | python -
      - name: Zero-call preflight
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'ca-v04-practical-r2-preflight'
          python architect/evaluation/content-architecture-v04-practical-handoff-r2/run_practical_handoff_v01.py --out $out --preflight-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run single scored practical handoff r2
        id: scored
        continue-on-error: true
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'ca-v04-practical-r2-scored'
          python architect/evaluation/content-architecture-v04-practical-handoff-r2/run_practical_handoff_v01.py --out $out --timeout 300
          $code=$LASTEXITCODE
          Set-Content -Path (Join-Path $out 'workflow-exit-code.txt') -Value $code
          exit $code
      - name: Upload r2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-architecture-v04-practical-handoff-r2-result
          path: ${{ runner.temp }}/ca-v04-practical-r2-scored/
          retention-days: 30
      - name: Apply frozen r2 outcome
        if: always()
        shell: powershell
        env:
          OUT_DIR: ${{ runner.temp }}/ca-v04-practical-r2-scored
        run: |
          @'
          import json, os, pathlib
          out=pathlib.Path(os.environ['OUT_DIR']); report=out/'qualification-report.json'; runtime=out/'runtime-failure.json'
          if runtime.exists(): print(runtime.read_text(encoding='utf-8')); raise SystemExit(30)
          if not report.exists(): raise SystemExit(31)
          r=json.loads(report.read_text(encoding='utf-8')); print(json.dumps(r,sort_keys=True))
          raise SystemExit(0 if r['verdict']=='PASS' else 20)
          '@ | python -
