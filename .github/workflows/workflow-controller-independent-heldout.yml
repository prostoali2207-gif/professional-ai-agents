name: Workflow Controller independent heldout

on:
  pull_request:
    paths:
      - 'architect/evaluation/workflow-controller/independent-heldout/**'
      - '.github/workflows/workflow-controller-independent-heldout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout independent evaluator
        uses: actions/checkout@v4
        with:
          path: evaluator
      - name: Checkout exact frozen applied candidate
        uses: actions/checkout@v4
        with:
          repository: prostoali2207-gif/auto-sales-growth-system
          ref: d7430fa99c10cfc89dd0f12872970e4b629bf9e6
          path: candidate
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact frozen candidate commit
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "d7430fa99c10cfc89dd0f12872970e4b629bf9e6"
      - name: Run cross-repo exhaustive heldout
        id: qualify
        shell: bash
        run: |
          set +e
          node evaluator/architect/evaluation/workflow-controller/independent-heldout/run_matrix_heldout.mjs \
            candidate "$RUNNER_TEMP/workflow-controller-independent-report.json"
          code=$?
          echo "qualification_exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Publish sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-controller-independent-heldout-evidence
          path: ${{ runner.temp }}/workflow-controller-independent-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce verdict
        if: always()
        run: test "${qualification_exit_code:-missing}" = "0"
