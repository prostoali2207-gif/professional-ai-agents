name: Strategist v0.1 r2 Gemini-Groq qualification

on:
  workflow_dispatch:
    inputs:
      confirm_run:
        description: 'Type RUN_FREE_QUALIFICATION_R2 to authorize Gemini+Groq held-out qualification'
        required: true
        type: string

permissions:
  contents: write

jobs:
  qualify:
    if: ${{ inputs.confirm_run == 'RUN_FREE_QUALIFICATION_R2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      STRATEGIST_MODEL: gemini-3.5-flash-lite
      STRATEGIST_MIN_REQUEST_INTERVAL: '13'
      QUALIFICATION_MANIFEST: architect/evaluation/growth_strategy_experiment_portfolio/sealed/heldout-v0.1-2026-08-23-r2.qualification.json
      CYCLE_ID: growth-strategy-experiment-portfolio-v0.1-heldout-2026-08-23-r2
      CANDIDATE_COMMIT: 1c042d09695dfe2d4186c21d136474dc9d1fbdd9
      CANDIDATE_DIGEST: sha256:59dd74cb772f1259a7ed5f6b9da4aa40db7f48be21c380b605bdc044f4dd7b92
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic qualification dependencies
        run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Pre-run budget gate
        run: |
          echo 'objective=FULL held-out qualification for frozen Growth Strategy & Experiment Portfolio v0.1'
          echo 'candidate=1c042d09695dfe2d4186c21d136474dc9d1fbdd9'
          echo 'providers=Gemini candidate+judge; Groq/Qwen independent reviewer+judge'
          echo 'OpenAI=not used'
          echo 'new heldout authoring occurs only if r2 manifest is absent'
          echo 'professional failure retries=0'
          echo 'quota state=unknown; fail closed on auth/quota/rate failure'
      - name: Zero-API frozen candidate and evaluator preflight
        run: |
          set -euo pipefail
          python -m py_compile architect/evaluation/growth_strategy_experiment_portfolio/executor_v0_1_gemini.py
          python -m py_compile architect/evaluation/growth_strategy_experiment_portfolio/sealed_runner_template_v0_1_r2.py
          python -m py_compile architect/evaluation/growth_strategy_experiment_portfolio/author_sealed_pack_v0_1_r2.py
          git cat-file -e "$CANDIDATE_COMMIT^{commit}"
          test "$(git rev-parse "$CANDIDATE_COMMIT:architect/research/growth-strategy-experiment-portfolio/candidate-professional-model-v0.1.md")" = "b22bac7a4deed11c466c014f41960f5e2deec2d1"
          python architect/evaluation/growth_strategy_experiment_portfolio/executor_v0_1_gemini.py --qualification-contract > "$RUNNER_TEMP/strategist-contract.json"
          CONTRACT="$RUNNER_TEMP/strategist-contract.json" python - <<'PY'
          import json,os
          p=json.load(open(os.environ['CONTRACT']))
          assert p['candidate_commit']==os.environ['CANDIDATE_COMMIT']
          assert p['candidate_digest']==os.environ['CANDIDATE_DIGEST']
          assert p['provider']=='gemini-interactions-api'
          assert p['tool_protocol']=='none-v1' and p['state_protocol']=='stateless-v1'
          PY
      - name: Credential preflight
        run: |
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || { echo 'CREDENTIAL_MISSING: QUALIFICATION_SEALED_PACK_MASTER_KEY'; exit 21; }
          test -n "$GEMINI_API_KEY" || { echo 'CREDENTIAL_MISSING: GEMINI_API_KEY'; exit 22; }
          test -n "$GROQ_API_KEY" || { echo 'CREDENTIAL_MISSING: GROQ_API_KEY'; exit 23; }
      - name: Author-review-seal fresh r2 pack only if absent
        run: |
          set -euo pipefail
          if [ ! -f "$QUALIFICATION_MANIFEST" ]; then
            python architect/evaluation/growth_strategy_experiment_portfolio/author_sealed_pack_v0_1_r2.py
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add architect/evaluation/growth_strategy_experiment_portfolio/sealed/heldout-v0.1-2026-08-23-r2.parts "$QUALIFICATION_MANIFEST"
            git commit -m 'eval: freeze encrypted Strategist v0.1 r2 heldout pack'
            git push origin HEAD:main
          else
            echo 'REUSE_FROZEN_R2_PACK'
          fi
      - name: Generic static qualification preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase static --require-runtime-secret
      - name: Generic sealed qualification preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/strategist-r2-sealed-pack"
      - name: Exact-runtime one-call unscored canary
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase canary --require-runtime-secret
      - name: Run scored frozen heldout qualification
        id: scored
        shell: bash
        run: |
          set +e
          python "$RUNNER_TEMP/strategist-r2-sealed-pack/runner.py" \
            --pack-dir "$RUNNER_TEMP/strategist-r2-sealed-pack" \
            --executor-cmd "python3 architect/evaluation/growth_strategy_experiment_portfolio/executor_v0_1_gemini.py" \
            --model "$STRATEGIST_MODEL" \
            --out "$RUNNER_TEMP/strategist-r2-report.json"
          code=$?
          echo "qualification_exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Validate sanitized report and write release ledger
        if: always()
        id: validate
        shell: bash
        run: |
          PACK_DIGEST=$(python -c 'import json,os; print(json.load(open(os.environ["QUALIFICATION_MANIFEST"]))["sealed_pack"]["pack_digest"])')
          python architect/evaluation/qualification-platform/validate_sanitized_report.py \
            --report "$RUNNER_TEMP/strategist-r2-report.json" \
            --cycle-id "$CYCLE_ID" \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --candidate-digest "$CANDIDATE_DIGEST" \
            --pack-digest "$PACK_DIGEST" \
            --model "$STRATEGIST_MODEL" \
            --runner-exit-code "${qualification_exit_code:-255}" \
            --ledger-out "$RUNNER_TEMP/strategist-r2-release-evidence.json"
      - name: Publish sanitized qualification evidence
        if: always() && steps.validate.outcome == 'success'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: strategist-v0.1-r2-gemini-groq-evidence
          path: |
            ${{ runner.temp }}/strategist-r2-report.json
            ${{ runner.temp }}/strategist-r2-release-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Persist sanitized verdict
        if: always() && steps.validate.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p docs/qualification-results
          cp "$RUNNER_TEMP/strategist-r2-report.json" docs/qualification-results/strategist-v0.1-r2-report.json
          cp "$RUNNER_TEMP/strategist-r2-release-evidence.json" docs/qualification-results/strategist-v0.1-r2-release-evidence.json
          git pull --rebase origin main
          git add docs/qualification-results/strategist-v0.1-r2-report.json docs/qualification-results/strategist-v0.1-r2-release-evidence.json
          git commit -m 'eval: record Strategist v0.1 r2 qualification verdict' || true
          git push origin HEAD:main
      - name: Enforce qualification verdict fail-closed
        if: always()
        run: |
          test "${qualification_exit_code:-missing}" = "0"
          test "${{ steps.validate.outcome }}" = "success"
          test "${{ steps.upload.outcome }}" = "success"
