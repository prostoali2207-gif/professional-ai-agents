name: Agent Architect Research + RCE Semantic Smoke

on:
  pull_request:
    branches:
      - candidate/architect-rce-v1.2

permissions:
  contents: read

jobs:
  research-rce-semantic-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deterministic preflight
        run: |
          python -m py_compile architect/evaluation/research_evidence_engineering/research_policy.py
          python -m py_compile architect/evaluation/research_evidence_engineering/run_semantic_smoke.py
          python -m py_compile architect/evaluation/harness/adapters/openai_responses_adapter_v2.py
          python -m pip install --disable-pip-version-check -q pytest
          cd architect/evaluation/research_evidence_engineering
          pytest -q test_research_policy.py test_semantic_cases.py
          cd ../resource_cost_engineering
          python -m unittest -v test_rce.py test_semantic_cases.py

      - name: Require existing BYOK credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || (echo 'OPENAI_API_KEY is not configured; semantic model calls were not attempted.' >&2; exit 2)

      - name: Install OpenAI runtime
        run: python -m pip install --disable-pip-version-check -q openai

      - name: Run exactly two frozen cross-layer cases
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_ARCHITECT_MODEL: gpt-5.4-mini
        run: |
          rm -rf .tmp/research-rce-semantic-smoke
          python architect/evaluation/research_evidence_engineering/run_semantic_smoke.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-rce-semantic-smoke-${{ github.event.pull_request.head.sha }}
          path: .tmp/research-rce-semantic-smoke
          if-no-files-found: ignore
