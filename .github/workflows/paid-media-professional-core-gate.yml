name: Paid Media Professional Core Gate

on:
  push:
    branches:
      - agent/paid-media-performance-marketing-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deterministic preflight
        run: |
          python -m py_compile architect/evaluation/paid_media_performance_marketing/run_semantic_gate.py
          cd architect/evaluation/paid_media_performance_marketing
          python -m unittest -v test_contract.py

      - name: Require existing Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo 'GEMINI_API_KEY is not configured; semantic calls were not attempted.' >&2; exit 2)

      - name: Reliability-sensitive critical trials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAID_MEDIA_MODEL: gemini-2.5-flash-lite
          GEMINI_THINKING_LEVEL: medium
          PM_CASE_IDS: PM-S1,PM-S2,PM-S3,PM-S11,PM-S13
          PM_TRIALS: '3'
        run: |
          rm -rf .tmp/paid-media-performance-marketing
          python architect/evaluation/paid_media_performance_marketing/run_semantic_gate.py
          cp .tmp/paid-media-performance-marketing/summary.json /tmp/paid-media-critical-summary.json

      - name: Complete frozen release suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAID_MEDIA_MODEL: gemini-2.5-flash-lite
          GEMINI_THINKING_LEVEL: medium
          PM_TRIALS: '1'
        run: |
          rm -rf .tmp/paid-media-performance-marketing
          python architect/evaluation/paid_media_performance_marketing/run_semantic_gate.py
          cp /tmp/paid-media-critical-summary.json .tmp/paid-media-performance-marketing/critical-reliability-summary.json

      - name: Upload sealed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paid-media-professional-core-${{ github.sha }}
          path: .tmp/paid-media-performance-marketing
          if-no-files-found: ignore
