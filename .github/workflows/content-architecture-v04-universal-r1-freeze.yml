name: Content Architecture v0.4 universal r1 freeze

on:
  push:
    branches:
      - eval/content-architecture-v04-universal-release-r1
    paths:
      - 'architect/evaluation/content-architecture-v04-universal-r1/FREEZE-UNIVERSAL-R1-v0.1'

permissions:
  contents: read

jobs:
  prepare-wheelhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned Windows evaluator dependency
        shell: bash
        run: |
          mkdir -p wheelhouse
          python -m pip download --disable-pip-version-check --no-input --only-binary=:all: --platform win_amd64 --python-version 312 --implementation cp --abi cp312 --dest wheelhouse cryptography==44.0.2
      - uses: actions/upload-artifact@v4
        with:
          name: content-architecture-v04-universal-r1-freeze-wheelhouse
          path: wheelhouse/
          retention-days: 1

  freeze:
    needs: prepare-wheelhouse
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    env:
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      FROZEN_ARTIFACT_CODEX_MODEL: gpt-5.6-sol
      FROZEN_ARTIFACT_CODEX_REASONING: medium
      FROZEN_ARTIFACT_CODEX_TIMEOUT: '300'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: content-architecture-v04-universal-r1-freeze-wheelhouse
          path: ${{ runner.temp }}/ca-v04-universal-r1-wheelhouse
      - name: Install evaluator dependency offline
        shell: powershell
        run: python -m pip install --disable-pip-version-check --no-input --no-index --find-links "$env:RUNNER_TEMP\ca-v04-universal-r1-wheelhouse" cryptography==44.0.2
      - name: Resolve Codex CLI from interactive user installation
        shell: powershell
        run: |
          $resolved = $null
          $cmd = Get-Command codex -ErrorAction SilentlyContinue
          if ($cmd) { $resolved = $cmd.Source }
          if (-not $resolved) {
            $candidates = @(
              (Join-Path $env:APPDATA 'npm\codex.cmd'),
              (Join-Path $env:APPDATA 'npm\codex.exe'),
              (Join-Path $env:LOCALAPPDATA 'npm\codex.cmd'),
              (Join-Path $env:LOCALAPPDATA 'npm\codex.exe'),
              (Join-Path $env:USERPROFILE '.local\bin\codex.exe'),
              (Join-Path $env:USERPROFILE 'scoop\shims\codex.exe'),
              (Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\codex.exe')
            )
            foreach ($candidate in $candidates) { if (Test-Path $candidate) { $resolved = $candidate; break } }
          }
          if (-not $resolved) {
            $npm = Get-Command npm -ErrorAction SilentlyContinue
            if ($npm) {
              $prefix = (& npm config get prefix 2>$null | Out-String).Trim()
              if ($prefix) {
                foreach ($name in @('codex.cmd','codex.exe')) {
                  $candidate = Join-Path $prefix $name
                  if (Test-Path $candidate) { $resolved = $candidate; break }
                }
              }
            }
          }
          if (-not $resolved) {
            $roots = @(
              (Join-Path $env:LOCALAPPDATA 'OpenAI\Codex\bin'),
              (Join-Path $env:LOCALAPPDATA 'Programs'),
              (Join-Path $env:USERPROFILE '.vscode\extensions'),
              (Join-Path $env:USERPROFILE '.cursor\extensions')
            )
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              $found = Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -in @('codex.exe','codex.cmd') } |
                Select-Object -First 1
              if ($found) { $resolved = $found.FullName; break }
            }
          }
          if (-not $resolved) { Write-Error 'Codex CLI not found'; exit 40 }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $resolved)
          Write-Host 'codex_cli_resolved=true'
      - name: Verify preregistered identities and exact runtime
        shell: powershell
        run: |
          if (-not $env:QUALIFICATION_SEALED_PACK_MASTER_KEY) { exit 31 }
          git fetch origin agent/content-architecture-core-2026-08 main
          if ((git cat-file -t 5d440e1bf3e20fbd35c6ab276310a904e36cc06d) -ne 'blob') { exit 32 }
          $checks = @(
            @('architect/evaluation/content-architecture-v04-universal-r1/author_pack_r1.py','91920346987354e38e2022b5fcb9caf0b0fcb4f1'),
            @('architect/evaluation/content-architecture-v04-universal-r1/run_universal_r1.py','48c71f1d88bfcad848538496481a0445f78d8e66'),
            @('architect/evaluation/content-architecture-v04-universal-r1/test_universal_r1.py','fde1a0e14dd2e196b64d79ac27f523eed233391a'),
            @('architect/evaluation/content-architecture-v04-universal-r1/judge-senior-practitioner.md','99bf30695e502b154d76f1d27b80ebc01ea5b4fd'),
            @('architect/evaluation/content-architecture-v04-universal-r1/judge-assessor.md','e726fdf8534ced97ea8c4fd4060f5eeb058d6f75'),
            @('architect/evaluation/content-architecture-v04-universal-r1/preregistration-r1.json','a50fc6f882efa622c098e1df7aed434a0cbeed59'),
            @('architect/evaluation/harness/adapters/codex_frozen_artifact_adapter.py','d1ef178b739a638a883c5a1d0efe5e431bd3b34d'),
            @('architect/evaluation/harness/adapters/codex_frozen_artifact_mcp.py','73e9349391d4aa83dd459ed23e4069a3cf9a2072')
          )
          foreach ($item in $checks) {
            $actual = (git hash-object $item[0]).Trim()
            if ($actual -ne $item[1]) { Write-Error "Preregistered blob mismatch: $($item[0])"; exit 33 }
          }
          @'
          import json, pathlib, subprocess
          p=json.loads(pathlib.Path('architect/evaluation/content-architecture-v04-universal-r1/preregistration-r1.json').read_text())
          assert p['status']=='PREREGISTERED_PRE_FREEZE'
          assert p['candidate_blob_sha']=='5d440e1bf3e20fbd35c6ab276310a904e36cc06d'
          auth=subprocess.run(['codex','login','status'],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=15)
          if auth.returncode != 0 or 'Logged in using ChatGPT' not in ((auth.stdout or '')+(auth.stderr or '')): raise SystemExit(41)
          ver=subprocess.run(['codex','--version'],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=15)
          version=((ver.stdout or '')+(ver.stderr or '')).strip()
          print('codex_version='+version)
          if ver.returncode != 0 or version != 'codex-cli 0.151.0-alpha.7.2': raise SystemExit(42)
          print('universal r1 identity/runtime binding: PASS')
          '@ | python -
      - name: Run deterministic evaluator tests
        shell: powershell
        run: |
          python -m py_compile architect/evaluation/content-architecture-v04-universal-r1/author_pack_r1.py architect/evaluation/content-architecture-v04-universal-r1/run_universal_r1.py architect/evaluation/content-architecture-v04-universal-r1/test_universal_r1.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python architect/evaluation/content-architecture-v04-universal-r1/test_universal_r1.py
      - name: Author fresh universal corpus
        shell: powershell
        run: |
          $pack = Join-Path $env:RUNNER_TEMP 'ca-v04-universal-r1-pack'
          New-Item -ItemType Directory -Force -Path $pack | Out-Null
          python architect/evaluation/content-architecture-v04-universal-r1/author_pack_r1.py --out $pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Calibrate both blind judges before candidate execution
        shell: powershell
        run: |
          $pack = Join-Path $env:RUNNER_TEMP 'ca-v04-universal-r1-pack\sealed-pack.bin'
          $out = Join-Path $env:RUNNER_TEMP 'ca-v04-universal-r1-calibration'
          python architect/evaluation/content-architecture-v04-universal-r1/run_universal_r1.py --mode calibrate --pack $pack --out $out --timeout 300
          exit $LASTEXITCODE
      - name: Build freeze evidence
        shell: powershell
        run: |
          $packDir = Join-Path $env:RUNNER_TEMP 'ca-v04-universal-r1-pack'
          $calDir = Join-Path $env:RUNNER_TEMP 'ca-v04-universal-r1-calibration'
          $out = Join-Path $env:RUNNER_TEMP 'ca-v04-universal-r1-freeze'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item (Join-Path $packDir 'sealed-manifest.json') (Join-Path $out 'sealed-manifest.json')
          Copy-Item (Join-Path $calDir 'calibration-report.json') (Join-Path $out 'calibration-report.json')
          $env:U1_PACK = $packDir
          $env:U1_CAL = $calDir
          $env:U1_OUT = $out
          @'
          import hashlib, json, os, pathlib, subprocess
          pack=pathlib.Path(os.environ['U1_PACK']); cal=pathlib.Path(os.environ['U1_CAL']); out=pathlib.Path(os.environ['U1_OUT'])
          manifest=json.loads((pack/'sealed-manifest.json').read_text())
          report=json.loads((cal/'calibration-report.json').read_text())
          assert manifest['gate_id']=='content-architecture-v0.4-universal-release-2026-09-01-r1'
          assert manifest['candidate_sha']=='5d440e1bf3e20fbd35c6ab276310a904e36cc06d'
          assert manifest['work_sample_count']==6 and manifest['calibration_pair_count']==4
          assert report['status']=='CALIBRATION_PASS' and report['candidate_calls']==0 and report['judge_calls']==8
          ver=subprocess.run(['codex','--version'],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=15)
          freeze={
            'gate_id':manifest['gate_id'],
            'candidate_sha':manifest['candidate_sha'],
            'corpus_identity_sha256':manifest['plain_identity_sha256'],
            'work_sample_count':manifest['work_sample_count'],
            'calibration_pair_count':manifest['calibration_pair_count'],
            'calibration_report_sha256':hashlib.sha256((cal/'calibration-report.json').read_bytes()).hexdigest(),
            'calibration_status':report['status'],
            'calibration_combined_expected_winner_rate':report['combined_expected_winner_rate'],
            'calibration_pair_disagreement_rate':report['pair_disagreement_rate'],
            'provider':'codex-cli-chatgpt-subscription',
            'model':'gpt-5.6-sol','reasoning_effort':'medium',
            'codex_cli_version':((ver.stdout or '')+(ver.stderr or '')).strip(),
            'candidate_calls':0,'judge_calls':8,'provider_api_keys_used':False,
            'r4_targeted_evidence_reused_only_for_unchanged_reliability':True
          }
          (out/'freeze-evidence.json').write_text(json.dumps(freeze,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(freeze,sort_keys=True))
          '@ | python -
      - name: Upload universal r1 freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: content-architecture-v04-universal-r1-freeze-evidence
          path: |
            ${{ runner.temp }}/ca-v04-universal-r1-freeze/sealed-manifest.json
            ${{ runner.temp }}/ca-v04-universal-r1-freeze/calibration-report.json
            ${{ runner.temp }}/ca-v04-universal-r1-freeze/freeze-evidence.json
          retention-days: 30
