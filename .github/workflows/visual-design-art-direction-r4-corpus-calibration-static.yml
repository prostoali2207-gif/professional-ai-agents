name: Visual Design Art Direction exact R4 corpus calibration static
on:
  push:
    branches: [main]
    paths:
      - 'architect/evaluation/visual-design-art-direction/r4-corpus-calibration-preregistration.md'
      - 'architect/evaluation/visual-design-art-direction/calibration/run_r4_corpus_calibration_v0_2.py'
      - '.github/workflows/visual-design-art-direction-r4-corpus-calibration-static.yml'
      - '.github/workflows/visual-design-art-direction-r4-corpus-calibration.yml'
  pull_request:
    paths:
      - 'architect/evaluation/visual-design-art-direction/r4-corpus-calibration-preregistration.md'
      - 'architect/evaluation/visual-design-art-direction/calibration/run_r4_corpus_calibration_v0_2.py'
      - '.github/workflows/visual-design-art-direction-r4-corpus-calibration-static.yml'
      - '.github/workflows/visual-design-art-direction-r4-corpus-calibration.yml'
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ''
      GROQ_API_KEY: ''
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate exact R4 calibration contract without provider credentials
        run: |
          python -m py_compile architect/evaluation/visual-design-art-direction/calibration/run_r4_corpus_calibration_v0_2.py
          python - <<'PY'
          from pathlib import Path
          p=Path('architect/evaluation/visual-design-art-direction/calibration/run_r4_corpus_calibration_v0_2.py').read_text()
          pre=Path('architect/evaluation/visual-design-art-direction/r4-corpus-calibration-preregistration.md').read_text()
          assert "base.SOURCE_RUN_ID = '33306265227'" in p
          assert "base.SOURCE_HEAD_SHA = '147f1581c1ff24c51b71169aaad7770d6d27f3ce'" in p
          assert "base.SOURCE_ARTIFACT_ID = '9730714845'" in p
          assert "base.SOURCE_ARTIFACT_DIGEST = 'sha256:fbe4b03ffc1eede30b3e36dcaa13e7bf96e29c28cf40d722ae2e376355f0e73e'" in p
          assert "EXPECTED_CIPHERTEXT_SHA256 = 'b6147b01b838aa447fcaff711668771d6347a329f97ac21c7c97f9c9d6e85bf6'" in p
          assert "base.CANDIDATE_COMMIT = '0116d20f99fde919fa6e39c700726d16310d010b'" in p
          assert "base.SKILL_BLOB = 'b230a06aeca3cc67d0c275889a65b8b7403b59c0'" in p
          assert "BASE_MODEL_BLOB = 'bbea595e299445cf79f798ed1e86eecd0b53cd50'" in p
          assert "REPAIR_MODEL_BLOB = 'bad4e815a3898dd19c7dfc0a07dd4c1aeeab3d50'" in p
          assert 'base.main()' in p
          assert 'CANDIDATE_EXECUTOR' not in p and 'candidate_response' not in p and 'run_candidate' not in p
          assert 'candidate execution is forbidden during calibration'.lower() in pre.lower()
          assert 'each judge expected-winner rate >= `0.80`' in pre
          assert 'combined expected-winner rate >= `0.90`' in pre
          assert 'pair disagreement <= `0.25`' in pre
          print('R4_CORPUS_CALIBRATION_STATIC_PASS provider_calls=0 candidate_calls=0')
          PY
