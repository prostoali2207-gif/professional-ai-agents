name: Strategist v0.1 sealed qualification

on:
  workflow_dispatch:
    inputs:
      confirm_paid_run:
        description: 'Type RUN_PAID_QUALIFICATION to authorize paid held-out authoring and scoring'
        required: true
        type: string

permissions:
  contents: write

jobs:
  qualify:
    if: ${{ inputs.confirm_paid_run == 'RUN_PAID_QUALIFICATION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      STRATEGIST_MODEL: gemini-3.5-flash-lite
      STRATEGIST_MIN_REQUEST_INTERVAL: '13'
      QUALIFICATION_MANIFEST: architect/evaluation/growth_strategy_experiment_portfolio/sealed/heldout-v0.1-2026-08-22-clean.qualification.json
      CYCLE_ID: growth-strategy-experiment-portfolio-v0.1-heldout-2026-08-22-clean
      CANDIDATE_COMMIT: 1c042d09695dfe2d4186c21d136474dc9d1fbdd9
      CANDIDATE_DIGEST: sha256:59dd74cb772f1259a7ed5f6b9da4aa40db7f48be21c380b605bdc044f4dd7b92
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install qualification dependencies
        run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: No-API frozen candidate and evaluator preflight
        run: |
          set -euo pipefail
          python -m py_compile architect/evaluation/growth_strategy_experiment_portfolio/executor_v0_1_gemini.py
          python -m py_compile architect/evaluation/growth_strategy_experiment_portfolio/sealed_runner_template_v0_1.py
          python -m py_compile architect/evaluation/growth_strategy_experiment_portfolio/author_sealed_pack_v0_1.py
          git cat-file -e "$CANDIDATE_COMMIT^{commit}"
          test "$(git rev-parse "$CANDIDATE_COMMIT:architect/research/growth-strategy-experiment-portfolio/candidate-professional-model-v0.1.md")" = "b22bac7a4deed11c466c014f41960f5e2deec2d1"
          python architect/evaluation/growth_strategy_experiment_portfolio/executor_v0_1_gemini.py --qualification-contract > "$RUNNER_TEMP/strategist-contract.json"
          CONTRACT="$RUNNER_TEMP/strategist-contract.json" python - <<'PY'
          import json, os
          p=json.load(open(os.environ['CONTRACT']))
          assert p['candidate_commit']==os.environ['CANDIDATE_COMMIT']
          assert p['candidate_digest']==os.environ['CANDIDATE_DIGEST']
          assert p['provider']=='gemini-interactions-api'
          assert p['input_protocol']=='growth-strategy-experiment-portfolio-candidate-v1'
          assert p['tool_protocol']=='none-v1' and p['state_protocol']=='stateless-v1'
          print('frozen runtime contract PASS')
          PY
      - name: Require all evaluator-owned secrets before held-out authoring
        run: |
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || { echo 'QUALIFICATION_SEALED_PACK_MASTER_KEY missing; zero held-out model calls attempted.' >&2; exit 21; }
          test -n "$GEMINI_API_KEY" || { echo 'GEMINI_API_KEY missing; zero held-out model calls attempted.' >&2; exit 22; }
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY missing; zero held-out model calls attempted.' >&2; exit 23; }
      - name: Independently author and immediately seal fresh held-out pack
        run: python architect/evaluation/growth_strategy_experiment_portfolio/author_sealed_pack_v0_1.py
      - name: Generic static qualification-platform preflight
        run: |
          python architect/evaluation/qualification-platform/qualification_preflight.py \
            --manifest "$QUALIFICATION_MANIFEST" --phase static --require-runtime-secret
      - name: Generic sealed transport and pack preflight
        run: |
          python architect/evaluation/qualification-platform/qualification_preflight.py \
            --manifest "$QUALIFICATION_MANIFEST" --phase sealed \
            --out-dir "$RUNNER_TEMP/strategist-sealed-pack"
      - name: Persist encrypted pack before scored execution
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add architect/evaluation/growth_strategy_experiment_portfolio/sealed/heldout-v0.1-2026-08-22-clean.parts \
                  architect/evaluation/growth_strategy_experiment_portfolio/sealed/heldout-v0.1-2026-08-22-clean.qualification.json
          git commit -m 'eval: freeze encrypted Strategist v0.1 heldout pack' || true
          git push origin HEAD:main
      - name: Exact-runtime unscored canary
        run: |
          sleep 13
          python architect/evaluation/qualification-platform/qualification_preflight.py \
            --manifest "$QUALIFICATION_MANIFEST" --phase canary --require-runtime-secret
      - name: Run scored frozen held-out qualification
        id: scored
        shell: bash
        run: |
          set +e
          sleep 13
          python "$RUNNER_TEMP/strategist-sealed-pack/runner.py" \
            --pack-dir "$RUNNER_TEMP/strategist-sealed-pack" \
            --executor-cmd "python3 architect/evaluation/growth_strategy_experiment_portfolio/executor_v0_1_gemini.py" \
            --model "$STRATEGIST_MODEL" \
            --out "$RUNNER_TEMP/strategist-v0.1-report.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "qualification_exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Validate sanitized report and write release ledger
        if: always()
        id: validate
        shell: bash
        run: |
          PACK_DIGEST=$(python -c 'import json,os; print(json.load(open(os.environ["QUALIFICATION_MANIFEST"]))["sealed_pack"]["pack_digest"])')
          python architect/evaluation/qualification-platform/validate_sanitized_report.py \
            --report "$RUNNER_TEMP/strategist-v0.1-report.json" \
            --cycle-id "$CYCLE_ID" \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --candidate-digest "$CANDIDATE_DIGEST" \
            --pack-digest "$PACK_DIGEST" \
            --model "$STRATEGIST_MODEL" \
            --runner-exit-code "${qualification_exit_code:-255}" \
            --ledger-out "$RUNNER_TEMP/strategist-v0.1-release-evidence.json"
      - name: Publish sanitized qualification evidence
        if: always() && steps.validate.outcome == 'success'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: strategist-v0.1-sealed-qualification-evidence
          path: |
            ${{ runner.temp }}/strategist-v0.1-report.json
            ${{ runner.temp }}/strategist-v0.1-release-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Persist sanitized verdict
        if: always() && steps.validate.outcome == 'success'
        run: |
          mkdir -p docs/qualification-results
          cp "$RUNNER_TEMP/strategist-v0.1-report.json" docs/qualification-results/strategist-v0.1-sealed-report.json
          cp "$RUNNER_TEMP/strategist-v0.1-release-evidence.json" docs/qualification-results/strategist-v0.1-release-evidence.json
          git pull --rebase origin main
          git add docs/qualification-results/strategist-v0.1-sealed-report.json docs/qualification-results/strategist-v0.1-release-evidence.json
          git commit -m 'eval: record sanitized Strategist v0.1 qualification verdict' || true
          git push origin HEAD:main
      - name: Enforce qualification verdict
        if: always()
        run: |
          test "${qualification_exit_code:-missing}" = "0"
          test "${{ steps.validate.outcome }}" = "success"
          test "${{ steps.upload.outcome }}" = "success"
