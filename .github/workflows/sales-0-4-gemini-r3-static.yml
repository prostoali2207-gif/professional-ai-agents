name: Sales 0.4 r3 static pre-score gate

on:
  pull_request:
    paths:
      - 'architect/evaluation/sales-lead-conversion/qualification-preregistration-v0_4-r3-gemini-groq.json'
      - 'architect/evaluation/sales-lead-conversion/author_sealed_pack_v0_4_r3_gemini_groq.py'
      - 'architect/evaluation/sales-lead-conversion/sealed_runner_provider_wrapper_v0_4_gemini_r3.py'
      - '.github/workflows/sales-0-4-gemini-r3*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile r3 evaluator surface
        run: |
          python -m py_compile \
            architect/evaluation/sales-lead-conversion/author_sealed_pack_v0_4_r3_gemini_groq.py \
            architect/evaluation/sales-lead-conversion/executor_v0_4_gemini_contract_v1.py \
            architect/evaluation/sales-lead-conversion/sealed_runner_provider_wrapper_v0_4_gemini_r3.py \
            architect/evaluation/sales-lead-conversion/gemini_rate_limiter.py \
            architect/evaluation/sales-lead-conversion/reseal_provider_pack.py \
            architect/evaluation/sales-lead-conversion/canary_v0_4_gemini.py
      - name: Verify preregistration frozen semantics
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, subprocess
          from pathlib import Path

          cycle = 'sales-0.4-fresh-independent-2026-08-30-r3-gemini-groq'
          commit = 'd00bb8057ba0eaae24b918e13941fb61b0b8616d'
          digest = 'sha256:ce111538b204c4c694404a4b4ff13010c3909cc6918a9241600c818462fb62f0'
          prereg_path = Path('architect/evaluation/sales-lead-conversion/qualification-preregistration-v0_4-r3-gemini-groq.json')
          p = json.loads(prereg_path.read_text())
          assert p['cycle_id'] == cycle
          assert p['scope']['decision'] == 'FULL'
          assert p['frozen_candidate']['commit'] == commit
          assert p['frozen_candidate']['artifact_digest'] == digest
          assert p['families'] == ['OWN','LIFE','MIX','SEC','FACT','INTENT','OBJ','NEXT','FUP','STATE','ID','OPS']
          assert p['fixture_count'] == 36 and p['per_family'] == 3 and p['critical_repeat_slots'] == 6
          assert p['thresholds']['release_tasks_passed_min'] == 34
          assert p['thresholds']['per_family_tasks_passed_min'] == 2
          assert p['thresholds']['task_pass_score_min'] == 5
          assert p['thresholds']['critical_hard_fails_max'] == 0
          assert p['thresholds']['professional_failure_retry'] == 0
          assert p['fixture_design']['repeated_fixture_slots'] == [
              'OWN-boundary','SEC-injection','FACT-conflict','STATE-supersession','ID-privacy','OPS-operational-verification'
          ]
          route = p['heldout_authoring']
          assert route['author_provider'] == 'gemini-interactions-api'
          assert route['author_model'] == 'gemini-3.5-flash-lite'
          assert route['construct_audit_provider'] == 'groq-openai-compatible-api'
          assert route['construct_audit_model'] == 'openai/gpt-oss-120b'
          assert route['max_author_attempts_per_group'] == 3
          assert route['max_construct_audit_calls_per_group'] == 3
          assert route['family_groups'] == [p['families'][0:4], p['families'][4:8], p['families'][8:12]]
          assert p['runtime_contract']['provider'] == 'gemini-interactions-api'
          assert p['runtime_contract']['candidate_model'] == 'gemini-3.5-flash-lite'
          assert p['runtime_contract']['grader_model'] == 'gemini-3.5-flash-lite'
          assert p['runtime_contract']['minimum_seconds_between_requests'] == 6.0

          base_path = Path('architect/evaluation/sales-lead-conversion/author_sealed_pack_v0_3_r2.py')
          assert subprocess.check_output(['git','hash-object',str(base_path)], text=True).strip() == '929a19ed17993795ad2ba76933964c1a3c8a7663'
          spec = importlib.util.spec_from_file_location('sales_author_base_static', base_path)
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          slots = p['fixture_design']['slot_semantic_contract']
          for family in m.FAMILIES:
              assert list(slots[family]) == m.SLOTS[family]
              assert all(isinstance(v, str) and v.strip() for v in slots[family].values())

          manifest_path = p['frozen_candidate']['manifest_path']
          manifest = json.loads(subprocess.check_output(['git','show',f'{commit}:{manifest_path}'], text=True))
          canonical = ''
          for path in manifest['artifact']['paths']:
              blob = subprocess.check_output(['git','rev-parse',f'{commit}:{path}'], text=True).strip()
              canonical += f'{path}:{blob}\n'
          actual = 'sha256:' + hashlib.sha256(canonical.encode()).hexdigest()
          assert actual == digest == manifest['artifact']['content_digest']
          contract = json.loads(subprocess.check_output(['python','architect/evaluation/sales-lead-conversion/executor_v0_4_gemini_contract_v1.py','--qualification-contract'], text=True))
          assert contract['contract_version'] == 1
          assert contract['candidate_commit'] == commit and contract['candidate_digest'] == digest
          assert contract['provider'] == 'gemini-interactions-api'
          print('SALES_V04_R3_STATIC_FREEZE_PASS')
          PY
      - name: Verify explicit opt-in only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          paid = Path('.github/workflows/sales-0-4-gemini-r3.yml').read_text()
          optin = Path('.github/workflows/sales-0-4-gemini-r3-optin.yml').read_text()
          assert 'workflow_dispatch:' in paid and 'workflow_call:' in paid
          assert 'push:' not in paid and 'pull_request:' not in paid
          assert "github.event.label.name == 'run-sales-0-4-final-qualification-r3'" in optin
          assert 'types: [labeled]' in optin
          print('SALES_V04_R3_EXPLICIT_OPTIN_PASS')
          PY
