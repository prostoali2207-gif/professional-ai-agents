name: Sales 0.3 fresh held-out r10 Gemini paced
on:
  workflow_dispatch:
permissions: {contents: read, actions: read}
env:
  CYCLE_ID: sales-0.3-fresh-independent-2026-08-23-r10-gemini-paced
  CANDIDATE_COMMIT: 5adc0d315f6f63bc92df0a921040954a3541ef89
  CANDIDATE_DIGEST: sha256:a33bae7c2957e415669852d10135902349f20fdc9ae22090bf8d55278e0b15c2
  SALES_MODEL: gemini-3.5-flash-lite
  SALES_GRADER_MODEL: gemini-3.5-flash-lite
  SALES_MODEL_TIMEOUT_SECONDS: '120'
  GEMINI_MIN_INTERVAL_SECONDS: '6.0'
  GEMINI_PACE_FILE: /tmp/sales-r10-gemini-pace
  SOURCE_RUN_ID: '32636585605'
  SOURCE_PACK_DIGEST: sha256:66dc3287a217fe77c4d9b8d266d81951cc10231d0b69bad3a816c857dda4fb0f
  SOURCE_MANIFEST: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.3-r9-gemini/qualification.json
  QUALIFICATION_MANIFEST: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.3-r10-gemini/qualification.json
  QUALIFICATION_PREFLIGHT_SPEC: architect/evaluation/sales-lead-conversion/preflight/sales-0_3-r10-gemini.json
  # Mirrors of the r10 preregistration. These are not new policy: the
  # deterministic preflight fails the cycle if any of them drifts from
  # qualification-preregistration-v0_3-r10-gemini.json.
  QUALIFICATION_FIXTURE_COUNT: '36'
  QUALIFICATION_TASK_PASS_SCORE_MIN: '5'
  QUALIFICATION_RELEASE_TASKS_PASSED_MIN: '34'
  QUALIFICATION_PER_FAMILY_TASKS_PASSED_MIN: '2'
  QUALIFICATION_CRITICAL_HARD_FAILS_MAX: '0'
jobs:
  # Deterministic, zero-provider-call gate. It runs in a job that is never
  # passed a secret, so it completes before any credential is bound and before
  # any paid call is possible.
  preflight:
    uses: ./.github/workflows/qualification-deterministic-preflight-reusable.yml
    with:
      spec_path: architect/evaluation/sales-lead-conversion/preflight/sales-0_3-r10-gemini.json

  qualify:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      SALES_EXECUTOR_CMD: python architect/evaluation/sales-lead-conversion/executor_v0_3_gemini_contract_v1.py
      SANITIZED_REPORT_PATH: sales-r10-gemini-report.json
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      # py_compile, sealed-runner import resolution, the --qualification-contract
      # handshake, preregistration <-> env correspondence, manifest reference
      # existence and pacing configuration are all enforced by the `preflight`
      # job above, before this job's credentials exist. Re-running them here
      # would only duplicate the gate with weaker checks.
      - name: Confirm deterministic preflight gate
        run: echo "deterministic preflight passed for cycle ${{ needs.preflight.outputs.cycle_id }}"
      - name: Require evaluator credentials
        run: |
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || exit 21
          test -n "$GEMINI_API_KEY" || exit 22
      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Download exact unscored r9 pack
        uses: actions/download-artifact@v4
        with:
          name: sales-0.3-r9-gemini-encrypted-heldout-pack
          path: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.3-r9-gemini
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Verify and decrypt source pack
        run: |
          python - <<'PY'
          import json,os
          m=json.load(open(os.environ['SOURCE_MANIFEST']))
          assert m['cycle_id']=='sales-0.3-fresh-independent-2026-08-23-r9-gemini-paced'
          assert m['candidate']['commit']==os.environ['CANDIDATE_COMMIT'] and m['candidate']['digest']==os.environ['CANDIDATE_DIGEST']
          assert m['sealed_pack']['pack_digest']==os.environ['SOURCE_PACK_DIGEST']
          print('SOURCE_R9_BINDING_PASS')
          PY
          python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$SOURCE_MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/sales-r9-source"
      - name: Re-seal unchanged corpus for r10
        run: |
          python architect/evaluation/sales-lead-conversion/reseal_provider_pack.py --source-dir "$RUNNER_TEMP/sales-r9-source" --runner architect/evaluation/sales-lead-conversion/sealed_runner_provider_wrapper_v0_3_gemini_r10.py --out architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.3-r10-gemini --cycle-id "$CYCLE_ID"
          python - <<'PY'
          import json,os
          p=os.environ['QUALIFICATION_MANIFEST']; m=json.load(open(p)); path='architect/evaluation/sales-lead-conversion/executor_v0_3_gemini_contract_v1.py'; m['runtime']['executor_path']=path; m['runtime']['executor_cmd']='python '+path; m['runtime']['contract_probe_argv']=['python',path,'--qualification-contract']; open(p,'w').write(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
      - name: Generic static preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase static --require-runtime-secret
      - name: Generic sealed no-API preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/sales-r10-pack"
      - name: Preserve encrypted pack before scoring
        uses: actions/upload-artifact@v4
        with: {name: sales-0.3-r10-gemini-encrypted-heldout-pack, path: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.3-r10-gemini, if-no-files-found: error, retention-days: 14}
      - name: Exact-runtime paced Gemini canary
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase canary --require-runtime-secret
      - name: Run preregistered full paced qualification
        id: scored
        shell: bash
        run: |
          set +e
          python "$RUNNER_TEMP/sales-r10-pack/runner.py"
          echo "qualification_exit_code=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Resolve pack digest
        if: always()
        run: if test -f "$QUALIFICATION_MANIFEST"; then echo "PACK_DIGEST=$(python -c 'import json,os; print(json.load(open(os.environ["QUALIFICATION_MANIFEST"]))["sealed_pack"]["pack_digest"])')" >> "$GITHUB_ENV"; fi
      - name: Validate sanitized report
        if: always()
        id: validate
        run: python architect/evaluation/qualification-platform/validate_sanitized_report.py --report "$SANITIZED_REPORT_PATH" --cycle-id "$CYCLE_ID" --candidate-commit "$CANDIDATE_COMMIT" --candidate-digest "$CANDIDATE_DIGEST" --pack-digest "$PACK_DIGEST" --model "$SALES_MODEL" --runner-exit-code "${qualification_exit_code:-255}" --ledger-out sales-r10-gemini-release-evidence.json
      - name: Upload sanitized evidence
        if: always() && steps.validate.outcome == 'success'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.3-r10-gemini-sanitized-qualification-evidence
          path: |
            sales-r10-gemini-report.json
            sales-r10-gemini-release-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce verdict
        if: always()
        run: |
          test "${{ steps.validate.outcome }}" = success
          test "${{ steps.upload.outcome }}" = success
          test "${qualification_exit_code:-missing}" = 0
