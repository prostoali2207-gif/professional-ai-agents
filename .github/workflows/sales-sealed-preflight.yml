name: Sales sealed preflight

on:
  push:
    branches:
      - infra/sales-sealed-preflight-2026-08-21
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Verify sealed transport and decrypt
        env:
          SEALED_PACK_KEY: ${{ secrets.SALES_SEALED_PACK_KEY }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          from cryptography.fernet import Fernet, InvalidToken

          parts_dir = pathlib.Path('architect/evaluation/sales-lead-conversion/sealed/fresh-cycle-2026-08-21.parts')
          parts = sorted(parts_dir.glob('[0-9][0-9]'))
          if [p.name for p in parts] != [f'{i:02d}' for i in range(13)]:
              raise SystemExit('sealed ciphertext parts missing or unexpected')
          token = ''.join(p.read_text() for p in parts).encode()
          if len(token) != 18040:
              raise SystemExit(f'sealed ciphertext length mismatch: {len(token)}')
          expected_ciphertext_sha256 = '5a0dc49630cb0c8d75d7f6550b2ac04993121fad93f46cce338c38c1195fef62'
          actual_ciphertext_sha256 = hashlib.sha256(token).hexdigest()
          if actual_ciphertext_sha256 != expected_ciphertext_sha256:
              raise SystemExit(f'sealed ciphertext sha256 mismatch: {actual_ciphertext_sha256}')

          key = os.environ.get('SEALED_PACK_KEY', '').encode().strip()
          if not key:
              raise SystemExit('SALES_SEALED_PACK_KEY missing')
          expected_key_fingerprint = '438070a66cb91c908a6f9b2840fb3978241f0ab67589afae1e9215ea9af15b57'
          if hashlib.sha256(key).hexdigest() != expected_key_fingerprint:
              raise SystemExit('sealed key fingerprint mismatch')

          try:
              raw = Fernet(key).decrypt(token)
          except (ValueError, InvalidToken) as exc:
              raise SystemExit('Fernet authentication/decryption failed') from exc

          expected_zip = '11ae925d27d90e94ed7432ed481ee996b2921bd17c792922e7a2ccf13e2d24ab'
          actual_zip = hashlib.sha256(raw).hexdigest()
          if actual_zip != expected_zip:
              raise SystemExit(f'decrypted ZIP digest mismatch: {actual_zip}')

          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          zpath = tmp / 'sales-sealed.zip'
          out = tmp / 'sales-sealed-pack'
          zpath.write_bytes(raw)
          out.mkdir()
          with zipfile.ZipFile(zpath) as zf:
              zf.extractall(out)

          freeze = json.loads((out / 'freeze-record.json').read_text())
          expected_pack = 'sha256:ae91ccef4bc48905c1970629a6ff8920e12d95db31b4d11b2325c691f0ad68d8'
          if freeze['pack_digest'] != expected_pack:
              raise SystemExit('frozen pack digest mismatch')

          print('PRE-FLIGHT PASS')
          print('ciphertext sha256:', actual_ciphertext_sha256)
          print('decrypted ZIP sha256:', actual_zip)
          print('pack digest:', freeze['pack_digest'])
          PY
