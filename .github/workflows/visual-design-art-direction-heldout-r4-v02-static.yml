name: Visual Design Art Direction v0.2 R4 heldout static
on:
  pull_request:
    paths:
      - 'architect/evaluation/visual-design-art-direction/heldout-v0.2-r4-preregistration.md'
      - 'architect/evaluation/visual-design-art-direction/heldout/author_sealed_heldout_r4_v02.py'
      - '.github/workflows/visual-design-art-direction-heldout-r4-v02-static.yml'
      - '.github/workflows/visual-design-art-direction-heldout-r4-v02-author.yml'
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate preregistered R4 evaluator contract without credentials
        run: |
          python -m py_compile architect/evaluation/visual-design-art-direction/heldout/author_sealed_heldout_r4_v02.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path('architect/evaluation/visual-design-art-direction/heldout/author_sealed_heldout_r4_v02.py').read_text()
          pre=Path('architect/evaluation/visual-design-art-direction/heldout-v0.2-r4-preregistration.md').read_text()
          freeze=json.load(open('architect/evaluation/visual-design-art-direction/candidate-freeze-v0.2.json'))
          assert "CANDIDATE_COMMIT = '0116d20f99fde919fa6e39c700726d16310d010b'" in p
          assert "MAX_ATTEMPTS_PER_FAMILY = 3" in p
          assert "'mime_type': 'application/json'" in p and "'schema': AUTHOR_SCHEMA" in p
          assert "candidate_calls': 0" in p
          assert "historical_r3_reused': False" in p
          assert 'candidate_response' not in p and 'CANDIDATE_EXECUTOR' not in p
          assert 'fresh independent held-out corpus' in pre
          assert 'R3 sealed corpus and hidden cases must not be reused' in pre
          blobs={x['role']:x['git_blob_sha'] for x in freeze['components']}
          assert subprocess.check_output(['git','rev-parse','HEAD:architect/evaluation/visual-design-art-direction/candidate/SKILL.md'],text=True).strip()=='b230a06aeca3cc67d0c275889a65b8b7403b59c0'
          assert subprocess.check_output(['git','rev-parse','HEAD:architect/evaluation/visual-design-art-direction/professional-model-candidate-v0.1.md'],text=True).strip()=='bbea595e299445cf79f798ed1e86eecd0b53cd50'
          assert subprocess.check_output(['git','rev-parse','HEAD:architect/evaluation/visual-design-art-direction/professional-model-p0-repair-v0.2.md'],text=True).strip()=='bad4e815a3898dd19c7dfc0a07dd4c1aeeab3d50'
          print('VISUAL_V02_R4_HELDOUT_STATIC_PASS provider_calls=0 candidate_calls=0')
          PY
