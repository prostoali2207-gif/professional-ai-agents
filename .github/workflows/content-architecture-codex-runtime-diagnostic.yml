name: Content Architecture Codex runtime diagnostic

on:
  push:
    branches:
      - eval/content-architecture-v04-fresh-gate-2026-08
    paths:
      - 'architect/evaluation/content-architecture-v04-codex-r3/RUNTIME-DIAG-CODEX-R3-v0.1'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Codex CLI
        shell: powershell
        run: |
          $resolved = $null
          $cmd = Get-Command codex -ErrorAction SilentlyContinue
          if ($cmd) { $resolved = $cmd.Source }
          if (-not $resolved) {
            $candidates = @(
              (Join-Path $env:APPDATA 'npm\codex.cmd'),
              (Join-Path $env:APPDATA 'npm\codex.exe'),
              (Join-Path $env:LOCALAPPDATA 'npm\codex.cmd'),
              (Join-Path $env:LOCALAPPDATA 'npm\codex.exe'),
              (Join-Path $env:USERPROFILE '.local\bin\codex.exe'),
              (Join-Path $env:USERPROFILE 'scoop\shims\codex.exe'),
              (Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\codex.exe')
            )
            foreach ($candidate in $candidates) {
              if (Test-Path $candidate) { $resolved = $candidate; break }
            }
          }
          if (-not $resolved) {
            $npm = Get-Command npm -ErrorAction SilentlyContinue
            if ($npm) {
              $prefix = (& npm config get prefix 2>$null | Out-String).Trim()
              if ($prefix) {
                foreach ($name in @('codex.cmd','codex.exe')) {
                  $candidate = Join-Path $prefix $name
                  if (Test-Path $candidate) { $resolved = $candidate; break }
                }
              }
            }
          }
          if (-not $resolved) {
            $roots = @(
              (Join-Path $env:LOCALAPPDATA 'OpenAI\Codex\bin'),
              (Join-Path $env:LOCALAPPDATA 'Programs'),
              (Join-Path $env:USERPROFILE '.vscode\extensions'),
              (Join-Path $env:USERPROFILE '.cursor\extensions')
            )
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              $found = Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -in @('codex.exe','codex.cmd') } |
                Select-Object -First 1
              if ($found) { $resolved = $found.FullName; break }
            }
          }
          if (-not $resolved) { Write-Error 'Codex CLI not found'; exit 40 }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $resolved)
          Write-Host 'codex_cli_resolved=true'
          & $resolved --version
          & $resolved login status
      - name: Run one minimal unscored Codex probe
        shell: powershell
        run: |
          @'
          import json, pathlib, subprocess, tempfile
          with tempfile.TemporaryDirectory(prefix='codex-runtime-probe-') as raw:
              root=pathlib.Path(raw)
              cmd=[
                  'codex','exec','--ephemeral','--ignore-user-config','--ignore-rules',
                  '--skip-git-repo-check','--strict-config','--sandbox','workspace-write',
                  '--json','-m','gpt-5.6-sol','-C',str(root),'-',
                  '-c','approval_policy="never"',
                  '-c','model_reasoning_effort="medium"',
                  '-c','features.shell_tool=false',
                  '-c','features.multi_agent=false',
                  '-c','features.memories=false',
                  '-c','features.goals=false',
                  '-c','features.hooks=false',
                  '-c','features.skill_mcp_dependency_install=false',
                  '-c','apps._default.enabled=false',
                  '-c','tools.web_search=false',
                  '-c','sandbox_workspace_write.network_access=false',
              ]
              p=subprocess.run(cmd,input='Return exactly OK.',capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=120)
              events=[]
              for line in (p.stdout or '').splitlines():
                  try:
                      obj=json.loads(line)
                  except Exception:
                      continue
                  if isinstance(obj,dict): events.append(obj)
              errorish=[]
              for e in events:
                  t=str(e.get('type','')).lower()
                  blob=json.dumps(e,ensure_ascii=False,sort_keys=True)
                  if 'error' in t or 'fail' in t or 'limit' in blob.lower() or 'quota' in blob.lower():
                      errorish.append(blob[:1500])
              messages=[]
              for e in events:
                  item=e.get('item') if isinstance(e,dict) else None
                  if e.get('type')=='item.completed' and isinstance(item,dict) and item.get('type')=='agent_message':
                      text=item.get('text')
                      if isinstance(text,str): messages.append(text[:200])
              report={
                  'exit_code':p.returncode,
                  'event_types':[str(e.get('type')) for e in events[-12:]],
                  'error_events':errorish[-4:],
                  'agent_messages':messages[-2:],
                  'stderr_tail':(p.stderr or '')[-1500:],
              }
              print(json.dumps(report,ensure_ascii=False,sort_keys=True))
              if p.returncode != 0: raise SystemExit(1)
          '@ | python -
