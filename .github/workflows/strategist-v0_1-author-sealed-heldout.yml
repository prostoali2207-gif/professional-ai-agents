name: Strategist v0.1 sealed qualification

on:
  push:
    branches: [main]
    paths:
      - 'architect/research/growth-strategy-experiment-portfolio/**'
      - 'architect/evaluation/growth_strategy_experiment_portfolio/**'
      - '.github/workflows/strategist-v0_1-author-sealed-heldout.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      MANIFEST: architect/evaluation/growth_strategy_experiment_portfolio/sealed/heldout-v0.1-2026-08-22.qualification.json
      PACK_DIR: ${{ runner.temp }}/strategist-v0.1-pack
      REPORT: ${{ runner.temp }}/strategist-v0.1-report.json
      LEDGER: ${{ runner.temp }}/strategist-v0.1-release-evidence.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install qualification dependencies
        run: python -m pip install --disable-pip-version-check openai cryptography jsonschema
      - name: Fail closed before held-out authoring
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY missing'; exit 21; }
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || { echo 'QUALIFICATION_SEALED_PACK_MASTER_KEY missing'; exit 22; }
      - name: Author and freeze fresh sealed held-out if absent
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$MANIFEST" ]; then
            python3 architect/evaluation/growth_strategy_experiment_portfolio/author_sealed_pack.py
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add architect/evaluation/growth_strategy_experiment_portfolio/sealed/heldout-v0.1-2026-08-22.parts "$MANIFEST"
            git commit -m 'Eval: freeze fresh Strategist v0.1 held-out pack'
            git push origin HEAD:main
          fi
      - name: Static candidate and runtime preflight
        run: python3 architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$MANIFEST" --phase static --require-runtime-secret
      - name: Sealed held-out preflight
        run: python3 architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$MANIFEST" --phase sealed --out-dir "$PACK_DIR"
      - name: Exact runtime canary
        run: python3 architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$MANIFEST" --phase canary
      - name: Run scored qualification
        shell: bash
        run: |
          set +e
          python3 "$PACK_DIR/runner.py" \
            --pack-dir "$PACK_DIR" \
            --executor-cmd "python3 architect/evaluation/growth_strategy_experiment_portfolio/executor_v0_1_openai.py" \
            --out "$REPORT"
          code=$?
          echo "qualification_exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Validate sanitized report and bind release evidence
        id: validate
        shell: bash
        run: |
          PACK_DIGEST=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sealed_pack"]["pack_digest"])' "$MANIFEST")
          python3 architect/evaluation/qualification-platform/validate_sanitized_report.py \
            --report "$REPORT" \
            --cycle-id "growth-strategy-experiment-portfolio-v0.1-heldout-2026-08-22" \
            --candidate-commit "1543bf774c795e33e3bedfd158491e4969806dfa" \
            --candidate-digest "sha256:721bb51c57a99ad31e7c282e1faedd3e99b48928753bd1cec69dfdfb5f847d0d" \
            --pack-digest "$PACK_DIGEST" \
            --model "gpt-5.4-mini" \
            --runner-exit-code "${qualification_exit_code:-255}" \
            --ledger-out "$LEDGER"
      - name: Publish sanitized qualification evidence
        id: upload
        if: always() && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: strategist-v0.1-sealed-qualification-evidence
          path: |
            ${{ runner.temp }}/strategist-v0.1-report.json
            ${{ runner.temp }}/strategist-v0.1-release-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce qualification verdict
        if: always()
        run: |
          test "${qualification_exit_code:-missing}" = "0"
          test "${{ steps.validate.outcome }}" = "success"
          test "${{ steps.upload.outcome }}" = "success"
