name: Agent Architect RCE Semantic Smoke

on:
  pull_request:
    branches:
      - candidate/architect-rce-v1.2

permissions:
  contents: read

jobs:
  rce-semantic-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen base candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deterministic preflight
        run: |
          python -m py_compile architect/evaluation/resource_cost_engineering/run_semantic_smoke.py
          python -m py_compile architect/evaluation/harness/adapters/openai_responses_adapter_v2.py
          cd architect/evaluation/resource_cost_engineering
          python -m unittest -v test_rce.py test_semantic_cases.py

      - name: Require existing BYOK credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || (echo 'OPENAI_API_KEY is not configured; semantic model calls were not attempted.' >&2; exit 2)

      - name: Install OpenAI runtime
        run: |
          python -m pip install --disable-pip-version-check -q openai

      - name: Run exactly RCE-S1 and RCE-S2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_ARCHITECT_MODEL: gpt-5.4-mini
        run: |
          rm -rf .tmp/rce-semantic-smoke
          python architect/evaluation/resource_cost_engineering/run_semantic_smoke.py

      - name: Upload semantic smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rce-semantic-smoke-${{ github.event.pull_request.base.sha }}
          path: .tmp/rce-semantic-smoke
          if-no-files-found: ignore
