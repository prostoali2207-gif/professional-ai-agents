name: Qualification Reliability research static

on:
  pull_request:
    paths:
      - 'architect/research/qualification-reliability-engineer/**'
      - 'architect/evaluation/qualification-reliability-engineer/**'
      - '.github/workflows/qualification-reliability-research-static.yml'

permissions:
  contents: read

jobs:
  research-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic schema dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Compile research and packaged readiness guards
        run: |
          python -m py_compile architect/research/qualification-reliability-engineer/prototype/validate_readiness_report.py
          python -m py_compile architect/research/qualification-reliability-engineer/prototype/test_validate_readiness_report.py
          python -m py_compile architect/evaluation/qualification-reliability-engineer/candidate/guard/validate_readiness_report.py
          python -m py_compile architect/evaluation/qualification-reliability-engineer/candidate/guard/test_validate_readiness_report.py
      - name: Run research prototype regressions
        run: python architect/research/qualification-reliability-engineer/prototype/test_validate_readiness_report.py
      - name: Run packaged candidate guard regressions
        run: python architect/evaluation/qualification-reliability-engineer/candidate/guard/test_validate_readiness_report.py
      - name: Prove no provider credential is required
        env:
          OPENAI_API_KEY: ''
          GEMINI_API_KEY: ''
          GROQ_API_KEY: ''
        run: |
          python - <<'PY'
          from pathlib import Path
          sources = [
              Path('architect/research/qualification-reliability-engineer/prototype/validate_readiness_report.py'),
              Path('architect/evaluation/qualification-reliability-engineer/candidate/guard/validate_readiness_report.py'),
          ]
          forbidden = ('urllib.request', 'requests.', 'socket.', 'OPENAI_API_KEY', 'GEMINI_API_KEY', 'GROQ_API_KEY')
          for path in sources:
              source = path.read_text()
              for token in forbidden:
                  assert token not in source, (path, token)
          print('QRE_ZERO_PROVIDER_GUARDS_PASS')
          PY
