name: Qualification platform zero-call mutation pilot

on:
  pull_request:
    paths:
      - 'architect/evaluation/qualification-platform/**'
      - '.github/workflows/qualification-platform-mutation-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'architect/evaluation/qualification-platform/**'
      - '.github/workflows/qualification-platform-mutation-pilot.yml'

permissions:
  contents: read

jobs:
  mutation-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check pytest hypothesis cryptography jsonschema
      - name: Run zero-call mutation adequacy pilot
        run: python architect/evaluation/qualification-platform/mutation_adequacy_pilot.py
