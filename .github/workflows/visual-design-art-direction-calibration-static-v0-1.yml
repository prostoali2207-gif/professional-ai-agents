name: Visual Design Art Direction calibration static preflight v0.1
on:
  pull_request:
    branches: [main]
    paths:
      - 'architect/evaluation/visual-design-art-direction/**'
      - '.github/workflows/visual-design-art-direction-calibration-static-v0-1.yml'
      - '.github/workflows/visual-design-art-direction-calibration-v0-1.yml'
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ''
      GROQ_API_KEY: ''
      OPENAI_API_KEY: ''
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install static validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Compile calibration infrastructure
        run: |
          python -m py_compile architect/evaluation/visual-design-art-direction/calibration/author_sealed_calibration_v0_1.py
          python -m py_compile architect/evaluation/visual-design-art-direction/calibration/run_calibration_v0_1.py
      - name: Verify issue 158 paid workflow is manual-only and candidate-free
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=Path('.github/workflows/visual-design-art-direction-calibration-v0-1.yml')
          raw=p.read_text(); data=yaml.safe_load(raw)
          triggers=data.get('on', data.get(True, {}))
          assert 'pull_request' not in triggers and 'push' not in triggers
          assert 'workflow_dispatch' in triggers
          assert 'secrets.GEMINI_API_KEY' in raw and 'secrets.GROQ_API_KEY' in raw
          text='\n'.join(Path(x).read_text() for x in [
            'architect/evaluation/visual-design-art-direction/calibration/author_sealed_calibration_v0_1.py',
            'architect/evaluation/visual-design-art-direction/calibration/run_calibration_v0_1.py'])
          assert 'CANDIDATE_EXECUTOR_CMD' not in text and 'candidate_response' not in text
          print('VISUAL_CALIBRATION_STATIC_PASS')
          PY
      - name: Record unrelated repository guard state without blocking issue 158
        run: |
          echo 'Global paid_workflow_guard currently has a pre-existing unrelated blocker in content-architecture-v04-fresh-qualification.yml; issue 158 uses the scoped invariant check above and does not modify that workflow.'
