name: Content Architecture v0.4 fresh gate freeze

on:
  push:
    branches:
      - eval/content-architecture-v04-fresh-gate-2026-08
    paths:
      - 'architect/evaluation/content-architecture-v04-fresh/**'
      - '.github/workflows/content-architecture-v04-fresh-freeze.yml'

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sealed dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Fail closed on missing evaluator secret
        run: test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || { echo 'sealed master key missing'; exit 31; }
      - name: Compile evaluator code
        run: |
          python -m py_compile architect/evaluation/content-architecture-v04-fresh/author_pack_v01.py
          python -m py_compile architect/evaluation/content-architecture-v04-fresh/grader_v01.py
          python -m py_compile architect/evaluation/content-architecture-v04-fresh/test_grader_v01.py
      - name: Offline calibration and terminal-status regression
        run: python architect/evaluation/content-architecture-v04-fresh/test_grader_v01.py
      - name: Author fresh sealed corpus without provider calls
        run: |
          mkdir -p "$RUNNER_TEMP/ca-v04-fresh"
          python architect/evaluation/content-architecture-v04-fresh/author_pack_v01.py --out "$RUNNER_TEMP/ca-v04-fresh" | tee "$RUNNER_TEMP/ca-v04-fresh/freeze-output.json"
      - name: Record evaluator implementation identities
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('architect/evaluation/content-architecture-v04-fresh')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ca-v04-fresh'
          manifest=json.loads((out/'sealed-manifest.json').read_text())
          def sha(p): return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          record={
            'status':'INFRASTRUCTURE_FREEZE_EVIDENCE_READY',
            'candidate_blob_sha':'5d440e1bf3e20fbd35c6ab276310a904e36cc06d',
            'plain_corpus_identity_sha256':manifest['plain_identity_sha256'],
            'sealed_corpus_sha256':manifest['sealed_sha256'],
            'fixture_count':manifest['fixture_count'],
            'author_sha256':sha(root/'author_pack_v01.py'),
            'grader_sha256':sha(root/'grader_v01.py'),
            'calibration_test_sha256':sha(root/'test_grader_v01.py'),
            'provider_calls':0
          }
          (out/'freeze-evidence.json').write_text(json.dumps(record,indent=2,sort_keys=True)+'\n')
          print(json.dumps(record,sort_keys=True))
          PY
      - name: Upload sealed evaluator evidence
        uses: actions/upload-artifact@v4
        with:
          name: content-architecture-v04-fresh-freeze-evidence
          path: |
            ${{ runner.temp }}/ca-v04-fresh/sealed-pack.bin
            ${{ runner.temp }}/ca-v04-fresh/sealed-manifest.json
            ${{ runner.temp }}/ca-v04-fresh/freeze-evidence.json
          retention-days: 14
