name: Showroom 171 Dealership Context Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministic preflight
        run: |
          python -m py_compile architect/evaluation/showroom_171/run_semantic_gate.py
          cd architect/evaluation/showroom_171
          python -m unittest -v test_contract.py
      - name: Require Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY"
      - name: Critical dealership reliability trials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEALER_MODEL: gemini-3.1-flash-lite
          GEMINI_THINKING_LEVEL: medium
          DEALER_CASE_IDS: D-S1,D-S2,D-S3,D-S5,D-S7,D-S8
          DEALER_TRIALS: '3'
          DEALER_BATCH_SIZE: '6'
        run: |
          rm -rf .tmp/showroom-171
          python architect/evaluation/showroom_171/run_semantic_gate.py
          cp .tmp/showroom-171/summary.json /tmp/dealer-critical-summary.json
      - name: Complete dealership release suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEALER_MODEL: gemini-3.1-flash-lite
          GEMINI_THINKING_LEVEL: medium
          DEALER_TRIALS: '1'
          DEALER_BATCH_SIZE: '5'
        run: |
          rm -rf .tmp/showroom-171
          python architect/evaluation/showroom_171/run_semantic_gate.py
          cp /tmp/dealer-critical-summary.json .tmp/showroom-171/critical-reliability-summary.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showroom-171-${{ github.sha }}
          path: .tmp/showroom-171
          if-no-files-found: ignore
