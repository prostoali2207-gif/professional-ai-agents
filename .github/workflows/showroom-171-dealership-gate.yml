name: Showroom 171 Dealership Context Gate

on:
  push:
    branches:
      - agent/showroom-171-dealership-context
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-affected:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministic preflight
        run: |
          python -m py_compile architect/evaluation/showroom_171/run_semantic_gate.py
          cd architect/evaluation/showroom_171
          python -m unittest -v test_contract.py
      - name: Retain prior critical reliability evidence
        run: |
          echo 'Critical reliability is retained from run 31955503177: 18/18 PASS on SHA a171f7e275d3bb13fbd06f4ed462dcc1ef05421f.'
          echo 'This affected run changes only D-S10 action semantics plus deterministic assertions; dealership professional policy is unchanged.'
      - name: Require Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY"
      - name: Complete affected dealership release suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEALER_MODEL: gemini-3.1-flash-lite
          GEMINI_THINKING_LEVEL: medium
          DEALER_TRIALS: '1'
          DEALER_BATCH_SIZE: '5'
        run: |
          rm -rf .tmp/showroom-171
          python architect/evaluation/showroom_171/run_semantic_gate.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showroom-171-affected-${{ github.sha }}
          path: .tmp/showroom-171
          if-no-files-found: ignore
