name: Sales 0.3 development regression

on:
  push:
    branches:
      - agent/sales-lead-conversion-core-0.3.0-2026-08-22
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Sales 0.3 artifact digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          manifest_path=pathlib.Path('architect/library/cores/sales-lead-conversion/0.3.0/manifest.json')
          manifest=json.loads(manifest_path.read_text())
          canonical=''
          for p in manifest['artifact']['paths']:
              blob=subprocess.check_output(['git','rev-parse',f'HEAD:{p}'],text=True).strip()
              canonical += f'{p}:{blob}\n'
          actual='sha256:'+hashlib.sha256(canonical.encode()).hexdigest()
          assert actual==manifest['artifact']['content_digest'], (actual,manifest['artifact']['content_digest'])
          print('Sales 0.3 artifact digest verified:',actual)
          PY
      - name: Run public adversarial development regression
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SALES_MODEL: gpt-5.6-terra
          SALES_MODEL_TIMEOUT_SECONDS: '180'
        shell: bash
        run: |
          set -o pipefail
          python3 architect/evaluation/sales-lead-conversion/development_regression_v0_3.py | tee sales-0.3-development-regression.json
      - name: Publish development report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.3-development-regression
          path: sales-0.3-development-regression.json
          retention-days: 14
