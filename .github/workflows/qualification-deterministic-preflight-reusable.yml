name: Reusable deterministic qualification preflight

# Deterministic, zero-provider-call gate that must pass BEFORE a calling
# workflow binds evaluator credentials and BEFORE it spends any provider quota.
#
# This workflow deliberately declares no `secrets:` block. A reusable workflow
# receives only the secrets its caller passes, so with none declared it is
# structurally impossible for this job to hold a provider key or the sealed-pack
# master key. It also never touches sealed-pack ciphertext, keys or hidden
# fixtures: the sealed-runner probes stage a copy of repository sources only.

on:
  workflow_call:
    inputs:
      spec_path:
        description: Repository path to the cycle deterministic-preflight spec JSON
        required: true
        type: string
      python_version:
        description: Python version used for the deterministic probes
        required: false
        type: string
        default: '3.11'
    outputs:
      cycle_id:
        description: Cycle identifier the preflight validated
        value: ${{ jobs.deterministic-preflight.outputs.cycle_id }}

permissions:
  contents: read

jobs:
  deterministic-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cycle_id: ${{ steps.report.outputs.cycle_id }}
    env:
      # Belt and braces: nothing downstream can pick a provider key out of the
      # environment even if one were somehow present on the runner.
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install deterministic preflight dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Assert no evaluator credential is bound to this job
        shell: bash
        run: |
          # Scoped to the credentials a qualification cycle actually spends:
          # provider API keys and the sealed-pack master key. Runner-issued
          # tokens are not qualification credentials and are not checked.
          set -euo pipefail
          bad=0
          while IFS='=' read -r name value; do
            case "$name" in
              *_API_KEY|QUALIFICATION_SEALED_PACK_KEY|QUALIFICATION_SEALED_PACK_MASTER_KEY)
                if [ -n "$value" ]; then
                  echo "evaluator credential present in the deterministic preflight job: $name"
                  bad=1
                fi
                ;;
            esac
          done < <(env)
          test "$bad" = 0 || exit 10
      - name: Deterministic preflight
        id: preflight
        shell: bash
        run: |
          set +e
          python architect/evaluation/qualification-platform/deterministic_preflight.py \
            --spec "${{ inputs.spec_path }}" \
            --repo-root . | tee "$RUNNER_TEMP/deterministic-preflight.json"
          code=${PIPESTATUS[0]}
          echo "preflight_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish preflight report
        id: report
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/deterministic-preflight.json"
          code='${{ steps.preflight.outputs.preflight_exit_code }}'
          python - "$report" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          try:
              data = json.loads(open(sys.argv[1]).read().strip().splitlines()[-1])
          except Exception:
              data = {}
          print(f"cycle_id={data.get('cycle_id', '')}")
          print(f"failure_class={data.get('failure_class', '')}")
          PY
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "deterministic preflight exit code: $code" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-preflight-report
          path: ${{ runner.temp }}/deterministic-preflight.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce preflight verdict
        shell: bash
        run: |
          code='${{ steps.preflight.outputs.preflight_exit_code }}'
          # Each failure class has its own exit code; see
          # architect/evaluation/qualification-platform/preflight-failure-codes.md
          if [ "$code" != "0" ]; then
            echo "deterministic preflight failed with class exit code $code"
            exit "$code"
          fi
