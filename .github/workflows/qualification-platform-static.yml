name: Qualification platform static preflight

on:
  push:
    branches:
      - infra/generic-qualification-platform-2026-08-22
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install qualification dependencies
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Compile generic qualification utilities
        run: |
          python3 -m py_compile architect/evaluation/qualification-platform/qualification_preflight.py
          python3 -m py_compile architect/evaluation/qualification-platform/validate_sanitized_report.py
          python3 -m py_compile architect/evaluation/qualification-platform/paid_workflow_guard.py
      - name: Run deterministic preflight regressions
        run: |
          python3 -m unittest architect/evaluation/qualification-platform/test_qualification_preflight.py
          python3 architect/evaluation/qualification-platform/test_paid_workflow_guard.py
      - name: Enforce Resource & Cost Engineering paid-workflow trigger policy
        run: python3 architect/evaluation/qualification-platform/paid_workflow_guard.py
      - name: Validate migrated Sales 0.2 static contract without API
        env:
          OPENAI_API_KEY: ''
        run: |
          python3 architect/evaluation/qualification-platform/qualification_preflight.py \
            --manifest architect/evaluation/sales-lead-conversion/sealed/fresh-cycle-0.2-2026-08-22.qualification.json \
            --phase static
