name: Exa P0 MCP Smoke

on:
  push:
    branches:
      - research/research-architecture-benchmark-2026-08
    paths:
      - '.github/workflows/exa-p0-smoke.yml'
      - 'architect/research/benchmark/exa-p0-smoke.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exa-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MCP client
        run: python -m pip install --disable-pip-version-check 'mcp>=2,<3'
      - name: Run Exa no-key MCP smoke
        run: python architect/research/benchmark/exa-p0-smoke.py
      - name: Upload smoke record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exa-p0-smoke-record
          path: architect/research/benchmark/runs/exa-p0-smoke.json
          if-no-files-found: warn
