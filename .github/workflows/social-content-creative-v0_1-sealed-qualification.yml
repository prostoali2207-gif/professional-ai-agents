name: Social Content Creative v0.1 sealed qualification

on:
  workflow_dispatch:
    inputs:
      confirm_paid_run:
        description: 'Type RUN_PAID_QUALIFICATION to authorize the single preregistered qualification cycle'
        required: true
        type: string

permissions:
  contents: write

jobs:
  qualify:
    if: ${{ inputs.confirm_paid_run == 'RUN_PAID_QUALIFICATION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      SOCIAL_CONTENT_MODEL: gemini-3.5-flash-lite
      SOCIAL_CONTENT_AUTHOR_MODEL: gemini-3.5-flash-lite
      SOCIAL_CONTENT_GROQ_JUDGE_MODEL: qwen/qwen3.6-27b
      SOCIAL_CONTENT_MIN_REQUEST_INTERVAL: '13'
      # Judge request sizing. Transport only: how many held-out cases ride in one
      # request, never what is graded. Groq on_demand caps qwen3.6-27b at 8000 TPM
      # counting input + max_completion_tokens, so 3500+3500 keeps every request inside
      # the ceiling and 62s spacing keeps consecutive requests inside the minute.
      SOCIAL_CONTENT_JUDGE_INPUT_BUDGET: '1800'
      SOCIAL_CONTENT_JUDGE_COMPLETION_BUDGET: '7000'
      SOCIAL_CONTENT_GROQ_TPM_CEILING: '8000'
      SOCIAL_CONTENT_GROQ_JUDGE_PACE: '62'
      CYCLE_ID: social-content-creative-0.1.0-heldout-2026-08-23
      CANDIDATE_COMMIT: 163f68671288fe5035a8d09197334ec9df728b93
      CANDIDATE_DIGEST: sha256:ce5f537d336e6a6396f47c1ae492a687c4dc4b30ade8ab37bb4abb94d6251c0f
      QUALIFICATION_MANIFEST: architect/evaluation/social_content_creative/sealed/heldout-v0.1-2026-08-23.qualification.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: architect/social-content-creative-core-2026-08-23
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic qualification dependencies
        run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Pre-run budget gate
        run: |
          echo 'objective=independent release qualification of frozen Social Content Creative 0.1.0'
          echo 'decision_impact=PASS permits qualified-core promotion; REVISE keeps candidate status'
          echo 'maximum planned Gemini completion calls=27 fixed (1 held-out author + 1 unscored canary + 24 candidate + 1 judge calibration) plus 2 to 24 grouped judge calls'
          echo 'maximum planned Groq/Qwen completion calls=1 judge calibration plus 2 to 24 grouped judge calls'
          echo 'judge grouping is transport only: same fixtures, calibration, rubric, dimensions, flags, scoring, thresholds and release logic'
          echo 'protected rule=no scored calls before static/secrets/sealed checks; no professional-failure retry'
          echo 'stop condition=any preflight failure, missing secret, canary failure, pack integrity failure, or completed two-trial release verdict'
      - name: Frozen candidate and evaluator static preflight
        run: |
          set -euo pipefail
          python -m py_compile architect/evaluation/social_content_creative/executor_v0_1_gemini.py
          python -m py_compile architect/evaluation/social_content_creative/sealed_runner_template_v0_1.py
          python -m py_compile architect/evaluation/social_content_creative/author_sealed_pack_v0_1.py
          git cat-file -e "$CANDIDATE_COMMIT^{commit}"
          python architect/evaluation/social_content_creative/executor_v0_1_gemini.py --qualification-contract > "$RUNNER_TEMP/social-content-contract.json"
          CONTRACT="$RUNNER_TEMP/social-content-contract.json" python - <<'PY'
          import json, os
          p=json.load(open(os.environ['CONTRACT']))
          assert p['candidate_commit']==os.environ['CANDIDATE_COMMIT']
          assert p['candidate_digest']==os.environ['CANDIDATE_DIGEST']
          assert p['provider']=='gemini-interactions-api'
          assert p['input_protocol']=='social-content-creative-candidate-v1'
          assert p['tool_protocol']=='none-v1' and p['state_protocol']=='stateless-v1'
          print('frozen runtime contract PASS')
          PY
      - name: Require evaluator-owned secrets before any provider call
        run: |
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || { echo 'master sealed-pack key missing; zero provider calls attempted' >&2; exit 21; }
          test -n "$GEMINI_API_KEY" || { echo 'Gemini credential missing; zero provider calls attempted' >&2; exit 22; }
          test -n "$GROQ_API_KEY" || { echo 'Groq credential missing; zero provider calls attempted' >&2; exit 23; }
      - name: Verify Groq credential and Qwen judge model access without completion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          target=os.environ['SOCIAL_CONTENT_GROQ_JUDGE_MODEL']
          req=urllib.request.Request(
              'https://api.groq.com/openai/v1/models',
              headers={
                  'Authorization': f"Bearer {os.environ['GROQ_API_KEY']}",
                  'Accept': 'application/json',
                  'User-Agent': 'professional-ai-agents-social-content-preflight/1.0',
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  payload=json.loads(r.read().decode('utf-8'))
          except urllib.error.HTTPError as exc:
              print(f'Groq preflight HTTP {exc.code}: {exc.read().decode("utf-8","replace")[:1000]}', file=sys.stderr)
              raise SystemExit(2)
          ids={m.get('id') for m in payload.get('data',[]) if isinstance(m,dict)}
          if target not in ids:
              raise SystemExit(f'Groq judge model unavailable for this account: {target}')
          print('GROQ CREDENTIAL + QWEN JUDGE MODEL ACCESS PASS')
          PY
      - name: Independently author and immediately seal fresh held-out pack
        run: python architect/evaluation/social_content_creative/author_sealed_pack_v0_1.py
      - name: Generic static qualification-platform preflight
        run: |
          python architect/evaluation/qualification-platform/qualification_preflight.py \
            --manifest "$QUALIFICATION_MANIFEST" --phase static --require-runtime-secret
      - name: Generic sealed transport and pack preflight
        run: |
          python architect/evaluation/qualification-platform/qualification_preflight.py \
            --manifest "$QUALIFICATION_MANIFEST" --phase sealed \
            --out-dir "$RUNNER_TEMP/social-content-sealed-pack"
      - name: Persist encrypted pack before scored execution
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add architect/evaluation/social_content_creative/sealed/heldout-v0.1-2026-08-23.parts \
                  architect/evaluation/social_content_creative/sealed/heldout-v0.1-2026-08-23.qualification.json
          git commit -m 'eval: freeze encrypted Social Content Creative heldout pack' || true
          git push origin HEAD:architect/social-content-creative-core-2026-08-23
      - name: Exact-runtime unscored Gemini candidate canary
        run: |
          sleep 13
          python architect/evaluation/qualification-platform/qualification_preflight.py \
            --manifest "$QUALIFICATION_MANIFEST" --phase canary --require-runtime-secret
      - name: Run scored frozen held-out qualification
        id: scored
        shell: bash
        run: |
          set +e
          sleep 13
          python "$RUNNER_TEMP/social-content-sealed-pack/runner.py" \
            --pack-dir "$RUNNER_TEMP/social-content-sealed-pack" \
            --executor-cmd "python3 architect/evaluation/social_content_creative/executor_v0_1_gemini.py" \
            --model "$SOCIAL_CONTENT_MODEL" \
            --out "$RUNNER_TEMP/social-content-v0.1-report.json"
          code=$?
          echo "qualification_exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Validate sanitized report and write release ledger
        if: always()
        id: validate
        shell: bash
        run: |
          PACK_DIGEST=$(python -c 'import json,os; print(json.load(open(os.environ["QUALIFICATION_MANIFEST"]))["sealed_pack"]["pack_digest"])')
          python architect/evaluation/qualification-platform/validate_sanitized_report.py \
            --report "$RUNNER_TEMP/social-content-v0.1-report.json" \
            --cycle-id "$CYCLE_ID" \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --candidate-digest "$CANDIDATE_DIGEST" \
            --pack-digest "$PACK_DIGEST" \
            --model "$SOCIAL_CONTENT_MODEL" \
            --runner-exit-code "${qualification_exit_code:-255}" \
            --ledger-out "$RUNNER_TEMP/social-content-v0.1-release-evidence.json"
      - name: Publish sanitized qualification evidence
        if: always() && steps.validate.outcome == 'success'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: social-content-creative-v0.1-sealed-qualification-evidence
          path: |
            ${{ runner.temp }}/social-content-v0.1-report.json
            ${{ runner.temp }}/social-content-v0.1-release-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Persist sanitized verdict on candidate branch
        if: always() && steps.validate.outcome == 'success'
        run: |
          mkdir -p docs/qualification-results
          cp "$RUNNER_TEMP/social-content-v0.1-report.json" docs/qualification-results/social-content-creative-v0.1-sealed-report.json
          cp "$RUNNER_TEMP/social-content-v0.1-release-evidence.json" docs/qualification-results/social-content-creative-v0.1-release-evidence.json
          git pull --rebase origin architect/social-content-creative-core-2026-08-23
          git add docs/qualification-results/social-content-creative-v0.1-sealed-report.json docs/qualification-results/social-content-creative-v0.1-release-evidence.json
          git commit -m 'eval: record Social Content Creative v0.1 qualification verdict' || true
          git push origin HEAD:architect/social-content-creative-core-2026-08-23
      - name: Post-run accounting
        if: always()
        run: |
          echo 'planned_max_completion_calls=27..51 gemini + 1..25 groq (judge calls vary with request grouping)'
          echo 'author_provider=gemini'
          echo 'candidate_provider=gemini'
          echo 'judges=gemini+groq/qwen'
          echo "qualification_exit_code=${qualification_exit_code:-not_started}"
          echo 'raw hidden content was not intentionally printed or published'
      - name: Enforce qualification verdict
        if: always()
        run: |
          test "${qualification_exit_code:-missing}" = "0"
          test "${{ steps.validate.outcome }}" = "success"
          test "${{ steps.upload.outcome }}" = "success"
