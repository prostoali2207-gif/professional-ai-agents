name: Conversion Messaging issue-225 sealed prerequisite static

on:
  pull_request:
    paths:
      - 'architect/evaluation/conversion_messaging_web_copy/issue225-*'
      - 'architect/evaluation/conversion_messaging_web_copy/issue225_*'
      - '.github/workflows/conversion-messaging-issue225-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no separately billed API credentials are bound
        shell: bash
        run: |
          for n in OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY GROQ_API_KEY XAI_API_KEY; do
            test -z "${!n:-}" || { echo "unexpected API credential: $n" >&2; exit 2; }
          done
      - name: Compile issue 225 authoring transport
        run: python -m py_compile architect/evaluation/conversion_messaging_web_copy/issue225_codex_author_review_seal_v0_2.py
      - name: Run issue 225 deterministic preregistration gate
        run: python architect/evaluation/conversion_messaging_web_copy/issue225_static_preflight_v0_1.py
      - name: Run authoring runner zero-model preflight
        run: python architect/evaluation/conversion_messaging_web_copy/issue225_codex_author_review_seal_v0_2.py --preflight
      - name: Verify diff hygiene
        run: git diff --check origin/main...HEAD
