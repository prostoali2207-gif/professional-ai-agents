name: Market Intelligence Practical Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - 'architect/research/market-competitive-intelligence/**'
      - 'architect/evaluation/market_competitive_intelligence/**'
      - '.github/workflows/market-intelligence-practical-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deterministic preflight
        run: |
          python -m py_compile architect/evaluation/market_competitive_intelligence/run_practical_gate.py
          test "$(git hash-object architect/research/market-competitive-intelligence/candidate-professional-model-v0.2.md)" = "7af5b93c1a4d499b5972a0dd20aec8e4253a9651"

      - name: Require Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo 'GEMINI_API_KEY missing' >&2; exit 2)

      - name: Run end-to-end practical diagnostic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MI_MODEL: gemini-3.1-flash-lite
          GEMINI_THINKING_LEVEL: medium
          MI_PRACTICAL_TRIALS: '3'
        run: |
          rm -rf .tmp/market-competitive-intelligence-v2
          python architect/evaluation/market_competitive_intelligence/run_practical_gate.py

      - name: Upload practical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-intelligence-practical-${{ github.sha }}
          path: .tmp/market-competitive-intelligence-v2
          if-no-files-found: ignore
