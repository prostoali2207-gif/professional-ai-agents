name: Claim Class Stakes Policy v0.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-class-stakes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run claim-class stakes-aware evidence gate
        run: python architect/research/benchmark/claim-class-stakes-policy-v0.1.py
      - name: Upload audit record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-class-stakes-policy-v0.1-record
          path: architect/research/benchmark/runs/claim-class-stakes-policy-v0.1.json
          if-no-files-found: error
