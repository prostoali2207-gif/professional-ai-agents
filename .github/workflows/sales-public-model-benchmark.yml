name: Sales public model benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        model: [gpt-5.6-luna, gpt-5.6-terra]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SALES_MODEL: ${{ matrix.model }}
      SALES_CANDIDATE_CMD: python3 architect/evaluation/sales-lead-conversion/executor_responses.py
      SALES_CANDIDATE_MANIFEST: /tmp/sales-candidate-manifest.json
      SALES_CANDIDATE_TIMEOUT_SECONDS: '240'
      SALES_MODEL_TIMEOUT_SECONDS: '180'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight frozen identity and executors
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}"
          git cat-file -e b1a5f214a7cc9452e8a168f3292a2e9b613ecae0^{commit}
          python3 -m unittest \
            architect/evaluation/sales-lead-conversion/test_executor.py \
            architect/evaluation/sales-lead-conversion/test_executor_responses.py \
            architect/evaluation/sales-lead-conversion/test_public_model_benchmark.py
          cat > "$SALES_CANDIDATE_MANIFEST" <<'JSON'
          {"commit":"b1a5f214a7cc9452e8a168f3292a2e9b613ecae0","artifact_digest":"sha256:6107413b9d6699f249d15903918f0943d26348f206d9e898d37b7058dac6dfa6"}
          JSON
      - name: Run five public professional cases
        shell: bash
        run: |
          set -o pipefail
          python3 architect/evaluation/sales-lead-conversion/public_model_benchmark.py | tee "$RUNNER_TEMP/public-model-benchmark.json"
      - name: Upload public benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-public-benchmark-${{ matrix.model }}
          path: ${{ runner.temp }}/public-model-benchmark.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish sanitized machine-readable summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_ISSUE: '43'
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/public-model-benchmark.json"
          SUMMARY="$RUNNER_TEMP/public-model-benchmark-summary.md"
          python3 - "$RESULT" "$SUMMARY" <<'PY'
          import json, os, pathlib, sys

          result_path = pathlib.Path(sys.argv[1])
          summary_path = pathlib.Path(sys.argv[2])
          model = os.environ.get("SALES_MODEL")
          payload = {}
          if result_path.exists() and result_path.stat().st_size:
              try:
                  payload = json.loads(result_path.read_text(encoding="utf-8"))
              except Exception:
                  payload = {}

          cases = []
          for row in payload.get("cases", []) if isinstance(payload, dict) else []:
              if not isinstance(row, dict):
                  continue
              cases.append({
                  "case": row.get("case"),
                  "pass": bool(row.get("pass")),
                  "status": row.get("status", "unknown"),
              })

          usage_raw = payload.get("usage", {}) if isinstance(payload, dict) else {}
          usage = {
              key: int(usage_raw.get(key, 0) or 0)
              for key in ("api_calls", "input_tokens", "cached_input_tokens", "output_tokens", "total_tokens")
          }
          sanitized = {
              "schema": "public-eval-summary-v1",
              "benchmark": "sales-public-model-benchmark",
              "public_unscored": True,
              "run_id": os.environ.get("RUN_ID"),
              "run_attempt": os.environ.get("RUN_ATTEMPT"),
              "commit": os.environ.get("RUN_SHA"),
              "model": model,
              "passed": int(payload.get("passed", 0) or 0) if isinstance(payload, dict) else 0,
              "attempted": int(payload.get("attempted", len(cases)) or 0) if isinstance(payload, dict) else len(cases),
              "planned_total": int(payload.get("planned_total", 5) or 5) if isinstance(payload, dict) else 5,
              "cases": cases,
              "usage": usage,
          }
          text = "### Public benchmark summary\n\n```json\n" + json.dumps(sanitized, ensure_ascii=False, indent=2) + "\n```\n"
          summary_path.write_text(text, encoding="utf-8")
          PY
          gh issue comment "$SUMMARY_ISSUE" --repo "$REPOSITORY" --body-file "$SUMMARY"
