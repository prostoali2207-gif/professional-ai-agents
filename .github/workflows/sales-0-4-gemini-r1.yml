name: Sales 0.4 fresh held-out r1 Gemini paced

on:
  workflow_dispatch:
    inputs:
      confirm_provider_run:
        description: 'Type RUN to execute the preregistered FULL qualification'
        required: true
        default: 'NO'
  workflow_call:
    inputs:
      confirm_provider_run:
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
      GEMINI_API_KEY:
        required: true
      QUALIFICATION_SEALED_PACK_MASTER_KEY:
        required: true

permissions:
  contents: read

env:
  CYCLE_ID: sales-0.4-fresh-independent-2026-08-29-r1-gemini-paced
  CANDIDATE_COMMIT: d00bb8057ba0eaae24b918e13941fb61b0b8616d
  CANDIDATE_DIGEST: sha256:ce111538b204c4c694404a4b4ff13010c3909cc6918a9241600c818462fb62f0
  SALES_MODEL: gemini-3.5-flash-lite
  SALES_GRADER_MODEL: gemini-3.5-flash-lite
  SALES_MODEL_TIMEOUT_SECONDS: '120'
  GEMINI_MIN_INTERVAL_SECONDS: '6.0'
  GEMINI_PACE_FILE: /tmp/sales-v04-r1-gemini-pace
  SOURCE_MANIFEST: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.4-r1-author/qualification.json
  QUALIFICATION_MANIFEST: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.4-r1-gemini/qualification.json
  PREREGISTRATION: architect/evaluation/sales-lead-conversion/qualification-preregistration-v0_4-r1-gemini.json
  QUALIFICATION_FIXTURE_COUNT: '36'
  QUALIFICATION_RELEASE_TASKS_PASSED_MIN: '34'
  QUALIFICATION_PER_FAMILY_TASKS_PASSED_MIN: '2'
  QUALIFICATION_TASK_PASS_SCORE_MIN: '5'
  QUALIFICATION_CRITICAL_HARD_FAILS_MAX: '0'

jobs:
  qualify:
    if: ${{ inputs.confirm_provider_run == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      SALES_EXECUTOR_CMD: python architect/evaluation/sales-lead-conversion/executor_v0_4_gemini_contract_v1.py
      SANITIZED_REPORT_PATH: sales-v04-r1-gemini-report.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Deterministic preregistration and frozen candidate checks
        shell: bash
        run: |
          python -m py_compile \
            architect/evaluation/sales-lead-conversion/author_sealed_pack_v0_4_r1.py \
            architect/evaluation/sales-lead-conversion/executor_v0_4_gemini_contract_v1.py \
            architect/evaluation/sales-lead-conversion/sealed_runner_provider_wrapper_v0_4_gemini_r1.py \
            architect/evaluation/sales-lead-conversion/gemini_rate_limiter.py \
            architect/evaluation/sales-lead-conversion/reseal_provider_pack.py \
            architect/evaluation/sales-lead-conversion/canary_v0_4_gemini.py
          python - <<'PY'
          import hashlib, json, os, subprocess
          p = json.load(open(os.environ['PREREGISTRATION']))
          assert p['cycle_id'] == os.environ['CYCLE_ID']
          assert p['scope']['decision'] == 'FULL'
          assert p['frozen_candidate']['commit'] == os.environ['CANDIDATE_COMMIT']
          assert p['frozen_candidate']['artifact_digest'] == os.environ['CANDIDATE_DIGEST']
          assert p['fixture_count'] == 36 and p['per_family'] == 3 and len(p['families']) == 12
          assert p['thresholds']['release_tasks_passed_min'] == 34
          assert p['thresholds']['per_family_tasks_passed_min'] == 2
          assert p['thresholds']['task_pass_score_min'] == 5
          assert p['thresholds']['critical_hard_fails_max'] == 0
          assert p['thresholds']['professional_failure_retry'] == 0
          assert p['runtime_contract']['provider'] == 'gemini-interactions-api'
          assert p['runtime_contract']['candidate_model'] == 'gemini-3.5-flash-lite'
          assert p['runtime_contract']['grader_model'] == 'gemini-3.5-flash-lite'
          assert p['runtime_contract']['minimum_seconds_between_requests'] == 6.0
          commit = os.environ['CANDIDATE_COMMIT']
          manifest_path = p['frozen_candidate']['manifest_path']
          m = json.loads(subprocess.check_output(['git','show',f'{commit}:{manifest_path}'], text=True))
          canonical = ''
          for path in m['artifact']['paths']:
              blob = subprocess.check_output(['git','rev-parse',f'{commit}:{path}'], text=True).strip()
              canonical += f'{path}:{blob}\n'
          actual = 'sha256:' + hashlib.sha256(canonical.encode()).hexdigest()
          assert actual == os.environ['CANDIDATE_DIGEST'] == m['artifact']['content_digest']
          c = json.loads(subprocess.check_output(['python','architect/evaluation/sales-lead-conversion/executor_v0_4_gemini_contract_v1.py','--qualification-contract'], text=True))
          assert c['contract_version'] == 1
          assert c['candidate_commit'] == commit and c['candidate_digest'] == actual
          assert c['provider'] == 'gemini-interactions-api'
          print('SALES_V04_R1_STATIC_FREEZE_PASS')
          PY
      - name: Require evaluator credentials before authoring
        shell: bash
        run: |
          test -n "$QUALIFICATION_SEALED_PACK_MASTER_KEY" || exit 21
          test -n "$OPENAI_API_KEY" || exit 22
          test -n "$GEMINI_API_KEY" || exit 23
      - name: Install deterministic qualification dependencies
        run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Author and immediately seal fresh held-out corpus
        shell: bash
        run: python architect/evaluation/sales-lead-conversion/author_sealed_pack_v0_4_r1.py | tee sales-v04-r1-author-safe-freeze.json
      - name: Verify freshly authored sealed corpus without model calls
        shell: bash
        run: |
          python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$SOURCE_MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/sales-v04-r1-source"
          echo "SOURCE_PACK_DIGEST=$(python -c 'import json,os; print(json.load(open(os.environ["SOURCE_MANIFEST"]))["sealed_pack"]["pack_digest"])')" >> "$GITHUB_ENV"
      - name: Re-seal unchanged fresh corpus with frozen Gemini runner
        shell: bash
        run: |
          python architect/evaluation/sales-lead-conversion/reseal_provider_pack.py \
            --source-dir "$RUNNER_TEMP/sales-v04-r1-source" \
            --runner architect/evaluation/sales-lead-conversion/sealed_runner_provider_wrapper_v0_4_gemini_r1.py \
            --out architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.4-r1-gemini \
            --cycle-id "$CYCLE_ID"
          python - <<'PY'
          import json, os
          p = os.environ['QUALIFICATION_MANIFEST']
          m = json.load(open(p))
          m['candidate']['manifest_path'] = 'architect/library/cores/sales-lead-conversion/0.4.0/manifest.json'
          path = 'architect/evaluation/sales-lead-conversion/executor_v0_4_gemini_contract_v1.py'
          m['runtime']['executor_path'] = path
          m['runtime']['executor_cmd'] = 'python ' + path
          m['runtime']['contract_probe_argv'] = ['python', path, '--qualification-contract']
          m['runtime']['canary_cmd'] = 'python architect/evaluation/sales-lead-conversion/canary_v0_4_gemini.py'
          open(p, 'w').write(json.dumps(m, indent=2, sort_keys=True) + '\n')
          PY
      - name: Generic static preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase static --require-runtime-secret
      - name: Generic sealed no-API preflight
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase sealed --out-dir "$RUNNER_TEMP/sales-v04-r1-pack"
      - name: Preserve encrypted fresh pack before scoring
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.4-r1-gemini-encrypted-heldout-pack
          path: architect/evaluation/sales-lead-conversion/sealed/runtime-sales-0.4-r1-gemini
          if-no-files-found: error
          retention-days: 14
      - name: Exact-runtime paced Gemini canary
        run: python architect/evaluation/qualification-platform/qualification_preflight.py --manifest "$QUALIFICATION_MANIFEST" --phase canary --require-runtime-secret
      - name: Run preregistered FULL paced qualification
        id: scored
        shell: bash
        run: |
          set +e
          python "$RUNNER_TEMP/sales-v04-r1-pack/runner.py"
          echo "qualification_exit_code=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Resolve final pack digest
        if: always()
        run: if test -f "$QUALIFICATION_MANIFEST"; then echo "PACK_DIGEST=$(python -c 'import json,os; print(json.load(open(os.environ["QUALIFICATION_MANIFEST"]))["sealed_pack"]["pack_digest"])')" >> "$GITHUB_ENV"; fi
      - name: Validate sanitized report
        if: always()
        id: validate
        run: python architect/evaluation/qualification-platform/validate_sanitized_report.py --report "$SANITIZED_REPORT_PATH" --preregistration "$PREREGISTRATION" --cycle-id "$CYCLE_ID" --candidate-commit "$CANDIDATE_COMMIT" --candidate-digest "$CANDIDATE_DIGEST" --pack-digest "$PACK_DIGEST" --model "$SALES_MODEL" --runner-exit-code "${qualification_exit_code:-255}" --ledger-out sales-v04-r1-gemini-release-evidence.json
      - name: Upload sanitized qualification evidence
        if: always() && steps.validate.outcome == 'success'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.4-r1-gemini-sanitized-qualification-evidence
          path: |
            sales-v04-r1-gemini-report.json
            sales-v04-r1-gemini-release-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce frozen verdict protocol
        if: always()
        shell: bash
        run: |
          test "${{ steps.validate.outcome }}" = success
          test "${{ steps.upload.outcome }}" = success
          case "${qualification_exit_code:-missing}" in
            0)
              python - <<'PY'
          import json
          r = json.load(open('sales-v04-r1-gemini-report.json'))
          assert r.get('verdict') in {'PASS', 'REVISE'}, f"invalid complete-run verdict: {r.get('verdict')!r}"
          PY
              ;;
            10)
              python - <<'PY'
          import json
          r = json.load(open('sales-v04-r1-gemini-report.json'))
          assert r.get('verdict') == 'REVISE', f"exit 10 must be REVISE, got {r.get('verdict')!r}"
          PY
              ;;
            *) echo "unexpected qualification exit code: ${qualification_exit_code:-missing}" >&2; exit 1 ;;
          esac
