name: Sales 0.2 fresh sealed qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SALES_SEALED_PACK_KEY: ${{ secrets.SALES_SEALED_PACK_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SALES_MODEL: gpt-5.6-terra
      SALES_CANDIDATE_TIMEOUT_SECONDS: '240'
      SALES_MODEL_TIMEOUT_SECONDS: '180'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluator crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Fail-closed static and credential preflight
        run: |
          python3 architect/evaluation/qualification-platform/qualification_preflight.py \
            --manifest architect/evaluation/sales-lead-conversion/sealed/fresh-cycle-0.2-2026-08-22.qualification.json \
            --phase static \
            --require-runtime-secret
      - name: Fail-closed sealed held-out preflight
        run: |
          python3 architect/evaluation/qualification-platform/qualification_preflight.py \
            --manifest architect/evaluation/sales-lead-conversion/sealed/fresh-cycle-0.2-2026-08-22.qualification.json \
            --phase sealed \
            --out-dir "$RUNNER_TEMP/sales-0.2-sealed-pack"
      - name: Run scored Sales 0.2 qualification
        shell: bash
        run: |
          set +e
          PACK="$RUNNER_TEMP/sales-0.2-sealed-pack"
          python3 "$PACK/runner.py" \
            --pack-dir "$PACK" \
            --executor-cmd "python3 architect/evaluation/sales-lead-conversion/executor_v0_2_responses.py" \
            --model "$SALES_MODEL" \
            --out "$RUNNER_TEMP/sales-0.2-qualification-report.json"
          code=$?
          echo "qualification_exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Require sanitized report presence
        if: always()
        shell: bash
        run: |
          if [ ! -s "$RUNNER_TEMP/sales-0.2-qualification-report.json" ]; then
            echo "report_missing=1" >> "$GITHUB_ENV"
          else
            echo "report_missing=0" >> "$GITHUB_ENV"
          fi
      - name: Publish sanitized Sales 0.2 report artifact
        if: always() && env.report_missing == '0'
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.2-fresh-sealed-qualification-report
          path: ${{ runner.temp }}/sales-0.2-qualification-report.json
          retention-days: 14
      - name: Enforce qualification verdict
        if: always()
        run: |
          test "${report_missing:-1}" = "0"
          test "${qualification_exit_code:-missing}" = "0"
