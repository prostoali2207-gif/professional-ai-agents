name: Sales 0.2 fresh sealed qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen Sales 0.2 candidate
        run: git cat-file -e 824216b9eb225a4509f98f1c31892a80935f3bd7^{commit}
      - name: Install evaluator crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Decrypt and verify evaluator-owned Sales 0.2 sealed pack
        env:
          SEALED_PACK_KEY: ${{ secrets.SALES_SEALED_PACK_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          from cryptography.fernet import Fernet, InvalidToken
          root=pathlib.Path('architect/evaluation/sales-lead-conversion/sealed/fresh-cycle-0.2-2026-08-22.parts')
          parts=[root/f'{i:02d}' for i in range(9)]
          if not all(p.is_file() for p in parts): raise SystemExit('sealed chunk missing')
          token=''.join(p.read_text() for p in parts).encode()
          if len(token)!=13324: raise SystemExit('ciphertext length mismatch')
          if hashlib.sha256(token).hexdigest()!='ba9d90a56b64e328f049eac887a35a96206debe6a2016fb92c995d3fabf8b21c': raise SystemExit('ciphertext sha256 mismatch')
          key=os.environ.get('SEALED_PACK_KEY','').encode().strip()
          if not key: raise SystemExit('SALES_SEALED_PACK_KEY missing')
          if hashlib.sha256(key).hexdigest()!='438070a66cb91c908a6f9b2840fb3978241f0ab67589afae1e9215ea9af15b57': raise SystemExit('sealed key fingerprint mismatch')
          try: raw=Fernet(key).decrypt(token)
          except (InvalidToken,ValueError) as exc: raise SystemExit('sealed authentication/decryption failed') from exc
          if hashlib.sha256(raw).hexdigest()!='5d8ad328c2ba3b4b9fdd2ffd2bf690f5c2b8bea7a30c83803194e04a64c70e9a': raise SystemExit('decrypted zip sha256 mismatch')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'sales-0.2-sealed-pack'; out.mkdir()
          z=pathlib.Path(os.environ['RUNNER_TEMP'])/'sales-0.2-sealed.zip'; z.write_bytes(raw)
          with zipfile.ZipFile(z) as zz: zz.extractall(out)
          freeze=json.loads((out/'freeze-record.json').read_text())
          def h(name): return hashlib.sha256((out/name).read_bytes()).hexdigest()
          assert freeze['fixtures_sha256']=='sha256:'+h('fixtures.json')
          assert freeze['grader_sha256']=='sha256:'+h('grader.json')
          assert freeze['runner_sha256']=='sha256:'+h('runner.py')
          hashes={n:h(n) for n in ('fixtures.json','grader.json','runner.py')}
          canonical=''.join(f'{n}:{hashes[n]}\n' for n in sorted(hashes))
          actual='sha256:'+hashlib.sha256(canonical.encode()).hexdigest()
          assert actual==freeze['pack_digest']=='sha256:a348ddbdb732b9dc21df0e89c7ef5c3182593ed2adb8faa2970a91c3998c291b'
          assert freeze['candidate_commit']=='824216b9eb225a4509f98f1c31892a80935f3bd7'
          assert freeze['candidate_digest']=='sha256:06b9adc5259cabdad5c4f7939db99b8cbcf0c45f8d88d42ceb437f786687a728'
          assert freeze['model']=='gpt-5.6-terra'
          print('sealed Sales 0.2 pack verified')
          PY
      - name: Run scored Sales 0.2 qualification
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SALES_MODEL: gpt-5.6-terra
          SALES_CANDIDATE_TIMEOUT_SECONDS: '240'
          SALES_MODEL_TIMEOUT_SECONDS: '180'
        shell: bash
        run: |
          set +e
          PACK="$RUNNER_TEMP/sales-0.2-sealed-pack"
          python3 "$PACK/runner.py" \
            --pack-dir "$PACK" \
            --executor-cmd "python3 architect/evaluation/sales-lead-conversion/executor_v0_2_responses.py" \
            --model "$SALES_MODEL" \
            --out "$RUNNER_TEMP/sales-0.2-qualification-report.json"
          code=$?
          echo "qualification_exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Publish sanitized Sales 0.2 report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.2-fresh-sealed-qualification-report
          path: ${{ runner.temp }}/sales-0.2-qualification-report.json
          retention-days: 14
      - name: Enforce qualification verdict
        run: test "${qualification_exit_code}" = "0"
