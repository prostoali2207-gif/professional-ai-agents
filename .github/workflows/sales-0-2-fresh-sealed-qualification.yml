name: Sales 0.2 fresh sealed qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SALES_SEALED_PACK_KEY: ${{ secrets.SALES_SEALED_PACK_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SALES_MODEL: gpt-5.6-terra
      SALES_CANDIDATE_TIMEOUT_SECONDS: '240'
      SALES_MODEL_TIMEOUT_SECONDS: '180'
      QUALIFICATION_MANIFEST: architect/evaluation/sales-lead-conversion/sealed/fresh-cycle-0.2-2026-08-22.qualification.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install qualification dependencies
        run: python -m pip install --disable-pip-version-check cryptography jsonschema
      - name: Fail-closed static credential and runtime-contract preflight
        run: |
          python3 architect/evaluation/qualification-platform/qualification_preflight.py \
            --manifest "$QUALIFICATION_MANIFEST" \
            --phase static \
            --require-runtime-secret
      - name: Fail-closed sealed held-out preflight
        run: |
          python3 architect/evaluation/qualification-platform/qualification_preflight.py \
            --manifest "$QUALIFICATION_MANIFEST" \
            --phase sealed \
            --out-dir "$RUNNER_TEMP/sales-0.2-sealed-pack"
      - name: Run scored Sales 0.2 qualification
        shell: bash
        run: |
          set +e
          PACK="$RUNNER_TEMP/sales-0.2-sealed-pack"
          python3 "$PACK/runner.py" \
            --pack-dir "$PACK" \
            --executor-cmd "python3 architect/evaluation/sales-lead-conversion/executor_v0_2_responses.py" \
            --model "$SALES_MODEL" \
            --out "$RUNNER_TEMP/sales-0.2-qualification-report.json"
          code=$?
          echo "qualification_exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Validate sanitized report and write release evidence ledger
        if: always()
        id: validate_report
        shell: bash
        run: |
          python3 architect/evaluation/qualification-platform/validate_sanitized_report.py \
            --report "$RUNNER_TEMP/sales-0.2-qualification-report.json" \
            --cycle-id "sales-lead-conversion-0.2-fresh-2026-08-22" \
            --candidate-commit "824216b9eb225a4509f98f1c31892a80935f3bd7" \
            --candidate-digest "sha256:06b9adc5259cabdad5c4f7939db99b8cbcf0c45f8d88d42ceb437f786687a728" \
            --pack-digest "sha256:a348ddbdb732b9dc21df0e89c7ef5c3182593ed2adb8faa2970a91c3998c291b" \
            --model "$SALES_MODEL" \
            --runner-exit-code "${qualification_exit_code:-255}" \
            --ledger-out "$RUNNER_TEMP/sales-0.2-release-evidence.json"
      - name: Publish sanitized qualification evidence
        if: always() && steps.validate_report.outcome == 'success'
        id: upload_evidence
        uses: actions/upload-artifact@v4
        with:
          name: sales-0.2-fresh-sealed-qualification-evidence
          path: |
            ${{ runner.temp }}/sales-0.2-qualification-report.json
            ${{ runner.temp }}/sales-0.2-release-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce qualification verdict
        if: always()
        run: |
          test "${qualification_exit_code:-missing}" = "0"
          test "${{ steps.validate_report.outcome }}" = "success"
          test "${{ steps.upload_evidence.outcome }}" = "success"
