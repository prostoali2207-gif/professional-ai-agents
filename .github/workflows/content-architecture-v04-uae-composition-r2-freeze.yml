name: Content Architecture v0.4 UAE composition r2 freeze

on:
  push:
    branches:
      - eval/content-architecture-v04-uae-composition-r2
    paths:
      - 'architect/evaluation/content-architecture-v04-uae-composition-r2/FREEZE-UAE-R2-v0.1'

permissions:
  contents: read

jobs:
  prepare-wheelhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned Windows evaluator dependency
        shell: bash
        run: |
          mkdir -p wheelhouse
          python -m pip download --disable-pip-version-check --no-input --only-binary=:all: --platform win_amd64 --python-version 312 --implementation cp --abi cp312 --dest wheelhouse cryptography==44.0.2
      - uses: actions/upload-artifact@v4
        with:
          name: content-architecture-v04-uae-r2-freeze-wheelhouse
          path: wheelhouse/
          retention-days: 1

  freeze:
    needs: prepare-wheelhouse
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      QUALIFICATION_SEALED_PACK_MASTER_KEY: ${{ secrets.QUALIFICATION_SEALED_PACK_MASTER_KEY }}
      FROZEN_ARTIFACT_CODEX_MODEL: gpt-5.6-sol
      FROZEN_ARTIFACT_CODEX_REASONING: medium
      FROZEN_ARTIFACT_CODEX_TIMEOUT: '300'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: content-architecture-v04-uae-r2-freeze-wheelhouse
          path: ${{ runner.temp }}/ca-v04-uae-r2-freeze-wheelhouse
      - name: Install evaluator dependency offline
        shell: powershell
        run: python -m pip install --disable-pip-version-check --no-input --no-index --find-links "$env:RUNNER_TEMP\ca-v04-uae-r2-freeze-wheelhouse" cryptography==44.0.2
      - name: Resolve Codex CLI from interactive user installation
        shell: powershell
        run: |
          $resolved = $null
          $cmd = Get-Command codex -ErrorAction SilentlyContinue
          if ($cmd) { $resolved = $cmd.Source }
          if (-not $resolved) {
            $candidates = @(
              (Join-Path $env:APPDATA 'npm\codex.cmd'),
              (Join-Path $env:APPDATA 'npm\codex.exe'),
              (Join-Path $env:LOCALAPPDATA 'npm\codex.cmd'),
              (Join-Path $env:LOCALAPPDATA 'npm\codex.exe'),
              (Join-Path $env:USERPROFILE '.local\bin\codex.exe'),
              (Join-Path $env:USERPROFILE 'scoop\shims\codex.exe'),
              (Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\codex.exe')
            )
            foreach ($candidate in $candidates) { if (Test-Path $candidate) { $resolved = $candidate; break } }
          }
          if (-not $resolved) {
            $npm = Get-Command npm -ErrorAction SilentlyContinue
            if ($npm) {
              $prefix = (& npm config get prefix 2>$null | Out-String).Trim()
              if ($prefix) {
                foreach ($name in @('codex.cmd','codex.exe')) {
                  $candidate = Join-Path $prefix $name
                  if (Test-Path $candidate) { $resolved = $candidate; break }
                }
              }
            }
          }
          if (-not $resolved) {
            $roots = @(
              (Join-Path $env:LOCALAPPDATA 'OpenAI\Codex\bin'),
              (Join-Path $env:LOCALAPPDATA 'Programs'),
              (Join-Path $env:USERPROFILE '.vscode\extensions'),
              (Join-Path $env:USERPROFILE '.cursor\extensions')
            )
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              $found = Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -in @('codex.exe','codex.cmd') } |
                Select-Object -First 1
              if ($found) { $resolved = $found.FullName; break }
            }
          }
          if (-not $resolved) { Write-Error 'Codex CLI not found'; exit 40 }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $resolved)
          & $resolved --version
          & $resolved login status
      - name: Verify preregistered identities and exact runtime
        shell: powershell
        run: |
          if (-not $env:QUALIFICATION_SEALED_PACK_MASTER_KEY) { exit 31 }
          git fetch origin agent/content-architecture-core-2026-08
          git fetch https://github.com/prostoali2207-gif/auto-sales-growth-system.git agent/content-analyst-rebuild-2026-08
          if ((git cat-file -t 5d440e1bf3e20fbd35c6ab276310a904e36cc06d) -ne 'blob') { exit 32 }
          if ((git cat-file -t 7f41c2d1ba40c3b4c59e3eba2fb264c04162c320) -ne 'blob') { exit 33 }
          $checks = @(
            @('architect/evaluation/content-architecture-v04-uae-composition-r2/author_pack_r2.py','aebfe824585e1d3988511fa80037b41fcc288302'),
            @('architect/evaluation/content-architecture-v04-uae-composition-r2/run_uae_r2.py','7e7cffa63856a44e4450f8d14ce05b9a497b83e8'),
            @('architect/evaluation/content-architecture-v04-uae-composition-r2/test_uae_r2.py','a04acb46542ef1db54e644f0fb949617f962af04'),
            @('architect/evaluation/content-architecture-v04-uae-composition-r2/preregistration-r2.json','94778a9bc65fc46a6d62b24e7f9756129a1d2634'),
            @('architect/evaluation/content-architecture-v04-uae-composition-r1/judge-uae-composition.md','669cdfcd0195d0507637d377b48f2650b4a870dd'),
            @('architect/evaluation/harness/adapters/codex_frozen_artifact_adapter.py','d1ef178b739a638a883c5a1d0efe5e431bd3b34d'),
            @('architect/evaluation/harness/adapters/codex_frozen_artifact_mcp.py','73e9349391d4aa83dd459ed23e4069a3cf9a2072')
          )
          foreach ($item in $checks) {
            $actual = (git hash-object $item[0]).Trim()
            if ($actual -ne $item[1]) { Write-Error "Frozen blob mismatch: $($item[0]) actual=$actual"; exit 34 }
          }
          @'
          import subprocess
          auth=subprocess.run(['codex','login','status'],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=15)
          if auth.returncode != 0 or 'Logged in using ChatGPT' not in ((auth.stdout or '')+(auth.stderr or '')): raise SystemExit(41)
          ver=subprocess.run(['codex','--version'],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=15)
          version=((ver.stdout or '')+(ver.stderr or '')).strip()
          if ver.returncode != 0 or version != 'codex-cli 0.151.0-alpha.7.2': raise SystemExit(42)
          print('frozen UAE r2 runtime: PASS')
          '@ | python -
      - name: Run construct regression tests
        shell: powershell
        run: python architect/evaluation/content-architecture-v04-uae-composition-r2/test_uae_r2.py
      - name: Author fresh r2 corpus and record composition identity
        shell: powershell
        run: |
          $pack = Join-Path $env:RUNNER_TEMP 'ca-v04-uae-r2-freeze-pack'
          New-Item -ItemType Directory -Force -Path $pack | Out-Null
          python architect/evaluation/content-architecture-v04-uae-composition-r2/author_pack_r2.py --out $pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PACK_DIR = $pack
          @'
          import importlib.util, json, os, pathlib
          p=pathlib.Path(os.environ['PACK_DIR'])
          m=json.loads((p/'sealed-manifest.json').read_text(encoding='utf-8'))
          assert m['gate_id']=='content-architecture-v0.4-uae-composition-2026-09-01-r2'
          assert m['case_count']==8 and m['calibration_pair_count']==3
          assert m['core_sha']=='5d440e1bf3e20fbd35c6ab276310a904e36cc06d'
          assert m['specialization_sha']=='7f41c2d1ba40c3b4c59e3eba2fb264c04162c320'
          spec=importlib.util.spec_from_file_location('r','architect/evaluation/content-architecture-v04-uae-composition-r2/run_uae_r2.py')
          r=importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          sha, ident=r.assemble_composed_blob()
          (p/'composition-identity.json').write_text(json.dumps({'composed_blob_sha':sha,'composed_identity_sha256':ident},indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('corpus/composition identity: PASS')
          '@ | python -
      - name: Calibrate frozen UAE assessor before candidate execution
        shell: powershell
        run: |
          $pack = Join-Path $env:RUNNER_TEMP 'ca-v04-uae-r2-freeze-pack\sealed-pack.bin'
          $out = Join-Path $env:RUNNER_TEMP 'ca-v04-uae-r2-freeze-calibration'
          python architect/evaluation/content-architecture-v04-uae-composition-r2/run_uae_r2.py --mode calibrate --pack $pack --out $out --timeout 300
      - name: Build freeze evidence
        shell: powershell
        run: |
          $env:PACK_DIR = Join-Path $env:RUNNER_TEMP 'ca-v04-uae-r2-freeze-pack'
          $env:CAL_DIR = Join-Path $env:RUNNER_TEMP 'ca-v04-uae-r2-freeze-calibration'
          @'
          import hashlib, json, os, pathlib, subprocess
          pack=pathlib.Path(os.environ['PACK_DIR']); cal=pathlib.Path(os.environ['CAL_DIR'])
          manifest=json.loads((pack/'sealed-manifest.json').read_text(encoding='utf-8'))
          comp=json.loads((pack/'composition-identity.json').read_text(encoding='utf-8'))
          report=json.loads((cal/'calibration-report.json').read_text(encoding='utf-8'))
          assert report['status']=='CALIBRATION_PASS' and report['candidate_calls']==0
          evidence={
            'gate_id':manifest['gate_id'],
            'status':'FROZEN_PRE_SCORE',
            'candidate_calls':0,
            'corpus_identity_sha256':manifest['plain_identity_sha256'],
            'case_count':manifest['case_count'],
            'calibration_pair_count':manifest['calibration_pair_count'],
            'composed_blob_sha':comp['composed_blob_sha'],
            'composed_identity_sha256':comp['composed_identity_sha256'],
            'calibration_report_sha256':hashlib.sha256((cal/'calibration-report.json').read_bytes()).hexdigest(),
            'runtime':{'provider':'codex-cli-chatgpt-subscription','model':'gpt-5.6-sol','reasoning_effort':'medium','codex_cli_version':'0.151.0-alpha.7.2'},
            'frozen_blobs':{'author':'aebfe824585e1d3988511fa80037b41fcc288302','runner':'7e7cffa63856a44e4450f8d14ce05b9a497b83e8','test':'a04acb46542ef1db54e644f0fb949617f962af04','preregistration':'94778a9bc65fc46a6d62b24e7f9756129a1d2634','judge':'669cdfcd0195d0507637d377b48f2650b4a870dd'}
          }
          ev=pack/'freeze-evidence.json'; ev.write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(evidence,sort_keys=True))
          '@ | python -
      - name: Upload UAE r2 freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: content-architecture-v04-uae-composition-r2-freeze-evidence
          path: |
            ${{ runner.temp }}/ca-v04-uae-r2-freeze-pack/sealed-manifest.json
            ${{ runner.temp }}/ca-v04-uae-r2-freeze-pack/composition-identity.json
            ${{ runner.temp }}/ca-v04-uae-r2-freeze-pack/freeze-evidence.json
            ${{ runner.temp }}/ca-v04-uae-r2-freeze-calibration/calibration-report.json
          retention-days: 30
