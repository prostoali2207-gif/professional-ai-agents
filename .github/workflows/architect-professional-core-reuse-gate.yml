name: Agent Architect Professional Core Reuse Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'architect/SKILL.md'
      - 'architect/methodology/professional-core-reuse.md'
      - 'architect/evaluation/professional-core-reuse-gate.md'
      - 'architect/evaluation/professional_core_reuse/**'
      - '.github/workflows/architect-professional-core-reuse-gate.yml'

permissions:
  contents: read

jobs:
  professional-core-reuse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deterministic preflight
        run: |
          python -m py_compile architect/evaluation/professional_core_reuse/run_semantic_gate.py
          python -m py_compile architect/evaluation/professional_core_reuse/test_contract.py
          cd architect/evaluation/professional_core_reuse
          python -m unittest -v test_contract.py

      - name: Require existing Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo 'GEMINI_API_KEY is not configured; semantic calls were not attempted.' >&2; exit 2)

      - name: Run reliability-sensitive PCR-S2 and PCR-S6 three trials each
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_ARCHITECT_MODEL: gemini-3.5-flash-lite
          GEMINI_THINKING_LEVEL: medium
          PCR_CASE_IDS: PCR-S2,PCR-S6
          PCR_TRIALS: '3'
        run: |
          rm -rf .tmp/professional-core-reuse
          python architect/evaluation/professional_core_reuse/run_semantic_gate.py

      - name: Upload sealed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professional-core-reuse-${{ github.event.pull_request.head.sha }}
          path: .tmp/professional-core-reuse
          if-no-files-found: ignore
