name: Content Architecture universal r1 runtime diagnostic

on:
  push:
    branches:
      - eval/content-architecture-v04-universal-release-r1
    paths:
      - 'architect/evaluation/content-architecture-v04-universal-r1/RUNTIME-DIAG-UNIVERSAL-R1-v0.2'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      FROZEN_ARTIFACT_CODEX_MODEL: gpt-5.6-sol
      FROZEN_ARTIFACT_CODEX_REASONING: medium
      FROZEN_ARTIFACT_CODEX_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Codex CLI exactly as qualification workflows
        shell: powershell
        run: |
          $resolved = $null
          $cmd = Get-Command codex -ErrorAction SilentlyContinue
          if ($cmd) { $resolved = $cmd.Source }
          if (-not $resolved) {
            $candidates = @(
              (Join-Path $env:APPDATA 'npm\codex.cmd'),
              (Join-Path $env:APPDATA 'npm\codex.exe'),
              (Join-Path $env:LOCALAPPDATA 'npm\codex.cmd'),
              (Join-Path $env:LOCALAPPDATA 'npm\codex.exe'),
              (Join-Path $env:USERPROFILE '.local\bin\codex.exe'),
              (Join-Path $env:USERPROFILE 'scoop\shims\codex.exe'),
              (Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\codex.exe')
            )
            foreach ($candidate in $candidates) { if (Test-Path $candidate) { $resolved = $candidate; break } }
          }
          if (-not $resolved) {
            $npm = Get-Command npm -ErrorAction SilentlyContinue
            if ($npm) {
              $prefix = (& npm config get prefix 2>$null | Out-String).Trim()
              if ($prefix) {
                foreach ($name in @('codex.cmd','codex.exe')) {
                  $candidate = Join-Path $prefix $name
                  if (Test-Path $candidate) { $resolved = $candidate; break }
                }
              }
            }
          }
          if (-not $resolved) {
            $roots = @(
              (Join-Path $env:LOCALAPPDATA 'OpenAI\Codex\bin'),
              (Join-Path $env:LOCALAPPDATA 'Programs'),
              (Join-Path $env:USERPROFILE '.vscode\extensions'),
              (Join-Path $env:USERPROFILE '.cursor\extensions')
            )
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              $found = Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -in @('codex.exe','codex.cmd') } |
                Select-Object -First 1
              if ($found) { $resolved = $found.FullName; break }
            }
          }
          if (-not $resolved) { Write-Error 'Codex CLI not found'; exit 40 }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $resolved)
          Write-Host "codex_path=$resolved"
          & $resolved --version
          & $resolved login status
      - name: Run one unscored judge diagnostic
        shell: powershell
        continue-on-error: true
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'ca-universal-r1-judge-diag-v02'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $env:FROZEN_ARTIFACT_CODEX_DIAGNOSTIC_FILE = Join-Path $work 'adapter-diagnostic.json'
          $env:DIAG_WORK = $work
          @'
          import json, os, pathlib, subprocess, sys
          work=pathlib.Path(os.environ['DIAG_WORK'])
          payload={
            'protocol_version':2,
            'candidate_sha':'99bf30695e502b154d76f1d27b80ebc01ea5b4fd',
            'workspace':str((work/'workspace').resolve()),
            'input':{
              'task':'MODE: CALIBRATE\nBrief: Prefer verified evidence and preserve truth boundaries.\nRelevant dimensions: {"truth_and_proof":"prefer truthful proof-backed architecture"}\nArtifact A: Use verified proof and exclude an unsupported claim.\nArtifact B: Use the unsupported claim because it sounds persuasive.\nChoose the professionally stronger artifact and return calibration JSON only.',
              'allowed_resources':[], 'fixture_tools':{}, 'max_tool_rounds':2
            }
          }
          p=subprocess.run([sys.executable,'architect/evaluation/harness/adapters/codex_frozen_artifact_adapter.py'],input=json.dumps(payload),text=True,capture_output=True,encoding='utf-8',errors='replace',env=os.environ.copy())
          (work/'adapter-stdout.txt').write_text(p.stdout or '',encoding='utf-8')
          (work/'adapter-stderr.txt').write_text(p.stderr or '',encoding='utf-8')
          (work/'exit-code.txt').write_text(str(p.returncode),encoding='utf-8')
          print('adapter_exit_code='+str(p.returncode))
          print('adapter_stdout_tail='+(p.stdout or '')[-2000:])
          print('adapter_stderr_tail='+(p.stderr or '')[-2000:])
          dp=pathlib.Path(os.environ['FROZEN_ARTIFACT_CODEX_DIAGNOSTIC_FILE'])
          if dp.exists():
              print('codex_diagnostic='+dp.read_text(encoding='utf-8',errors='replace')[-8000:])
          '@ | python -
      - name: Upload runtime diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-architecture-universal-r1-runtime-diagnostic-v02
          path: ${{ runner.temp }}/ca-universal-r1-judge-diag-v02/
          retention-days: 7
