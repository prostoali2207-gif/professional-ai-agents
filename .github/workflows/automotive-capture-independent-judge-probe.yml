name: Automotive Capture independent judge probe

on:
  push:
    branches:
      - agent/automotive-capture-capability-2026-09
    paths:
      - '.github/workflows/automotive-capture-independent-judge-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TARGET_OPENAI_JUDGE_MODEL: gpt-5.6-terra
    steps:
      - name: Probe independent providers without generation
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          out={}
          target=os.environ['TARGET_OPENAI_JUDGE_MODEL']
          for name,url,header in [
            ('openai','https://api.openai.com/v1/models', {'Authorization':f"Bearer {os.environ.get('OPENAI_API_KEY','')}"}),
            ('groq','https://api.groq.com/openai/v1/models', {'Authorization':f"Bearer {os.environ.get('GROQ_API_KEY','')}", 'Accept':'application/json'}),
          ]:
            key=os.environ.get('OPENAI_API_KEY' if name=='openai' else 'GROQ_API_KEY','').strip()
            if not key:
              out[name]={'configured':False,'http_status':None,'usable_models_endpoint':False}
              continue
            req=urllib.request.Request(url,headers=header)
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                payload=json.loads(r.read().decode())
                ids={m.get('id') for m in payload.get('data',[]) if isinstance(m,dict)} if isinstance(payload,dict) else set()
                row={'configured':True,'http_status':r.status,'usable_models_endpoint':r.status==200,'model_count':len(ids)}
                if name=='openai': row['target_model_available']=target in ids
                out[name]=row
            except urllib.error.HTTPError as e:
              out[name]={'configured':True,'http_status':e.code,'usable_models_endpoint':False}
            except Exception as e:
              out[name]={'configured':True,'http_status':None,'usable_models_endpoint':False,'error_type':type(e).__name__}
          print(json.dumps(out,sort_keys=True))
          if not out.get('openai',{}).get('target_model_available'):
            raise SystemExit(3)
          PY

      - name: Accounting
        if: always()
        run: |
          echo 'generation_calls=0'
          echo 'purpose=independent-judge target-model eligibility only'
