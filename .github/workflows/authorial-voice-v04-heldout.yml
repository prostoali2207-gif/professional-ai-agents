name: Authorial Voice v0.4 held-out qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AUTHORIAL_VOICE_CANDIDATE_MODEL: gemini-3.5-flash-lite
      AUTHORIAL_VOICE_GEMINI_JUDGE_MODEL: gemini-3.5-flash-lite
      AUTHORIAL_VOICE_GROQ_MODEL: qwen/qwen3.6-27b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight frozen identities
        run: |
          test "$(git hash-object architect/library/cores/social-content-creative/0.1.0/professional-model.md)" = "d8eee4c6f9141f362d91a340c37dcae6ad6bfa71"
          test "$(git hash-object architect/research/social-content-creative/professional-model-candidate-v0.4-authorial-voice-overlay.md)" = "abed0d6762299c82b82e603355beac9f79b4cca2"
          test "$(git hash-object architect/research/social-content-creative/authorial-voice-qualification-protocol-v0.2.md)" = "c9942aa64cead4f0b55c7949a6a59debbde88356"
          python -m py_compile architect/evaluation/social_content_creative/run_authorial_voice_v04_heldout.py
      - name: Run fresh held-out + multi-judge + PBGS practical
        run: python architect/evaluation/social_content_creative/run_authorial_voice_v04_heldout.py
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorial-voice-v04-heldout-sanitized-${{ github.sha }}
          path: .tmp/authorial-voice-v04-heldout/sanitized-report.json
          if-no-files-found: error
          retention-days: 60
      - name: Upload consumed held-out evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorial-voice-v04-heldout-consumed-${{ github.sha }}
          path: .tmp/authorial-voice-v04-heldout/full-consumed-evidence.json
          if-no-files-found: warn
          retention-days: 30
