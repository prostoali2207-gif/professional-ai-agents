name: Analytics v0.4 stability gate

# Manual only. This stage consumes provider quota, so per
# architect/evaluation/qualification-platform/paid-execution-policy.md it must never be
# reachable from push or pull_request.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Model family to execute'
        required: true
        default: gemini
        type: choice
        options: [gemini, groq]
      trials:
        description: 'Independent trials per fixture (preregistered default is 3)'
        required: false
        default: '3'
        type: string

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANALYTICS_CANDIDATE_MANIFEST: architect/evaluation/growth-experimentation-analytics/candidate-freeze-v0.4.json
      ANALYTICS_CANDIDATE_TIMEOUT_SECONDS: '300'
      ANALYTICS_MODEL_TIMEOUT_SECONDS: '240'
      ANALYTICS_TEMPERATURE: '0'
      ANALYTICS_PACE_SECONDS: '3'
      PREREGISTRATION: architect/evaluation/growth-experimentation-analytics/preregistration-v0.4-stability-2026-08-27.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deterministic checks before any credential is used
        run: |
          set -euo pipefail
          python3 -m py_compile \
            architect/evaluation/growth-experimentation-analytics/executor_gemini.py \
            architect/evaluation/growth-experimentation-analytics/executor_groq.py \
            architect/evaluation/growth-experimentation-analytics/grader_v04_structural.py \
            architect/evaluation/growth-experimentation-analytics/run_stability_gate_v04.py
          python3 architect/evaluation/growth-experimentation-analytics/test_decision_record_stability_v04.py

      - name: Bind provider
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.provider }}" = "gemini" ]; then
            echo "ANALYTICS_CANDIDATE_CMD=python3 architect/evaluation/growth-experimentation-analytics/executor_gemini.py" >> "$GITHUB_ENV"
            echo "ANALYTICS_MODEL=gemini-3.5-flash-lite" >> "$GITHUB_ENV"
            echo "GEMINI_THINKING_LEVEL=medium" >> "$GITHUB_ENV"
          else
            echo "ANALYTICS_CANDIDATE_CMD=python3 architect/evaluation/growth-experimentation-analytics/executor_groq.py" >> "$GITHUB_ENV"
            echo "ANALYTICS_MODEL=qwen/qwen3.6-27b" >> "$GITHUB_ENV"
          fi

      - name: Require the selected provider credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.provider }}" = "gemini" ]; then
            test -n "${GEMINI_API_KEY:-}" || { echo 'GEMINI_API_KEY missing' >&2; exit 2; }
          else
            test -n "${GROQ_API_KEY:-}" || { echo 'GROQ_API_KEY missing' >&2; exit 2; }
          fi

      - name: Run preregistered repeated-trial gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          python3 architect/evaluation/growth-experimentation-analytics/run_stability_gate_v04.py \
            --preregistration "$PREREGISTRATION" \
            --trials "${{ inputs.trials }}" \
            --outdir "$RUNNER_TEMP/analytics-v04-stability"

      - name: Preserve every trial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-v0-4-stability-${{ inputs.provider }}
          path: ${{ runner.temp }}/analytics-v04-stability/*.json
          if-no-files-found: ignore
          retention-days: 14
